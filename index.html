  pixText(c, "SKOK", B.C.x, B.C.y+2.5, 6, "#17191d", "center", false);
  c.restore();
}

function drawPlay(c) {
  const shx = game.shake>0.4 ? rnd(-game.shake, game.shake) : 0;
  const shy = game.shake>0.4 ? rnd(-game.shake, game.shake)*0.5 : 0;
  c.save(); c.translate(Math.round(shx), Math.round(shy));
  LV().bg(c, game.camX, game.t);
  for (const b of BACKDROPS)
    if (b.x - game.camX > -(b.w+40) && b.x - game.camX < VW+40) b.draw(c, Math.round(b.x-game.camX), b.y);
  drawStreetSign(c, game.camX);

  for (const p of bloodPuddles) {
    const sx = p.x - game.camX;
    if (sx < -30 || sx > VW+30) continue;
    c.fillStyle = p.col;
    for (const bl of p.blobs) { c.beginPath(); c.ellipse(sx+bl.dx, p.y+bl.dy, bl.rx, bl.ry, 0, 0, 7); c.fill(); }
  }

  // depth-sorted world
  const items = [];
  for (const p of PROPS) if (p.x-game.camX > -140 && p.x-game.camX < VW+40)
    items.push({ y:p.base, draw:()=>p.draw(cx, Math.round(p.x-game.camX), p.base) });
  for (const p of pickups) items.push({ y:p.y, draw:()=>drawPickup(c,p,game.camX) });
  for (const w of weapons) if (w.x-game.camX>-30 && w.x-game.camX<VW+30) items.push({ y:w.y, draw:()=>drawWeapon(c,w,game.camX) });
  for (const k of cars) if (k.x-game.camX>-90 && k.x-game.camX<VW+90) items.push({ y:k.y, draw:()=>k.draw(c, game.camX) });
  for (const e of game.enemies) if (!e.dead) items.push({ y:e.y, draw:()=>e.draw(c, game.camX) });
  items.push({ y:game.player.y, draw:()=>game.player.draw(c, game.camX) });
  for (const b of bottles) items.push({ y:b.y, draw:()=>drawBottleProj(c,b,game.camX) });
  items.sort((a,b)=>a.y-b.y);
  for (const it of items) it.draw();

  // gibs + floaters
  for (const g of gibs) { c.fillStyle=g.col; const s=g.sz||2; c.fillRect(Math.round(g.x-game.camX-s/2), Math.round(g.y), s, s); }
  for (const f of floaters) {
    const a = 1 - f.t/f.life;
    c.globalAlpha = Math.min(1, a*2);
    pixText(c, f.txt, Math.round(f.x-game.camX), Math.round(f.y - f.t*0.25), 8, f.col);
    c.globalAlpha = 1;
  }
  for (const tr of tracers) drawTracer(c, tr, game.camX);
  for (const s of sparks) drawSpark(c, s, game.camX);
  if (LV().fg) LV().fg(c, game.camX);
  c.restore();
  drawHUD(c);
  drawTouchUI(c);
  if (game.paused) {
    c.fillStyle = "rgba(10,10,14,0.62)"; c.fillRect(0, 0, VW, VH);
    pixText(c, "PAUZA", VW/2, 128, 22, "#e8e4d8");
    pixText(c, "P — wracamy do bijatyki", VW/2, 152, 8, "#c9c4b2");
  }
}

const RUN_SLOPE = 0.24;
const RUN_SEGS = (() => {
  const defs = [["stairs",800],["flat",650],["stairs",700],["flat",750],["stairs",900],["flat",700],["stairs",800],["flat",540]];
  let x = 0, e = 0; const out = [];
  for (const [type, len] of defs) { out.push({ type, x0:x, len, e0:e }); if (type==="stairs") e += len*RUN_SLOPE; x += len; }
  out.total = x; return out;
})();
const RUN_LEN = RUN_SEGS.total;
function runSegAt(x) { x = clamp(x, 0, RUN_LEN-1); for (const sg of RUN_SEGS) if (x < sg.x0 + sg.len) return sg; return RUN_SEGS[RUN_SEGS.length-1]; }
function runElev(x) { const sg = runSegAt(x); return sg.type==="stairs" ? sg.e0 + (clamp(x, 0, RUN_LEN) - sg.x0)*RUN_SLOPE : sg.e0; }
function runGY(wx, r) { return 214 + (runElev(r.x) - runElev(wx)); }

function initRun() {
  game.run = { x:0, z:0, vz:0, spd:2.6, t:0, stumbleT:0, caught:false, catchT:0, crowdGap:235, obstacles:[], done:false };
  const kinds = ["plotek","opony","belka","kloda"];
  let ki = 0, isLast;
  for (let si=0; si<RUN_SEGS.length; si++) {
    const sg = RUN_SEGS[si];
    if (sg.type !== "flat") continue;
    isLast = (si === RUN_SEGS.length-1);
    let ox = sg.x0 + 120;
    const endX = sg.x0 + sg.len - (isLast ? 300 : 110);
    while (ox < endX) {
      const kind = kinds[ki % kinds.length]; ki += irnd(1, 2);
      game.run.obstacles.push({ x:ox, kind, hit:false,
        h: kind==="belka"?16 : kind==="plotek"?14 : kind==="kloda"?11 : 9,
        w: kind==="opony"?34 : kind==="kloda"?20 : 12 });
      ox += irnd(290, 430);
    }
  }
  setMusicMode("boss");
}
function updateRun() {
  const r = game.run;
  r.t++;
  if (game.shake > 0) game.shake *= 0.82;
  if (r.caught) {                                    // dopadli cię — koniec
    r.catchT--;
    r.crowdGap = lerp(r.crowdGap, 4, 0.14);
    if (r.catchT <= 0) {
      game.fromRun = true; game.state = "gameover"; game.endT = 0;
      SFX.ko(); setMusicMode("street");
    }
    return;
  }
  r.spd = Math.min(3.6, 2.6 + r.t*0.0004);
  const jumpPressed = input.jumpHit || input.punchHit || input.kickHit || input.anyTap;
  if (jumpPressed && r.z === 0) { r.vz = 3.35; beep("square", 300, 620, 0.12, 0.2); }
  r.z += r.vz; r.vz -= 0.17;
  if (r.z < 0) { r.z = 0; r.vz = 0; }
  r.x += r.spd;
  r.crowdGap = Math.max(120, 210 - r.t*0.01);        // tłum powoli się zbliża
  for (const o of r.obstacles) {
    if (o.hit) continue;
    if (Math.abs(o.x - r.x) < o.w/2 + 5 && r.z*6 < o.h) {
      o.hit = true; r.caught = true; r.catchT = 58;
      SFX.hurt(); game.shake = 6;
      say(140, 140, "POTKNIĘCIE!", "#c94a4a", 60);
    }
  }
  if (r.x >= RUN_LEN) { game.state = "interlude"; game.endT = 0; setMusicMode("street"); }
}

function tickFX() {
  for (let i=gibs.length-1;i>=0;i--){ const g=gibs[i]; g.x+=g.vx; g.y+=g.vy; g.vy+=0.12; if(--g.life<=0) gibs.splice(i,1); }
  for (let i=sparks.length-1;i>=0;i--){ if (++sparks[i].t > sparks[i].life) sparks.splice(i,1); }
  for (let i=tracers.length-1;i>=0;i--){ if (++tracers[i].t > tracers[i].life) tracers.splice(i,1); }
  for (let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t++; if(f.t>f.life) floaters.splice(i,1); }
}
function startCh5() {
  game.reset(4, false);
  game.state = "ch5intro";
  game.ch5 = { phase:0, t:0 };
  if (AC) startMusic();                 // wybór ścieżki już PO zmianie stanu — gra track5
  const pl = game.player;
  pl.state = "down"; pl.downT = 99999; pl.face = 1;
}
function restartAtBoss() {                                   // powtórka od walki z bossem
  const lv = game.lv;
  game.reset(lv, false);
  const bi = ZONES.findIndex(z => z.boss);
  if (bi > 0) {
    game.zone = bi;
    game.player.x = ZONES[bi].lock - 64;
    game.camX = Math.max(0, game.player.x - VW*0.4);
    game.camLimit = game.player.x + 40;
  }
  game.state = "play";
  if (AC) startMusic();
}
const CHASE_LEN = 3400;
function initChase(tries=0) {
  game.chase = { x:0, y01:0.5, z:0, vz:0, t:0, spd:2.5, tripT:0, tries, gren:[], grenT:150, done:0, boats:[], duds:[] };
  let bx = 560, nb = 0;
  while (bx < CHASE_LEN-460) {
    game.chase.boats.push({ x:bx, kind: (nb++%3===2) ? "pien" : "kuter" });   // co trzecia przeszkoda: zwalony pień
    bx += irnd(430, 640);
  }
  let dx = 360;                                        // stare granaty wbite w piach
  while (dx < CHASE_LEN-360) {
    if (!game.chase.boats.some(b => Math.abs(b.x-dx) < 110))
      game.chase.duds.push({ x:dx, y01: rnd(0.05, 0.95) });
    dx += irnd(200, 360);
  }
  setMusicMode("boss");
}
function chaseLaneY(y01) { return 202 + y01*46; }
function updateChase() {
  const r = game.chase; r.t++; tickFX();
  if (game.shake>0) game.shake *= 0.82;
  if (r.done) { r.done++; if (r.done>=110) { game.state="lift"; game.lift={t:0}; } return; }
  if (r.tripT>0) {
    for (const g of r.gren) if (g.air<=0 && g.fuse<=0 && g.boomA>0 && g.boomA<16) g.boomA++;   // dokończ błysk
    if (--r.tripT<=0) initChase(r.tries+1);
    return;
  }
  r.spd = Math.min(3.5, 2.5 + r.t*0.00045);
  pollInput();
  r.y01 = clamp(r.y01 + input.ay*0.05, 0, 1);
  if (input.jumpHit && r.z===0) {                      // skok tylko SPACJĄ (W/S to ruch po plaży)
    r.vz = 3.4; beep("square", 300, 620, 0.12, 0.2);
  }
  r.z += r.vz; r.vz -= 0.17; if (r.z<0){ r.z=0; r.vz=0; }
  r.x += r.spd;
  // przeszkody w poprzek plaży — tylko skok (pień jest niższy od kutra)
  for (const b of r.boats) {
    const h = b.kind==="pien" ? 18 : 34, w = b.kind==="pien" ? 15 : 17;    // dzioby są wąskie — skok łatwiejszy
    if (Math.abs(b.x - r.x) < w && r.z*6 < h) { chaseTrip(r, b.kind==="pien" ? "O PIEŃ!" : "O KUTER!"); return; }
  }
  // stare granaty w piachu — omiń albo przeskocz
  for (let i=r.duds.length-1; i>=0; i--) {
    const d = r.duds[i];
    if (Math.abs(d.x - r.x) < 10 && Math.abs(chaseLaneY(d.y01) - chaseLaneY(r.y01)) < 12 && r.z*6 < 12) {
      r.duds.splice(i, 1);
      r.gren.push({ x:d.x, y01:d.y01, air:0, fuse:0, boomA:1 });    // sam błysk wybuchu
      game.shake = 6; SFX.boom();
      chaseTrip(r, "STARY GRANAT!"); return;
    }
  }
  // granaty zza pleców
  if (--r.grenT <= 0) {
    r.grenT = Math.round(Math.max(52, 128 - r.t*0.012) * DIFFS[difficulty].cool);
    r.gren.push({ x: r.x + irnd(110, 230), y01: Math.random()<0.5 ? r.y01 : rnd(0,1), air:42, fuse:34, boomA:0 });
  }
  for (const g of r.gren) {
    if (g.air>0) { g.air--; continue; }
    if (g.fuse>0) { g.fuse--; continue; }
    if (g.boomA===0) {
      game.shake = 5; SFX.boom();
      const py = chaseLaneY(r.y01), gy = chaseLaneY(g.y01);
      if (Math.abs(g.x - r.x)<26 && Math.abs(gy - py)<15 && r.z*6<16) { g.boomA=1; chaseTrip(r, "GRANAT!"); return; }
    }
    g.boomA++;
  }
  r.gren = r.gren.filter(g => g.boomA < 16 && g.x > r.x - 180);
  if (r.x >= CHASE_LEN) { r.done = 1; setMusicMode("street"); }
}
function chaseTrip(r, why) {
  r.tripT = 88; r.why = why;
  SFX.hurt(); SFX.thud(); game.shake = 7;
}

// Logika gry — dokładnie 60 kroków na sekundę, niezależnie od odświeżania ekranu.
function stepGame() {
  game.t++;
  if (game.state==="splash") {
    if (input.anyTap || input.lvl1Hit || input.lvl2Hit || input.lvl3Hit) { game.state="title"; startMusic(); }
  } else if (game.state==="title") {
    const inBtn = (bx) => input.tapX!==null && input.tapX>bx && input.tapX<bx+80 && input.tapY>198 && input.tapY<226;
    const goDiff = (lv, viaIntro) => { game.selLv = lv; game.viaIntro = viaIntro; game.state = "diff"; };
    if (input.lvl1Hit || inBtn(VW/2-205))      goDiff(0, false);
    else if (input.lvl2Hit || inBtn(VW/2-123)) goDiff(1, false);
    else if (input.lvl3Hit || inBtn(VW/2-41))  goDiff(2, false);
    else if (input.lvl4Hit || inBtn(VW/2+41))  goDiff(3, false);
    else if (input.lvl5Hit || inBtn(VW/2+123)) goDiff(4, false);
    else if (input.anyTap) goDiff(0, true);    // GRAJ — od początku, z historią
  } else if (game.state==="diff") {
    const inD = (i) => { const bx = VW/2-226+i*114;
      return input.tapX!==null && input.tapX>bx && input.tapX<bx+108 && input.tapY>190 && input.tapY<228; };
    let pick = -1;
    if (input.lvl1Hit || inD(0)) pick = 0;
    else if (input.lvl2Hit || inD(1)) pick = 1;
    else if (input.lvl3Hit || inD(2)) pick = 2;
    else if (input.lvl4Hit || inD(3)) pick = 3;
    if (pick >= 0) {
      difficulty = pick;
      if (game.selLv === 4) startCh5();
      else if (game.viaIntro) { game.state = "intro"; game.introT = 0; }
      else { game.reset(game.selLv, false); game.state = "play"; if (AC) startMusic(); }
    }
  } else if (game.state==="intro") {
    game.introT++;
    if (input.anyTap) {
      if (game.introT < INTRO.length*34) game.introT = INTRO.length*34;
      else { game.reset(); game.state="play"; if (AC) startMusic(); }
    }
  } else if (game.state==="play") {
    if (!game.paused) game.update();
  } else if (game.state==="runintro") {
    game.endT++;
    if (game.endT>50 && input.anyTap) { initRun(); game.state="run"; }
  } else if (game.state==="run") {
    updateRun();
  } else if (game.state==="bossTalk") {
    if (input.anyTap) {
      game.talkIdx++;
      if (game.talkIdx >= game.talk.length) {
        game.state = "play";
        if (game.pendingBanner) { game.bannerText = game.pendingBanner; game.bannerT = 160; game.pendingBanner = null; }
      }
    }
  } else if (game.state==="ch5intro") {
    const s5 = game.ch5; s5.t++; tickFX();
    const pl = game.player;
    if (s5.phase===0) {                                  // Franko leży na betonie
      if (s5.t===74) { pl.state="idle"; pl.downT=0; spawnDust(pl.x, pl.y, 4); }
      if (s5.t>=118) { game.talk=[{who:"FRANKO",txt:["— o kurwa....","tylko nie to....."]}]; game.talkIdx=0; s5.phase=1; }
    } else if (s5.phase===1) {                           // dialog 1
      if (input.anyTap) { game.talkIdx++;
        if (game.talkIdx>=game.talk.length) {
          game.talk=null; s5.phase=2; s5.t=0;
          s5.gig = [ new Enemy("gigadres", game.camX+VW+24, 206), new Enemy("gigadres", game.camX+VW+58, 234) ];
          for (const e of s5.gig) { e.face=-1; e.cool=99999; game.enemies.push(e); }
        } }
    } else if (s5.phase===2) {                           // wchodzą gigadresy
      let arrived = true;
      for (const e of s5.gig) {
        const tx = game.camX + VW - 88 - (e.y%40);
        if (e.x > tx) { e.x -= 1.15; e.state="walk"; e.walkT++; arrived=false; } else e.state="idle";
      }
      if (arrived || s5.t>180) { game.talk=[{who:"GIGADRES",txt:["— ŁAPAĆ GO!!!"]}]; game.talkIdx=0; s5.phase=3; }
    } else if (s5.phase===3) {
      if (input.anyTap) { game.talkIdx++;
        if (game.talkIdx>=game.talk.length) {
          game.talk=null;
          for (const e of s5.gig) { e.cool=irnd(30,60); e.entered=true; }
          game.zone=1; game.camLimit=ZONES_5[0].lock;
          game.ch5=null; game.state="play";
        } }
    }
  } else if (game.state==="ch5barszcz") {
    const b5 = game.ch5b; b5.t++; tickFX();
    if (b5.phase===0) {                                  // Franko ogląda barszcz
      if (b5.t>16 && input.anyTap) { game.talkIdx++;
        if (game.talkIdx>=game.talk.length) {
          game.talk=null; b5.phase=1; b5.t=0; b5.crowd=[];
          for (let i=0;i<8;i++) {
            const side = i%2 ? -1 : 1;
            const e = new Enemy("zolnierz", game.camX + (side>0 ? VW+20+(i*13) : -20-(i*13)), 202+(i*9)%46);
            e.face = -side; e.cool=99999; b5.crowd.push(e); game.enemies.push(e);
          }
        } }
    } else if (b5.phase===1) {                           // wojsko otacza
      let done = true;
      for (const e of b5.crowd) {
        const tx = e.face>0 ? game.camX+42+((e.y*3)%70) : game.camX+VW-42-((e.y*3)%70);
        if (Math.abs(e.x-tx)>3) { e.x += Math.sign(tx-e.x)*1.35; e.state="walk"; e.walkT++; done=false; }
        else e.state="idle";
      }
      if (done || b5.t>150) { game.talk=[{who:"ŻOŁNIERZE",txt:["— ŁAPAĆ CHUJA!","ZA BURAKA!!!"]}]; game.talkIdx=0; b5.phase=2; }
    } else if (b5.phase===2) {
      if (input.anyTap) { game.talkIdx++;
        if (game.talkIdx>=game.talk.length) {
          game.talk=null; game.ch5b=null;
          game.state="ch5slide"; game.slide={t:0}; setMusicMode("boss");
        } }
    }
  } else if (game.state==="ch5slide") {
    game.slide.t++; tickFX();
    if (game.slide.t>=300) { initChase(0); game.state="chase"; }
  } else if (game.state==="chase") {
    if (!game.paused) updateChase();
  } else if (game.state==="lift") {
    game.lift.t++; tickFX();
    if (game.lift.t>190) { game.state="ch5outro"; game.out5={phase:0,t:0}; setMusicMode("street"); }
  } else if (game.state==="ch5outro") {
    const o5 = game.out5; o5.t++; tickFX();
    if (input.anyTap) {
      if (o5.phase===0 && o5.t>30) { o5.phase=1; o5.t=0; }
      else if (o5.phase===1 && o5.t>340) { game.out5=null; game.state="title"; if (AC) startMusic(); }
    }
  } else if (game.state==="outro") {
    const r = game.outro || (game.outro = { phase:0, t:0 });
    r.t++;
    if (r.phase===1) {
      const p = clamp(r.t / 450, 0, 1);
      musicWind(1.0 - p*0.9, 1.0 - p*0.85);
      if (r.t >= 450) { r.phase = 2; r.t = 0; }
    }
    if (input.anyTap) {
      if (r.phase===0 && r.t>20) { r.phase=1; r.t=0; }
      else if (r.phase===2 && r.t>160) { musicWind(1.0, 1.0); game.outro=null; startCh5(); }
    }
  } else if (game.state==="interlude") {
    game.endT++;
    if (game.endT>50 && input.anyTap) { game.reset(game.lv+1, true); game.state="play"; }
  } else if (game.state==="gameover") {
    game.endT++;
    if (game.endT>40 && input.anyTap) {
      if (game.fromRun) { initRun(); game.state="run"; }                    // wywrotka w ucieczce → od startu biegu
      else if (game.retryBoss) { restartAtBoss(); }                         // poległeś u bossa → od bossa
      else { const lv=game.lv; game.reset(lv, false); game.state="play"; if (AC) startMusic(); }  // → od początku rozdziału
      game.retryBoss = false;
    }
  }
}

function render() {
  const st = game.state;
  if (st==="splash") drawSplash(cx);
  else if (st==="title") drawTitle(cx);
  else if (st==="diff") drawDiff(cx);
  else if (st==="intro") drawIntro(cx);
  else if (st==="play") drawPlay(cx);
  else if (st==="runintro") drawRunIntro(cx);
  else if (st==="run") drawRun(cx);
  else if (st==="bossTalk") { drawPlay(cx); drawTalkBox(cx); }
  else if (st==="ch5intro" || st==="ch5barszcz") {
    drawPlay(cx);
    if (st==="ch5barszcz" && game.burakDown) drawBarszcz(cx, game.burakDown.x - game.camX, game.burakDown.y);
    if (game.talk) drawTalkBox(cx);
  }
  else if (st==="ch5slide") drawCh5Slide(cx);
  else if (st==="chase") drawChase(cx);
  else if (st==="lift") drawLift(cx);
  else if (st==="ch5outro") drawCh5Outro(cx);
  else if (st==="outro") drawOutro(cx);
  else if (st==="interlude") drawInterlude(cx);
  else if (st==="gameover") drawGameOver(cx);
  drawCRT(cx);
}

// stały krok czasu — 60 Hz logiki, rysowanie raz na klatkę wyświetlacza
const STEP = 1000/60;
let lastTS = 0, acc = 0;
function loop(ts) {
  if (!lastTS) lastTS = ts;
  acc += Math.min(ts - lastTS, 100);   // po powrocie z tła nie nadrabiamy sekund
  lastTS = ts;
  let n = 0;
  while (acc >= STEP && n < 4) { stepGame(); clearEdges(); acc -= STEP; n++; }
  if (acc >= STEP) acc = 0;            // przeciążenie — gubimy czas, nie klatki
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
