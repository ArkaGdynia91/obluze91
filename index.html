const EN_RULES = [
  [/^BUTELKI: (\d+)  ·  PREMIA (\d+)$/, (m) => "BOTTLES: " + m[1] + "  ·  BONUS " + m[2]],
  [/^7 · REKORDY  (.*)$/, (m) => "7 · HIGH SCORES  " + m[1]],
  [/^PUNKTY (.*)$/, (m) => "SCORE " + m[1]],
  [/^PUNKTY: (.*)$/, (m) => "SCORE: " + m[1]],
  [/^BUTELKI: (\d+) \/ (\d+)(.*)$/, (m) => "BOTTLES: " + m[1] + " / " + m[2] + (m[3] ? "  · ALL OF THEM!" : "")],
  [/^BUTELKI (.*)$/, (m) => "BOTTLES " + m[1]],
  [/^DOWOLNY KLAWISZ — (.*)$/, (m) => "ANY KEY — " + tr(m[1])],
  [/^żyć: (.*?) · .*$/, (m) => "lives: " + m[1] + " · enemies hit harder and last longer →"],
  [/^(\d)·(.+)$/, (m) => m[1] + "·" + tr(m[2])],
  [/^▪ (.+)$/, (m) => "▪ " + tr(m[1])],
  [/^(.+)!$/, (m) => (EN[m[1]] ? EN[m[1]] + "!" : null)],
  [/^(.+):$/, (m) => (EN[m[1]] ? EN[m[1]] + ":" : null)],
];
function tr(s) {
  if (LANG === "pl" || typeof s !== "string") return s;
  const d = EN[s]; if (d !== undefined) return d;
  for (const [re, fn] of EN_RULES) { const m = s.match(re); if (m) { const r = fn(m); if (r !== null) return r; } }
  if (typeof __trMiss !== "undefined") __trMiss.add(s);          // tylko testy: brakujące tłumaczenia
  return s;
}

function fit() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / VW, wh / VH);  // pełne dopasowanie — także ułamkowe (telefony)
  cv.style.width  = (VW * s) + "px";
  cv.style.height = (VH * s) + "px";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 250));
fit();

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const rnd = (a,b)=>a+Math.random()*(b-a);
const irnd = (a,b)=>Math.floor(rnd(a,b+1));
const lerp = (a,b,t)=>a+(b-a)*t;

// ---------- input ----------
const input = {
  ax:0, ay:0,            // analog stick -1..1
  punch:false, kick:false, jump:false,
  punchHit:false, kickHit:false, jumpHit:false, specHit:false, // edge-triggered
  anyTap:false, tapX:null, tapY:null, lvl1Hit:false, lvl2Hit:false, lvl3Hit:false, lvl4Hit:false, lvl5Hit:false, lvl6Hit:false, lvl7Hit:false, typed:[],
};
const keys = {};
window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  audioInit();
  if (typeof game !== "undefined" && game.state === "hiname") {        // wpisywanie imienia: litery to litery, nie ciosy
    if (!keys[e.code]) {
      if (e.key === "Enter") input.typed.push("\n");
      else if (e.key === "Backspace") { input.typed.push("\b"); e.preventDefault(); }
      else if (e.key.length === 1 && /[\p{L}\p{N} \-!.]/u.test(e.key)) input.typed.push(e.key.toUpperCase());
    }
    keys[e.code] = true;                                                  // strzałki dalej działają jak wybierak
    return;
  }
  if (!keys[e.code]) {
    if (e.code==="Digit1"||e.code==="Numpad1") input.lvl1Hit = true;
    if (e.code==="Digit2"||e.code==="Numpad2") input.lvl2Hit = true;
    if (e.code==="Digit3"||e.code==="Numpad3") input.lvl3Hit = true;
    if (e.code==="Digit4"||e.code==="Numpad4") input.lvl4Hit = true;
    if (e.code==="Digit5"||e.code==="Numpad5") input.lvl5Hit = true;
    if (e.code==="Digit6"||e.code==="Numpad6") input.lvl6Hit = true;
    if (e.code==="Digit7"||e.code==="Numpad7") input.lvl7Hit = true;
    if (e.code==="Digit0"||e.code==="Numpad0") input.langHit = true;
    if (e.code==="KeyZ"||e.code==="KeyJ") input.punchHit = true;
    if (e.code==="KeyX"||e.code==="KeyK") input.kickHit  = true;
    if (e.code==="Space"||e.code==="KeyL") input.jumpHit = true;
    if (e.code==="KeyC"||e.code==="KeyI") input.specHit = true;
    if (e.code==="KeyP"||e.code==="Escape") togglePause();
    if (e.code==="KeyF") toggleFullscreen();
    if (e.code==="KeyM") toggleMusic();
    if (!(e.code==="KeyP"||e.code==="Escape"||e.code==="KeyF"||e.code==="KeyM")) input.anyTap = true;
  }
  keys[e.code] = true;
});
function togglePause(){ if (game.state==="play" || game.state==="maze" || game.state==="chase" || game.state==="run"){ game.paused = !game.paused;
  if (AC){ if (game.paused) AC.suspend(); else AC.resume(); } } }
const fsBtn = document.getElementById("fsBtn");
const iosHint = document.getElementById("iosHint");
if (fsBtn) fsBtn.addEventListener("click", (ev) => {
  ev.stopPropagation();
  const el = document.documentElement;
  if (el.requestFullscreen || el.webkitRequestFullscreen) {
    toggleFullscreen();
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{});
  } else if (iosHint) {                       // iPhone: API niedostępne — podpowiedz A2HS
    iosHint.style.display = "block";
    setTimeout(() => { iosHint.style.display = "none"; }, 6000);
  }
});
function toggleFullscreen(){
  const el = document.getElementById("wrap");
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  else if (document.exitFullscreen) document.exitFullscreen();
}
window.addEventListener("keyup", e => { keys[e.code] = false; });

function pollKeyboard() {
  let ax=0, ay=0;
  if (keys["ArrowLeft"]||keys["KeyA"]) ax-=1;
  if (keys["ArrowRight"]||keys["KeyD"]) ax+=1;
  if (keys["ArrowUp"]||keys["KeyW"]) ay-=1;
  if (keys["ArrowDown"]||keys["KeyS"]) ay+=1;
  if (ax||ay){ input.ax=ax; input.ay=ay; }
  input.punch = !!(keys["KeyZ"]||keys["KeyJ"]);
  input.kick  = !!(keys["KeyX"]||keys["KeyK"]);
}

// virtual joystick (left half) + two buttons (right)
const touch = {
  stickId:null, sx:0, sy:0, dx:0, dy:0, active:false,
  btnA:{ id:null, down:false },   // PIĘŚĆ
  btnB:{ id:null, down:false },   // KOP
  btnC:{ id:null, down:false },   // SKOK
  btnD:{ id:null, down:false },   // OBRÓT
};
function cssToGame(t) {
  const r = cv.getBoundingClientRect();
  return { x:(t.clientX - r.left)/r.width*VW, y:(t.clientY - r.top)/r.height*VH };
}
function btnRects() {
  return {
    A:{ x:VW-36, y:VH-64, r:24 },     // PIĘŚĆ
    B:{ x:VW-92, y:VH-36, r:24 },     // KOP — teraz duży jak pięść
    C:{ x:VW-36, y:VH-16, r:14 },     // SKOK
    D:{ x:VW-92, y:VH-84, r:13 },     // OBRÓT (Z+X)
  };
}
function inCircle(p,c){ const dx=p.x-c.x, dy=p.y-c.y; return dx*dx+dy*dy <= c.r*c.r*1.7; }

cv.addEventListener("touchstart", e => {
  e.preventDefault();
  audioInit();
  input.anyTap = true;
  const B = btnRects();
  const stickOnly = (typeof game !== "undefined") && game.state === "maze";   // na mapie cały ekran to gałka
  for (const t of e.changedTouches) {
    const p = cssToGame(t);
    if (input.tapX===null) { input.tapX = p.x; input.tapY = p.y; }
    if (stickOnly) { if (touch.stickId===null) { touch.stickId=t.identifier; touch.sx=p.x; touch.sy=p.y; touch.dx=0; touch.dy=0; touch.active=true; } continue; }
    if (inCircle(p,B.A) && touch.btnA.id===null) {
      touch.btnA.id=t.identifier; touch.btnA.down=true; input.punchHit=true; continue;
    }
    if (inCircle(p,B.B) && touch.btnB.id===null) {
      touch.btnB.id=t.identifier; touch.btnB.down=true; input.kickHit=true; continue;
    }
    if (inCircle(p,B.C) && touch.btnC.id===null) {
      touch.btnC.id=t.identifier; touch.btnC.down=true; input.jumpHit=true; continue;
    }
    if (inCircle(p,B.D) && touch.btnD.id===null) {
      touch.btnD.id=t.identifier; touch.btnD.down=true; input.specHit=true; continue;
    }
    if (touch.stickId===null && !inCircle(p,B.A) && !inCircle(p,B.B) && !inCircle(p,B.C) && !inCircle(p,B.D)) {
      touch.stickId=t.identifier; touch.sx=p.x; touch.sy=p.y; touch.dx=0; touch.dy=0; touch.active=true;
    }
  }
}, {passive:false});

cv.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier===touch.stickId) {
      const p = cssToGame(t);
      const R = 22;
      let dx=p.x-touch.sx, dy=p.y-touch.sy;
      const m = Math.hypot(dx,dy);
      if (m>R){ dx=dx/m*R; dy=dy/m*R; }
      touch.dx=dx; touch.dy=dy;
    }
  }
}, {passive:false});

function touchEnd(e){
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier===touch.stickId){ touch.stickId=null; touch.active=false; touch.dx=0; touch.dy=0; }
    if (t.identifier===touch.btnA.id){ touch.btnA.id=null; touch.btnA.down=false; }
    if (t.identifier===touch.btnB.id){ touch.btnB.id=null; touch.btnB.down=false; }
    if (t.identifier===touch.btnC.id){ touch.btnC.id=null; touch.btnC.down=false; }
    if (t.identifier===touch.btnD.id){ touch.btnD.id=null; touch.btnD.down=false; }
  }
}
cv.addEventListener("touchend", touchEnd, {passive:false});
cv.addEventListener("touchcancel", touchEnd, {passive:false});
cv.addEventListener("mousedown", (e)=>{ audioInit(); const p = cssToGame(e); input.tapX = p.x; input.tapY = p.y; input.anyTap = true; });

function pollInput() {
  input.ax = 0; input.ay = 0;
  if (touch.active) {
    const dz = 4;
    const m = Math.hypot(touch.dx, touch.dy);
    if (m > dz) { input.ax = touch.dx/22; input.ay = touch.dy/22; }
  }
  pollKeyboard();
  input.punch = input.punch || touch.btnA.down;
  input.kick  = input.kick  || touch.btnB.down;

function beep(type, f0, f1, dur, vol, delay=0) {

  o.frequency.setValueAtTime(f0, t);

  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);

  o.start(t); o.stop(t+dur+0.02);
}

  if (!AC || !sfxOn) return;
  const t = AC.currentTime + delay;
  const n = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1,n,AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp;
  const g = AC.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t);
}

const BASS_STREET = [ 41.2,0,41.2,0, 49,0,41.2,0, 41.2,0,41.2,0, 36.7,0,38.9,0,
                      41.2,0,41.2,0, 49,0,55,0,   49,0,41.2,0,  36.7,0,32.7,0 ];

                      0,0,0,0, 0,0,0,0, 220,0,196,0, 164.8,0,146.8,0 ];

                      41.2,41.2,0,41.2, 43.65,43.65,0,43.65, 55,0,49,0, 46.2,0,43.65,0 ];

                      164.8,0,0,0, 174.6,0,0,0, 261.6,0,246.9,0, 220,0,196,0 ];
function musicTick() {
  if (!AC || !musicOn) return;
  if (typeof game !== "undefined" && game.paused) return;
  if (musicNode) return;                            // gra mp3 — chiptune milczy
  const isBoss = musicMode==="boss";
  const bass = isBoss?BASS_BOSS:BASS_STREET;
  const lead = isBoss?LEAD_BOSS:LEAD_STREET;
  const i = musicStep % 32;
  const b = bass[i], l = lead[i];
  if (b) { beep("square", b, b, isBoss?0.13:0.16, 0.16); beep("square", b*2.01, b*2.01, 0.1, 0.05); }
  if (l) beep("triangle", l, l, 0.2, 0.12);
  if (i%4===0) noiseHit(0.03, 0.06, 6000);           // hat
  if (i%8===4) noiseHit(0.09, 0.14, 350);            // snare-ish thud
  musicStep++;
}
let chipFallback = false, musicNode = null, musicGain = null, musicLv = -1, musicWant = -1;
const musicBufs = {}, musicRaw = {}, musicFailed = {}, musicLoading = {};
const MUSIC_VOL = 0.5;
function startChip() {
  if (musicTimer) clearInterval(musicTimer);
  const bpmMs = musicMode==="boss" ? 110 : 135;
  musicTimer = setInterval(musicTick, bpmMs);
}
function stopChip() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
function currentTrack() {
  const st = (typeof game !== "undefined") ? game.state : "splash";
  if (st==="ch5outro" && game.out5 && game.out5.phase >= 1) return { i:6, src:MUSIC_FILES[6] };   // zachód słońca + napisy
  if ((st==="hiname" || st==="hitable") && musicLv >= 0) return { i:musicLv, src:MUSIC_FILES[musicLv] };
  if (st==="splash" || st==="title" || st==="diff" || st==="intro") return { i:3, src:MUSIC_FILES[3] };
  const lv = (typeof game !== "undefined") ? game.lv : 0;
  const i = [0, 1, 2, 4, 5][lv] ?? 0;
  return { i, src:MUSIC_FILES[i] };
}
function decodeAudio(buf) {                       // Safari-safe: wersja z callbackami
  return new Promise((ok, bad) => { try { const p = AC.decodeAudioData(buf, ok, bad); if (p && p.catch) p.catch(bad); } catch(e) { bad(e); } });
}
function loopPoints(buf) {                        // pomiń ciszę kodera na początku/końcu — pętla bez dziury
  const d = buf.getChannelData(0), n = d.length, th = 0.004, max = Math.min(n, buf.sampleRate*0.25|0);
  let a = 0; while (a < max && Math.abs(d[a]) < th) a++;
  let b = n-1; while (b > n-max && Math.abs(d[b]) < th) b--;
  return { start: a >= max ? 0 : a/buf.sampleRate, end: b <= n-max ? buf.duration : (b+1)/buf.sampleRate };
}
function fetchTrack(i) {                          // pobiera (bez dekodowania) — tani prefetch
  if (musicRaw[i] || musicLoading[i] || musicFailed[i] || typeof fetch === "undefined") return musicLoading[i] || Promise.resolve();
  musicLoading[i] = fetch(MUSIC_FILES[i])
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(buf => { musicRaw[i] = buf; })
    .catch(() => { musicFailed[i] = true; })
    .finally(() => { musicLoading[i] = null; });
  return musicLoading[i];
}
function freeBigBuffers(keep) {                   // zdekodowane 4-minutowe utwory to ~100 MB — trzymamy tylko grany
  for (const k in musicBufs) if (+k !== keep && musicBufs[k] && musicBufs[k].duration > 60) musicBufs[k] = null;
}
function playBuffer(i) {
  const buf = musicBufs[i];
  if (musicNode) {                                // krótkie wyciszenie starej ścieżki
    const old = musicNode, og = musicGain;
    try { og.gain.setTargetAtTime(0, AC.currentTime, 0.12); old.stop(AC.currentTime + 0.6); } catch(e) { try { old.stop(); } catch(e2){} }
  }
  stopChip();
  musicGain = AC.createGain(); musicGain.connect(AC.destination);
  musicGain.gain.setValueAtTime(0, AC.currentTime);
  musicGain.gain.setTargetAtTime(musicOn ? MUSIC_VOL : 0, AC.currentTime + 0.05, 0.25);
  musicNode = AC.createBufferSource(); musicNode.buffer = buf; musicNode.loop = true;
  const lp = buf._lp || (buf._lp = loopPoints(buf));
  musicNode.loopStart = lp.start; musicNode.loopEnd = lp.end;
  musicNode.connect(musicGain); musicNode.start(0, lp.start);
  musicLv = i;
  freeBigBuffers(i);
  const nx = [0, 1, 2, 4, 5, 5][Math.max(0, (typeof game !== "undefined" ? game.lv : 0) + 1)] ;   // następny rozdział — pobierz w tle
  if (nx !== undefined) fetchTrack(nx);

}
function startMusic() {
  if (!AC) return;

    if (musicNode) { try { musicNode.stop(); } catch(e){} musicNode = null; musicLv = -1; }
    if (!musicTimer) startChip();
    return;
  }
  if (musicNode && musicLv === tr.i) return;
  if (musicBufs[tr.i]) { playBuffer(tr.i); return; }
  fetchTrack(tr.i).then(() => {
    if (musicWant !== tr.i) return;                 // gracz już gdzie indziej
    if (musicFailed[tr.i] || !musicRaw[tr.i]) { startMusic(); return; }
    const raw = musicRaw[tr.i]; musicRaw[tr.i] = null;             // decodeAudioData zużywa bufor
    return decodeAudio(raw).then(buf => { musicBufs[tr.i] = buf; if (musicWant === tr.i) playBuffer(tr.i); })
      .catch(() => { musicFailed[tr.i] = true; if (musicWant === tr.i) startMusic(); });
  });

function upath(c, pts, ox=0, oy=0) { c.beginPath(); c.moveTo((pts[0][0]+ox)*U, (pts[0][1]+oy)*U); for (let i = 1; i < pts.length; i++) c.lineTo((pts[i][0]+ox)*U, (pts[i][1]+oy)*U); c.closePath(); }

  } else if (pal.beret) {                                                // beret działkowca

    blob([[-3.2,1.1],[-1.6,-0.4],[1.4,-0.6],[3.3,0.5],[2.8,1.3],[-2.8,1.6]], pal.beret);
    c.fillStyle = shade(pal.beret, -16); c.fillRect(-0.1*U, (hY-1.1)*U, 0.5*U, 0.6*U);
  } else if (pal.czepek) {                                               // czepek pielęgniarki
    hairCap(1.6, 3.4, pal.hair);
    blob([[-2.6,1.6],[-2.2,-0.3],[1.8,-0.5],[2.6,1.3]], "#f6f4ee");
    c.fillStyle = "#b8352f"; c.fillRect(-2.4*U, (hY+0.55)*U, 4.8*U, 0.45*U);
  } else {
    if (st === "fringe") {                                               // Franko: grzywka z objętością
      blob([[-2.8,1.3],[-2.2,-0.6],[-0.4,-1.0],[1.6,-0.9],[2.9,0.3],[3.0,1.4],[2.4,2.5],[1.8,1.6],[1.2,2.3],[0.6,1.5],[-0.4,2.0]], hairC);
      hairCap(1.6, 4.0, hairC);
      c.fillStyle = hairC; upath(c, [[1.6,hY+1.2],[2.6,hY+1.3],[2.3,hY+2.5],[1.8,hY+1.8],[1.2,hY+2.3],[1.0,hY+1.4]]); c.fill();
      c.strokeStyle = shade(hairC, 40); c.lineWidth = 0.3*U; c.beginPath(); c.moveTo(-1.4*U, (hY-0.4)*U); c.quadraticCurveTo(0.4*U, (hY-0.9)*U, 1.8*U, (hY-0.3)*U); c.stroke();
    } else if (st === "buzz") {
      hairCap(1.15, 3.0, hairC);
      for (let i = 0; i < 6; i++) { c.fillStyle = shade(hairC, 26); c.fillRect((-2.2 + i*0.85)*U, (hY + 0.2 + (i%2)*0.35)*U, 0.2*U, 0.2*U); }
    } else if (st === "mullet") {
      hairCap(1.3, 4.6, hairC);
      blob([[0.2,0.2],[2.6,0.4],[2.7,1.5],[1.8,1.25],[0.6,1.5]], hairC);
    } else if (st === "slick") {
      hairCap(1.0, 3.6, hairC);
      c.strokeStyle = shade(hairC, 50); c.lineWidth = 0.22*U;
      for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo((1.8 - i*0.2)*U, (hY + 0.4 + i*0.45)*U); c.lineTo((-2.0)*U, (hY + 0.6 + i*0.5)*U); c.stroke(); }
    } else if (st === "messy") {
      blob([[-2.7,0.9],[-2.4,-0.9],[-1.6,-0.1],[-0.9,-1.3],[-0.1,-0.2],[0.8,-1.2],[1.4,-0.1],[2.6,-0.7],[2.8,1.0]], hairC);
      hairCap(1.6, 3.8, hairC);
    } else if (st === "side") {
      hairCap(1.35, 3.4, hairC);
      blob([[-0.6,0.0],[1.8,-0.1],[2.85,0.9],[2.7,1.6],[1.4,1.2],[-0.2,1.2]], hairC);
      c.strokeStyle = shade(hairC, -30); c.lineWidth = 0.22*U; c.beginPath(); c.moveTo(-0.6*U, (hY-0.2)*U); c.lineTo(-0.4*U, (hY+1.0)*U); c.stroke();
    } else if (st === "crown") {                                         // łysina z wiankiem
      c.save(); uell(c, cx0, cy0, S.crx + 0.45, S.cry + 0.45); c.clip();
      c.fillStyle = hairC; upath(c, [[-4,hY+1.6],[-1.0,hY+2.0],[-0.4,hY+2.9],[-1.6,hY+4.4],[-4,hY+4.4]]); c.fill();
      c.restore();
      c.fillStyle = shade(skin, 26); uell(c, 0.2, hY+0.7, 1.4, 0.45); c.fill();
    } else if (st === "long") {
      hairCap(1.5, 4.5, hairC);
    } else {                                                             // łysy — błyszcząca czaszka
      c.fillStyle = shade(skin, 30); uell(c, 0.3, hY+0.65, 1.3, 0.42); c.fill();
      if (pal.brow) { c.fillStyle = shade(skin, -28); c.fillRect(0.2*U, (ey-1.1)*U, 1.8*U, 0.35*U); }
    }
  }
  if (F.glasses) {                                                       // okulary: szkło z przodu + mostek + zausznik
    const g = "#24242a";
    c.strokeStyle = g; c.lineWidth = 0.28*U;
    c.fillStyle = "rgba(200,220,240,0.22)"; c.fillRect(0.55*U, (ey-0.55)*U, 1.5*U, 1.1*U);
    c.strokeRect(0.55*U, (ey-0.55)*U, 1.5*U, 1.1*U);
    c.beginPath(); c.moveTo(2.05*U, (ey-0.2)*U); c.lineTo(2.75*U, (ey-0.25)*U); c.stroke();
    c.beginPath(); c.moveTo(0.55*U, (ey-0.3)*U); c.lineTo(-1.0*U, (ey+0.05)*U); c.stroke();
  }
  if (pal.fajka) { const my2 = fy + 4.95;
    c.fillStyle = "#e8e4d8"; c.fillRect(2.0*U, (my2-0.2)*U, 2.1*U, 0.45*U); c.fillStyle = "#ff7b39"; c.fillRect(4.0*U, (my2-0.24)*U, 0.45*U, 0.53*U);
    if ((tick>>4)%2) { c.fillStyle = "rgba(180,184,190,0.5)"; uell(c, 4.4, my2-1.6, 0.4, 0.7); c.fill(); } }
  c.restore();
}

// draw a character. pose = {legs, armF, armB, lean, dy, …}
function drawDude(c, X, Y, face, pose, pal, big=false, tick=0) {
  c.save();
  c.translate(Math.round(X), Math.round(Y));
  if (face < 0) c.scale(-1, 1);
  const B = (typeof big==="number" ? big : (big ? 1.35 : 1)) * CHAR_K;
  c.scale(B, B);
  c.translate((pose.jx||0), pose.dy||0);
  const lean = pose.lean||0, bd = pal.b || BODY0, w = bd.w;
  const legH = bd.leg, torsoH = bd.th, headH = 6;
  const hipY = -legH, shoY = hipY - torsoH, headY = shoY - headH - 0.35;
  const sw = (pose.swing||0) * (pose.swingAmp||1);

  if (pose.legs === "down") { drawLying(c, pal); c.restore(); return; }

  const tilt = pose.tilt || 0;
  const tiltOn = () => { if (!tilt) return false; c.save(); c.translate(0, hipY*U); c.rotate(tilt); c.translate(0, -hipY*U); return true; };
  if (tiltOn()) { drawArm(c, pose.armB, shoY, pal, true, lean, null, sw, pose.extB, tick); c.restore(); }
  else drawArm(c, pose.armB, shoY, pal, true, lean, null, sw, pose.extB, tick);
  drawLeg(c, pose.legs, "back", hipY, pal, pose.kext, pose);
  const tTorso = tiltOn();

  // ---- tułów ----
  c.save(); c.translate(lean*U, 0);
  const top = pal.top, L = -w, Wd = 2*w;
  px(c, L-0.5, shoY-0.3, Wd+1, 2.8, OUT);                       // barki
  px(c, L, shoY, Wd, torsoH, OUT);
  if (bd.belly) px(c, w-0.6, shoY+3.4, 1.4+bd.belly, torsoH-4.2, OUT);   // brzuch
  px(c, L+0.3, shoY+0.4, Wd-0.6, 2, top);
  px(c, L+1, shoY+1, Wd-2, torsoH-1, top);
  if (bd.belly) { px(c, w-1, shoY+3.8, 1.3+bd.belly, torsoH-5.2, top); px(c, w-1+bd.belly, shoY+4.4, 0.6, torsoH-6.4, shade(top,-24)); }
  px(c, w-2, shoY+1, 1.1, torsoH-1, shade(top,-24));            // cień z boku
  px(c, L+1, shoY+1.6, 0.7, torsoH-3, shade(top,24));           // światło z lewej
  px(c, L+0.3, shoY+0.4, Wd-0.6, 0.5, shade(top,30));           // blik na barkach
  px(c, L+1, shoY+torsoH-1.2, Wd-2, 1, shade(pal.pants,-30));   // pasek
  const nk = bd.neck || 0;
  px(c, -0.6-nk/2, shoY-1.1, 2.2+nk, 2.0, OUT); px(c, -0.3-nk/2, shoY-1.1, 1.6+nk, 1.9, pal.skin);   // szyja
  px(c, -1-nk/2, shoY+0.5, 2+nk, 0.4, shade(pal.skin,-30));
  if (pal.koloratka) px(c, -1, shoY+0.1, 2, 0.9, "#e8e4d8");
  if (pal.style === "dres") {
    px(c, L+1, shoY+1, 1, torsoH-1, pal.top2);
    px(c, w-2.8, shoY+1, 0.8, torsoH-1, shade(pal.top2,-35));
    px(c, L+1, shoY+1.6, Wd-2, 0.8, pal.top2);
  }
  if (pal.zip) { px(c, -0.3, shoY+1, 0.6, torsoH-2, "#d8d4c8");
    px(c, -1.5, shoY+1.4, 1, 1, shade(top,26)); px(c, 0.7, shoY+1.4, 1, 1, shade(top,26)); }
  if (pal.style === "lysy") { px(c, L+1, shoY+torsoH-2, Wd-2, 1, pal.top2); px(c, L+1, shoY+1, Wd-2, 0.8, pal.top2);
    px(c, -0.3, shoY+1.8, 0.6, torsoH-3.4, "#9aa0aa"); }
  if (pal.style === "menel") { px(c, -1, shoY+2, 2, torsoH-3, "#8a7a5a"); px(c, -1, shoY+2, 2, 1, "#a89468");
    px(c, w-2.4, shoY+4.4, 1.2, 1.2, shade(top,-30)); }                       // łata
  if (pal.pas) { px(c, L+1, shoY+torsoH-2.4, Wd-2, 1.2, "#2a241c"); px(c, -0.6, shoY+torsoH-2.4, 1.2, 1.2, "#a89452"); }
  if (pal.chain) { px(c, -1.7, shoY+1.8, 1, 0.8, "#c9a227"); px(c, -0.6, shoY+2.6, 1.2, 0.8, "#c9a227"); px(c, 0.6, shoY+1.8, 1, 0.8, "#c9a227"); }
  if (pal.szelki) { px(c, -w+1.8, shoY+1, 0.9, torsoH-2, "#33302a"); px(c, w-2.7, shoY+1, 0.9, torsoH-2, "#33302a"); }
  if (pal.tank) { px(c, L+1, shoY+1, 1, 2.4, pal.skin); px(c, w-2.6, shoY+1, 1.4, 2.4, shade(pal.skin,-8)); }
  if (pal.style === "boss") { px(c, L+1, shoY+1, 1.4, 3, shade(top,22)); px(c, w-3, shoY+1, 1, 3, shade(top,22)); }
  if (pal.kitel) {
    px(c, -0.4, shoY+1, 0.8, torsoH-2, "#3a3a3e");
    px(c, -1.6, shoY+1.4, 0.7, 3, "#2c3040"); px(c, 0.9, shoY+1.4, 0.7, 3, "#2c3040");
    px(c, -1.6, shoY+4.2, 3.2, 0.8, "#2c3040"); px(c, 0.4, shoY+5, 1.1, 1.1, "#c9c4b2");
  }
  c.restore();
  if (tTorso) c.restore();

  drawLeg(c, pose.legs, "front", hipY, pal, pose.kext, pose);
  if (pal.dress) {
    c.save(); c.translate(lean*U, 0);
    px(c, -w, hipY-0.6, Wd, 3.4, pal.top);
    px(c, -w-0.5, hipY+2.6, Wd+1, 1.3, shade(pal.top,-14));
    px(c, w-1.4, hipY-0.6, 1, 3.4, shade(pal.top,-20));
    c.restore();
  }

  // ---- głowa ----
  const tHead = tiltOn();
  c.save(); c.translate(lean*1.6*U, 0);
  if (pal.burakHead) {
    px(c, -3.4, headY-0.6, 6.8, headH+1.2, OUT);
    px(c, -2.6, headY+0.2, 5.2, headH-0.2, "#6e2248"); px(c, -2.6, headY+0.2, 1.4, headH-0.2, "#8a3560");
    px(c, 1.4, headY+0.6, 1, headH-1, "#4a1630"); px(c, -0.4, headY+headH-0.4, 0.9, 1.4, "#4a1630");
    px(c, -1.6, headY-2.4, 1, 2.6, "#3a6e2e"); px(c, 0.2, headY-3, 1, 3.2, "#4a8a38"); px(c, 1.4, headY-2, 0.9, 2.2, "#3a6e2e");
    px(c, -0.2, headY+2.2, 1.6, 0.8, pose.hurt ? "#e8e4d8" : "#ffdede"); px(c, 0.8, headY+2.3, 0.7, 0.7, OUT);
    px(c, -0.4, headY+1.6, 2, 0.5, "#2a0e1c"); px(c, 0, headY+4.4, 1.7, pose.hurt?1.1:0.6, "#2a0e1c");
  } else {
    const hs = bd.hs || 1, hsy = (bd.hsy || 1)*hs, cy = headY + headH;
    c.translate(0, cy); c.scale(hs, hsy); c.translate(0, -cy);         // głowa rośnie od brody w górę
    drawHead(c, pal, headY, pose.hurt, tick);
  }
  c.restore();

  drawArm(c, pose.armF, shoY, pal, false, lean, pose.weap, sw, pose.ext, tick);
  if (tHead) c.restore();
  c.restore();
}

// ---------- kończyny: prawdziwe stawy (udo/podudzie/stopa, ramię/przedramię/pięść) ----------
// Wszystko w jednostkach (U px). Cel stopy/dłoni → kolano/łokieć z 2-członowego IK.
const LEG_T = 4.75, LEG_S = 4.55, ANK = 0.9;          // udo, podudzie, wysokość kostki nad ziemią
const ARM_U = 3.8,  ARM_F = 3.6;                      // ramię, przedramię
function ik2(tx, ty, a, b, pick) {                    // pick(j1, j2) → wybrany staw
  let d = Math.hypot(tx, ty);
  const dMax = a + b - 0.02, dMin = Math.abs(a - b) + 0.05;
  if (d > dMax) { tx *= dMax/d; ty *= dMax/d; d = dMax; }
  else if (d < dMin) { const k = dMin/(d || 1); tx = (tx || 0.01)*k; ty *= k; d = dMin; }
  const th = Math.atan2(ty, tx), al = Math.acos(clamp((a*a + d*d - b*b)/(2*a*d), -1, 1));
  const j1 = [a*Math.cos(th + al), a*Math.sin(th + al)], j2 = [a*Math.cos(th - al), a*Math.sin(th - al)];
  return { j: pick(j1, j2), e: [tx, ty] };
}
function seg(c, x1, y1, x2, y2, w, col) {             // gruby odcinek (prostokąt wzdłuż kości)
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy/L*w/2, ny = dx/L*w/2;
  c.fillStyle = col; c.beginPath();
  c.moveTo((x1+nx)*U, (y1+ny)*U); c.lineTo((x2+nx)*U, (y2+ny)*U);
  c.lineTo((x2-nx)*U, (y2-ny)*U); c.lineTo((x1-nx)*U, (y1-ny)*U); c.closePath(); c.fill();
}
function dot(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x*U, y*U, r*U, 0, 7); c.fill(); }
function footPath(ph, S, lift) {                      // stopa: podpór (sunie w tył) → przenoszenie (łuk w przód)
  ph = ((ph % 1) + 1) % 1;
  if (ph < 0.5) return [S*(1 - 4*ph), 0];
  const u = (ph - 0.5)*2, e = u*u*(3 - 2*u);
  return [-S + 2*S*e, -lift*Math.sin(Math.PI*u)];
}

function drawArm(c, kind, shoY, pal, back, lean, weap, swing=0, ext, tick=0) {
  const col  = pal.tank ? (back ? shade(pal.skin,-18) : pal.skin) : (back ? shade(pal.top,-18) : pal.top);
  const skin = back ? shade(pal.skin,-18) : pal.skin;
  const fist = shade(skin,-10);
  c.save(); c.translate(lean*U, 0);
  const sx = back ? -3 : 1;
  const sw = (swing||0) * (back ? -0.9 : 0.9);        // wymach ręki w chodzie
  const IKK = { down:1, sway:1, guard:1, punch:1, punch2:1, windup:1, upper:1, grabH:1, flail:1, throw:1, swing:1,
                pocket:1, hip:1, cross:1, behind:1, wide:1, bottle:1, drink:1, bag:1, attention:1, wswingA:1, pump:1 };
  if (IKK[kind] || !kind) {
    const bw = (pal.b || BODY0).w;
    const S = [back ? -(bw-2.1) : (bw-2.3), shoY + 1.5];  // bark
    let t;
    const e = (ext===undefined || ext===null) ? 1 : ext;
    switch (kind) {
      case "sway":   t = [0.35 + sw*2.1, 6.9]; break;
      case "guard":  t = back ? [2.5, 1.2] : [2.7 + sw*0.3, 0.3]; break;
      case "punch": case "punch2": {
        const y0 = kind === "punch2" ? -0.7 : 0.1;
        if (e < 0.3) t = [2.0, 1.0];
        else { const q = (e - 0.3)/0.7; t = [lerp(2.0, 7.3, q), lerp(1.0, y0, q)]; }
        break;
      }
      case "windup": t = [-3.3, -3.3]; break;
      case "upper":  t = [1.3, -6.9]; break;
      case "grabH":  t = [6.7, 1.6]; break;
      case "flail":  t = [1.0 + sw*1.6, -4.3]; break;
      case "throw":  t = [1.1, -5.4]; break;
      case "swing":  t = [4.9, -2.6]; break;
      case "pocket": t = [back ? 0.6 : 0.2, 6.1]; break;                  // ręka w kieszeni
      case "hip":    t = [-0.8, 5.6]; break;                              // pod bokiem
      case "cross":  t = [back ? 2.6 : 2.0, 3.4]; break;                  // skrzyżowane na piersi
      case "behind": t = [-2.6, 6.0]; break;                              // ręce z tyłu
      case "wide":   t = [1.6 + sw*1.6, 6.1]; break;                      // łokcie na boki — goryl
      case "bottle": t = [2.4, 3.6]; break;                               // flaszka przy piersi
      case "drink":  t = [2.1, -1.0]; break;                              // łyk
      case "bag":    t = [0.5, 6.9]; break;                               // siatka z zakupami
      case "attention": t = [0.1, 7.3]; break;                            // na baczność
      case "wswingA": t = [Math.cos(ext)*6.9, Math.sin(ext)*6.9]; break;  // zamach bronią po łuku
      case "pump": { const q = (sw/0.9 + 1)/2; t = [lerp(-2.4, 3.0, q), lerp(4.8, 1.7, q)]; break; }   // ręce zgięte jak u biegacza
      default:       t = [0.35, 7.1];
    }
    const pk = (kind === "pump") ? (sw >= 0 ? (a, b) => a[1] > b[1] ? a : b : (a, b) => a[0] < b[0] ? a : b)
             : (kind === "windup" || kind === "behind") ? (a, b) => a[0] < b[0] ? a : b      // łokieć w tył
             : (kind === "hip" || kind === "cross" || kind === "wide") ? (a, b) => a[0] > b[0] ? a : b   // łokieć na zewnątrz
             : (a, b) => a[1] > b[1] ? a : b;                                                // łokieć w dół
    const r = ik2(t[0], t[1], ARM_U, ARM_F, pk);
    const E = [S[0] + r.j[0], S[1] + r.j[1]], H = [S[0] + r.e[0], S[1] + r.e[1]];
    // obrys
    seg(c, S[0], S[1], E[0], E[1], 2.9, OUT); seg(c, E[0], E[1], H[0], H[1], 2.7, OUT); dot(c, E[0], E[1], 1.35, OUT); dot(c, S[0], S[1], 1.45, OUT);
    // ramię + przedramię (rękaw)
    seg(c, S[0], S[1], E[0], E[1], 2.2, col); dot(c, S[0], S[1], 1.1, col);
    seg(c, E[0], E[1], H[0], H[1], 2.0, col); dot(c, E[0], E[1], 1.0, col);
    seg(c, S[0], S[1]-0.45, E[0], E[1]-0.45, 0.5, shade(col, 22));               // światło na rękawie
    if (!pal.tank) { const fx = lerp(E[0], H[0], 0.82), fy = lerp(E[1], H[1], 0.82);   // mankiet
      seg(c, fx, fy, H[0], H[1], 2.05, shade(col, -26)); }
    if (kind === "pocket") { px(c, H[0]-1.1, H[1]-0.2, 2.2, 0.5, shade(pal.pants,-30)); c.restore(); return; }   // dłoń schowana
    // pięść — trochę za końcem przedramienia
    const L = Math.hypot(H[0]-E[0], H[1]-E[1]) || 1, ux = (H[0]-E[0])/L, uy = (H[1]-E[1])/L;
    if (kind === "bottle" || kind === "drink") {                          // butelka w dłoni
      c.save(); c.translate((H[0]+0.4)*U, (H[1]-0.6)*U); c.rotate(kind === "drink" ? -2.1 : 0);
      px(c, -0.75, -3.6, 1.5, 3.6, OUT); px(c, -0.5, -3.3, 1.0, 3.1, "#3a7a4a"); px(c, -0.4, -4.6, 0.8, 1.2, "#3a7a4a"); px(c, -0.5, -2.4, 1.0, 1.0, "#d8d0b0");
      c.restore();
    }
    if (kind === "wswingA") {                                             // rura / motyka po łuku + smuga
      const a = ext, ux = Math.cos(a), uy = Math.sin(a), Lw = weap === "motyka" ? 10 : 11.5;
      const T = [H[0] + ux*Lw, H[1] + uy*Lw];
      c.save(); c.globalAlpha = 0.32; c.strokeStyle = "#f0ece0"; c.lineWidth = 2.6*U;
      c.beginPath(); c.arc(S[0]*U, S[1]*U, (6.9 + Lw)*U, a - 1.0, a); c.stroke(); c.restore();
      if (weap === "motyka") {

function drawLeg(c, kind, which, hipY, pal, kext, pose) {
  const back = which === "back";
  const col = back ? shade(pal.pants,-18) : pal.pants;
  const sh  = back ? shade(pal.shoes,-18) : pal.shoes;
  const sole = pal.style==="dres" || pal.style==="hero" ? "#f0ece0" : shade(sh,-25);
  const P = pose || {};
  const bw = (pal.b || BODY0).w, hx = back ? -bw*0.33 : bw*0.33;
  const LT = -hipY*0.468, LS = -hipY*0.447;            // nogi prawie proste przy staniu (kość + kość ≈ biodro→kostka)
  const G = -hipY - (P.dy || 0)/U - ANK;             // ziemia (kostka) względem biodra
  let t, air = false;
  const walkAt = (ph) => { const f = footPath(ph + (back ? 0.5 : 0), P.stride || 2.3, P.lift || 1.7); return [f[0] + 0.1, G + f[1]]; };
  switch (kind) {
    case "stand":  t = [back ? 0.1 : 0.3, G]; break;
    case "stance": t = back ? [-1.7, G] : [1.7, G]; break;
    case "crouch": t = back ? [-2.1, G] : [2.0, G]; break;
    case "walk":   t = walkAt(P.wp || 0); break;
    case "run": {                                          // bieg: podpór → odbicie → pięta pod pośladek → wyrzut kolana
      const S = P.stride || 3.2, ph = (((P.wp || 0) + (back ? 0.5 : 0)) % 1 + 1) % 1;
      const K = [[0, S, 0], [0.33, -S*0.8, 0], [0.55, -S*0.9, -4.6], [0.8, S*0.8, -3.4], [1, S, 0]];
      let f = [S, 0];
      for (let i = 0; i < K.length - 1; i++) if (ph <= K[i+1][0]) { const q = (ph - K[i][0])/(K[i+1][0] - K[i][0]), e = q*q*(3 - 2*q);
        f = [lerp(K[i][1], K[i+1][1], e), lerp(K[i][2], K[i+1][2], e)]; break; }
      t = [f[0] + 0.3, G + f[1]]; break;
    }
    case "slide":  t = back ? [2.6, G - 0.1] : [LT + LS - 0.25, G - 0.2]; break;   // ślizg: noga prosto przed siebie, druga podwinięta
    case "walkA":  t = walkAt(0); break;
    case "walkB":  t = walkAt(0.5); break;
    case "pass":   t = walkAt(0.25); break;
    case "knee":   t = back ? [-0.7, G] : [2.7, G - 4.9]; break;              // kolano w górę (cios kolanem / zamach)
    case "jump":   t = back ? [-1.2, 5.6] : [2.1, 4.8]; air = true; break;
    case "kick": {
      if (back) { t = [-0.9, G]; break; }                                   // noga podporowa
      const e = (kext===undefined || kext===null) ? 1 : kext;
      const ch = [2.5, G - 5.0];                                             // komora: kolano wysoko
      if (e < 0.3) t = ch;
      else { const q = (e - 0.3)/0.7; t = [lerp(ch[0], LT + LS - 0.05, q), lerp(ch[1], -0.5, q)]; }
      air = true; break;
    }
    default: t = [0.2, G];
  }
  const r = ik2(t[0], t[1], LT, LS, (a, b) => a[0] > b[0] ? a : b);    // kolano w przód
  const H = [hx, hipY], K = [hx + r.j[0], hipY + r.j[1]], A = [hx + r.e[0], hipY + r.e[1]];
  const grounded = !air && A[1] >= hipY + G - 0.15;
  // stopa: płasko na ziemi, w powietrzu prostopadle do goleni
  let fx = 1, fy = 0;
  const flatFoot = kind !== "kick" && kind !== "knee" && kind !== "jump" && kind !== "slide";
  if (!grounded && flatFoot) { const lift = (hipY + G) - A[1]; fx = 1; fy = clamp(lift*0.12, 0, 0.35); }   // w kroku stopa prawie płasko, palce lekko w dół
  else if (!grounded) { const L = Math.hypot(A[0]-K[0], A[1]-K[1]) || 1, sx = (A[0]-K[0])/L, sy = (A[1]-K[1])/L; fx = sy; fy = -sx; }
  const T0 = [A[0] - fx*0.9, A[1] - fy*0.9], T1 = [A[0] + fx*2.4, A[1] + fy*2.4];
  const nX = grounded ? 0 : (A[0]-K[0]), nY = grounded ? 1 : (A[1]-K[1]), nL = Math.hypot(nX, nY) || 1;   // strona podeszwy
  // obrys
  seg(c, H[0], H[1], K[0], K[1], 3.5, OUT); seg(c, K[0], K[1], A[0], A[1], 3.1, OUT); dot(c, K[0], K[1], 1.55, OUT);
  seg(c, T0[0] + nX/nL*0.45, T0[1] + nY/nL*0.45, T1[0] + nX/nL*0.45, T1[1] + nY/nL*0.45, 2.9, OUT);
  // udo, podudzie, kolano
  seg(c, H[0], H[1], K[0], K[1], 2.7, col); dot(c, H[0], H[1], 1.35, col);
  seg(c, K[0], K[1], A[0], A[1], 2.3, col); dot(c, K[0], K[1], 1.15, col);
  seg(c, H[0]+0.55, H[1], K[0]+0.55, K[1], 0.55, shade(col, 16));          // kant nogawki
  dot(c, K[0]+0.3, K[1]-0.2, 0.45, shade(col, -16));                         // fałda na kolanie
  if (pal.style === "dres") { seg(c, H[0]-0.85, H[1], K[0]-0.85, K[1], 0.55, pal.top2); seg(c, K[0]-0.75, K[1], A[0]-0.75, A[1], 0.5, pal.top2); }
  // but
  seg(c, T0[0], T0[1], T1[0], T1[1], 2.1, sh);
  seg(c, T0[0] + nX/nL*0.85, T0[1] + nY/nL*0.85, T1[0] + nX/nL*0.85, T1[1] + nY/nL*0.85, 0.65, sole);
  seg(c, T0[0] + 0.4*fx, T0[1] + 0.4*fy - 0.5, A[0] + 1.4*fx, A[1] + 1.4*fy - 0.5, 0.45, shade(sh, 26));
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return "#" + ((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}

// deterministic pseudo-random for window lights
function hash(n){ const s=Math.sin(n*127.1)*43758.545; return s-Math.floor(s); }

function drawBlok(c, x, base, w, h, seed, tone) {
  pxr(c, x, base-h, w, h, tone);
  pxr(c, x, base-h, w, 3, shade(tone, 14));                  // attic band
  pxr(c, x, base-h, 2, h, shade(tone, -12));
  // wielka płyta seams
  c.fillStyle = shade(tone, -10);
  for (let sy=base-h+14; sy<base; sy+=16) pxr(c, x, sy, w, 1, shade(tone,-10));
  // windows
  const cols = Math.floor((w-8)/10), rows = Math.floor((h-10)/16);
  for (let i=0;i<cols;i++) for (let j=0;j<rows;j++) {
    const wx = x+5+i*10, wy = base-h+7+j*16;
    const r = hash(seed + i*13 + j*7);
    let wc = "#232830";
    if (r > 0.80) wc = "#e8c15a";                 // światło w oknie
    else if (r > 0.72) wc = "#8a7440";
    pxr(c, wx, wy, 6, 8, wc);
    pxr(c, wx, wy+3.5, 6, 1, shade(wc,-25));
  }
}

function lerpColor(h1, h2, t) {
  const a = parseInt(h1.slice(1),16), b = parseInt(h2.slice(1),16);
  const r = Math.round(lerp(a>>16, b>>16, t));
  const g = Math.round(lerp((a>>8)&255, (b>>8)&255, t));
  const bl = Math.round(lerp(a&255, b&255, t));
  return "#" + ((r<<16)|(g<<8)|bl).toString(16).padStart(6,"0");
}

class Car {
  constructor(cfg, camX) {
    this.type = cfg.type; this.col = cfg.col; this.crew = cfg.crew;
    this.y = cfg.y || rnd(GROUND_TOP+24, GROUND_BOT-6);
    this.face = cfg.side>0 ? -1 : 1;    // wjeżdża z boku, przodem do gracza
    this.x = cfg.side>0 ? camX+VW+70 : camX-70;
    this.stopX = camX + (cfg.side>0 ? VW*0.7 : VW*0.24) + rnd(-16, 16);
    this.state = "drive"; this.t = 0;
  }
  update() {
    this.t++;
    if (this.state !== "drive") return;
    const d = this.stopX - this.x;
    this.x += clamp(d*0.07, -4.4, 4.4);
    if (Math.abs(d) < 2.5) {
      this.state = "parked";
      SFX.screech(); game.shake = 3;
      for (const k of this.crew) {
        const e = new Enemy(k, this.x + rnd(-16, 16), clamp(this.y + rnd(-4, 10), GROUND_TOP+14, GROUND_BOT));
        e.entered = true;
        game.enemies.push(e);
      }
    }
  }
  draw(c, camX) {
    const sx = this.x - camX;
    drawShadow(c, sx, this.y, 24*RK);
    c.save(); c.translate(Math.round(sx), Math.round(this.y));
    if (this.face < 0) c.scale(-1, 1);
    c.scale(1.45*RK, 1.45*RK);
    const [fn, w] = CAR_DRAW[this.type];
    if (this.state === "drive") {   // światła
      c.fillStyle = "rgba(232,193,90,0.15)";
      c.beginPath(); c.moveTo(w/2-2, -12); c.lineTo(w/2+34, -16); c.lineTo(w/2+34, -3); c.lineTo(w/2-2, -7); c.closePath(); c.fill();
    }
    fn(c, -w/2, 0, this.col);
    c.restore();
  }
}

  drawShadow(c, 0, 0, 7);
  if (b.kind === "karton") {
    pxr(c, -7, -11, 14, 11, OUT); pxr(c, -6.4, -10.4, 12.8, 9.8, "#b08a5a");
    pxr(c, -6.4, -10.4, 12.8, 2, "#c49c68"); pxr(c, 3.5, -10.4, 2.5, 9.8, "#9a7448");
    pxr(c, -1, -10.4, 2, 9.8, "#d8c8a0"); if (b.hp === 1 && BRK.karton.hp > 1) pxr(c, -5, -6, 3, 1, OUT);
  } else if (b.kind === "kosz") {
    pxr(c, -5.5, -14, 11, 14, OUT); pxr(c, -4.8, -13.3, 9.6, 12.6, "#5f6b62");
    for (let i=0;i<3;i++) pxr(c, -4.8, -10.5+i*4, 9.6, 0.9, "#4a5550");
    pxr(c, -6.4, -15.4, 12.8, 2.4, "#4a5550"); pxr(c, 2.6, -13.3, 1.6, 12.6, "#525d55");
    pxr(c, -3, -17, 3, 2, "#8a7a4a");
  } else if (b.kind === "beczka") {
    pxr(c, -5.5, -15, 11, 15, OUT); pxr(c, -4.8, -14.3, 9.6, 13.6, "#2a5288");
    pxr(c, -4.8, -11.5, 9.6, 1.2, "#1e3a5e"); pxr(c, -4.8, -5.5, 9.6, 1.2, "#1e3a5e");
    pxr(c, 2.4, -14.3, 1.8, 13.6, "#23466f"); pxr(c, -3.4, -9, 2.4, 3, "#7a3b2b");
  } else if (b.kind === "skrzynka") {
    pxr(c, -7, -10, 14, 10, OUT); pxr(c, -6.3, -9.3, 12.6, 8.6, "#9c7a4e");
    for (let i=0;i<3;i++) pxr(c, -6.3, -8.4+i*3, 12.6, 0.8, "#7a5c38");
    pxr(c, -5, -12, 3, 3, "#c94a3a"); pxr(c, -1, -12.5, 3, 3.4, "#4a8a3a"); pxr(c, 2.6, -12, 3, 3, "#c9973a");
  } else {
    pxr(c, -8, -10, 16, 10, OUT); pxr(c, -7.3, -9.3, 14.6, 8.6, "#4a5438");
    pxr(c, -7.3, -9.3, 14.6, 1.4, "#5c6848"); pxr(c, -4, -6, 8, 1.6, "#c9c4b2");
    pxr(c, -7.3, -4, 1.4, 3.3, "#3a4229"); pxr(c, 5.9, -4, 1.4, 3.3, "#3a4229");
  }
}

let score = 0;
const floaters = [];   // floating text
function say(x, y, txt, col="#e8e4d8", life=90) { floaters.push({x, y, txt, col, life, t:0}); }

const bottles = [];    // projectiles
function smashProjectile(b) {                           // zbity w locie — rozpada się widocznie, nie znika
  b.dead = true;
  const y = b.y - (b.z||0) + 4;
  const col = b.kind==="doniczka" ? "#b8623a" : b.kind==="marchewka" ? "#e8853a" : b.kind==="granat" ? "#3a4229" : b.kind==="krasnal" ? "#c94a3a" : "#7ec9c9";
  for (let i = 0; i < 7; i++) gibs.push({ x:b.x, y, vx:rnd(-1.6,1.6), vy:rnd(-2.2,0), col, life:irnd(14,26), sz:irnd(1,3) });
  if (b.kind==="doniczka") for (let i = 0; i < 4; i++) gibs.push({ x:b.x, y, vx:rnd(-1,1), vy:rnd(-1.5,0), col:"#4a3a2a", life:irnd(14,26), sz:2 });
  if (typeof SFX !== "undefined") SFX.bottle();
}
const weapons = [];    // broń na ziemi {x,y,kind,dur}
const pickups = [];    // {x,y,kind}
const gibs = [];       // little particles
const bloodPuddles = []; // permanent gore stains left by corpses

function spawnGibs(x, y, col, n=6) {
  for (let i=0;i<n;i++) gibs.push({x, y:y-14, vx:rnd(-1.8,1.8), vy:rnd(-3.2,-0.6), col, life:irnd(18,40), sz:irnd(2,4)});
}

const sparks = [];   // klasyczna "gwiazdka" trafienia
function spawnSpark(x, y, big=false) { sparks.push({x, y, t:0, life: big?9:6, big}); }
function drawSpark(c, s, camX) {
  const p = 1 - s.t/s.life, r = (s.big?11:6.5)*(0.45+p*0.8)*RK;
  c.save(); c.translate(Math.round(s.x-camX), Math.round(s.y)); c.rotate(s.t*0.45);
  c.fillStyle = p>0.5 ? "#ffffff" : "#e8c15a";
  for (let i=0;i<4;i++){ c.rotate(Math.PI/2);
    c.beginPath(); c.moveTo(0,-r); c.lineTo(r*0.24,0); c.lineTo(0,r*0.36); c.lineTo(-r*0.24,0); c.closePath(); c.fill(); }
  c.restore();
}
const tracers = [];   // smuga pocisku z pistoletu
function spawnTracer(x1, y, x2) { tracers.push({ x1, x2, y, t:0, life:7 }); }
function drawTracer(c, tr, camX) {
  const p = tr.t/tr.life;
  c.strokeStyle = p<0.4 ? "rgba(255,244,200,0.95)" : "rgba(232,193,90," + (0.9-p*0.9) + ")";
  c.lineWidth = p<0.4 ? 1.6 : 1;
  c.beginPath(); c.moveTo(tr.x1-camX, tr.y); c.lineTo(tr.x2-camX, tr.y); c.stroke();
  const bx = lerp(tr.x1, tr.x2, Math.min(1, p*2.4));         // lecący pocisk
  if (p < 0.5) { pxr(c, bx-camX-1.5, tr.y-1, 3, 2, "#fff4c8"); }
}
function spawnDust(x, y, n=3) {
  for (let i=0;i<n;i++) gibs.push({x:x+rnd(-5,5), y:y-2, vx:rnd(-0.7,0.7), vy:rnd(-1.3,-0.3), col:"#a8a294", life:irnd(10,20), sz:irnd(1,3)});
}

function spawnBloodPuddle(x, y) {
  const blobs = [];
  const n = irnd(4,7);
  for (let i=0;i<n;i++) blobs.push({dx:rnd(-9,9), dy:rnd(-2,3.5), rx:rnd(3,7), ry:rnd(1.8,3.4)});
  bloodPuddles.push({x, y, blobs, col: Math.random()<0.5 ? "#4a1010" : "#5a1414"});
}

// ---------- base fighter ----------
class Fighter {
  constructor(x, y, pal, hp) {
    this.x=x; this.y=y; this.z=0; this.vz=0; this.vx=0;
    this.kvx=0;                         // poślizg po trafieniu (płynny knockback)
    this.pal=pal; this.hp=hp; this.maxhp=hp;
    this.face=1; this.state="idle"; this.t=0;
    this.hitT=0; this.downT=0; this.dead=false;
    this.walkT=0; this.big=false; this.spinA=0; this.bounced=false;
  }
  get feetY(){ return this.y - this.z; }
  applySlide() {
    if (this.kvx) { this.x += this.kvx; this.kvx *= 0.78; if (Math.abs(this.kvx)<0.05) this.kvx=0; }
  }
  airStep() {                           // łuk lotu (launch / rzut) — zwraca true po lądowaniu
    this.x += this.vx; this.z += this.vz; this.vz -= 0.2;
    this.spinA += 0.36;
    if (this.z <= 0) {
      this.z = 0;
      if (Math.abs(this.vz) > 1.3 && !this.bounced) {        // jedno odbicie od gleby
        this.bounced = true; this.vz = 1.1; this.vx *= 0.45;
        spawnDust(this.x, this.y, 4); game.shake = Math.max(game.shake, 2); SFX.thud();
        return false;
      }
      this.vx = 0; this.vz = 0; this.bounced = false; this.spinA = 0;
      spawnDust(this.x, this.y, 5); SFX.thud();
      this.state = "down"; this.downT = this.hp<=0 ? 46 : 34;
      return true;
    }
    return false;
  }
  pose() {
    const wp = (this.walkT/24) % 1;                   // ciągła faza kroku
    const p = this.basePose("walk");
    p.wp = wp;
    if (this.state==="walk" || this.state==="charge") {
      p.swing = -Math.cos(wp*Math.PI*2);                // ręka przeciwnie do nogi
      p.dy = (p.dy||0) + 0.6*(0.5 + 0.5*Math.cos(wp*Math.PI*4));   // ciało najniżej przy postawieniu stopy
    }
    const g = this.pal.g;                              // poza walką każdy chodzi i stoi po swojemu
    if (g && (this.state==="walk" || this.state==="idle") && !this.running && !this.inFight()) {
      if (this.state==="walk") { p.armF = g.walk[0]; p.armB = g.walk[1]; p.stride = g.stride; p.lift = g.lift;
        p.lean = g.lean || 0; p.swingAmp = g.amp || 1; p.dy = (p.dy||0)*(g.bob ?? 1); }
      else { p.armF = (g.drinks && this.t % 260 < 46) ? "drink" : g.idle[0]; p.armB = g.idle[1]; p.legs = g.idle[2] || "stand"; p.lean = g.ilean || 0; }
    }
    if (this.pal.bat) {
      if (this.state==="idle" || this.state==="walk" || this.state==="windup") p.armF = "bat";
      if (this.state==="swing") p.armF = "batSwing";
    }
    if (this.pal.tool) {
      if (this.state==="idle" || this.state==="walk" || this.state==="windup") p.armF = "tool";
      if (this.state==="swing" || this.state==="punch1" || this.state==="punch2") p.armF = "toolSwing";
    }
    if (this.weapon) {
      p.weap = this.weapon.kind;
      if (this.state==="idle" || this.state==="walk") p.armF = "wield";
    }
    if (this.drunk) {
      p.lean = (p.lean||0) + Math.sin(this.wob||0) * 1.7;
      p.dy = (p.dy||0) + (Math.sin((this.wob||0)*0.6) > 0 ? 0.5 : 0);
    }
    if (this.state==="idle" && p.dy===undefined) p.dy = Math.floor(this.t/26)%2 ? 0.5 : 0;   // oddech
    return p;
  }
  atkP() { const d = this.atkDur || this.atkT || 1; return clamp(1 - this.atkT/d, 0, 1); }
  inFight() {                                          // garda w górę tylko gdy robi się gorąco
    const pl = game.player; if (!pl) return false;
    if (this === pl) return game.enemies.some(e => !e.dead && e.entered && e.state!=="down" && Math.abs(e.x-this.x) < 95 && Math.abs(e.y-this.y) < 32);
    return this.tok !== false && Math.abs(pl.x-this.x) < 48*RK && Math.abs(pl.y-this.y) < 22;
  }
  basePose(w) {
    switch(this.state) {
      case "walk":   return {legs:w, armF:"guard", armB:"sway"};
      case "punch1": case "punch2": {                          // prosty: zamach → wyprost → powrót
        const p = this.atkP();
        const ext = p<0.08 ? 0.22 : (p<0.55 ? clamp((p-0.08)/0.12, 0, 1) : 1-(p-0.55)/0.45*0.75);
        const lean = -0.5 + Math.min(p/0.22,1)*1.7 - Math.max(0,(p-0.7))*2.4;
        return this.state==="punch2"                            // drugi cios z drugiej ręki
          ? {legs:"stance", armF:"guard", armB:"punch", lean, extB:ext}
          : {legs:"stance", armF:"punch", armB:"guard", lean, ext};
      }
      case "punch3": {                                         // sierp: głębszy krok i skręt
        const p = this.atkP();
        const ext = p<0.06 ? 0.2 : (p<0.6 ? clamp((p-0.06)/0.1, 0, 1) : 1-(p-0.6)/0.4*0.7);
        const lean = -0.9 + Math.min(p/0.25,1)*2.6 - Math.max(0,(p-0.72))*3;
        return {legs:"walkA", armF:"punch2", armB:"punch", lean, ext, dy: Math.min(p/0.25,1)*0.5};
      }
      case "upper": {                                          // uppercut: przysiad → wystrzał w górę
        const p = this.atkP();
        if (p < 0.2) return {legs:"stance", armF:"windup", armB:"guard", lean:-1.4, dy: p/0.2*1.4};
        const up = clamp((p-0.2)/0.22, 0, 1);
        return {legs:"knee", armF:"upper", armB:"down", lean:-0.6+up*0.4, dy: 1.4-up*3};
      }
      case "kick": {                                           // kopniak: ładowanie kolana → wyprost → powrót
        const p = this.atkP();
        const kext = p<0.3 ? 0 : (p<0.72 ? clamp((p-0.3)/0.14, 0, 1) : 1-(p-0.72)/0.28*0.85);
        const lean = p<0.3 ? -1.1 : -1.1 + clamp((p-0.3)/0.15,0,1)*2.6 - Math.max(0,(p-0.8))*2;
        return {legs:"kick", kext, armF:"guard", armB:"punch", lean};
      }
      case "jump":   return {legs:"jump", armF:"guard", armB:"down", lean:0.4};
      case "jkick":  return {legs:"kick", armF:"guard", armB:"punch", lean:1.9};
      case "grab":   return {legs:"stand", armF:"grabH", armB:"grabH", lean:1};
      case "gknee":  return {legs:"knee",  armF:"grabH", armB:"guard", lean:1.3};
      case "grabbed":return {legs:"walkA", armF:"flail", armB:"flail", lean:-2.6, hurt:true};
      case "windup": {                                       // telegraf: coraz głębszy zamach + drżenie
        const pr = this.windT0 ? clamp(1 - this.windT/this.windT0, 0, 1) : 0.5;
        const jx = (this.windT!==undefined && this.windT<=3 && this.windT%2) ? 0.7 : 0;
        if (this.mv && this.mv.tele === "crouch") return {legs:"crouch", armF:"guard", armB:"guard", lean:0.8, dy:1+pr*3, jx};
        if (this.mv && this.mv.tele === "lean")   return {legs:"stance", armF:"grabH", armB:"guard", lean:1.2+pr, jx};
        return {legs:"stance", armF:"windup", armB:"guard", lean:-0.8-pr*1.6, jx};
      }
      case "jab2": { const p = this.atkP(), first = p < 0.5, q = first ? p/0.5 : (p-0.5)/0.5;
        const ext = q < 0.15 ? 0.2 : (q < 0.6 ? 1 : 1-(q-0.6)/0.4*0.7);
        return first ? {legs:"stance", armF:"punch", armB:"guard", lean:0.8, ext} : {legs:"stance", armF:"guard", armB:"punch", lean:1.2, extB:ext}; }
      case "hook":  { const p = this.atkP(); return {legs:"walkA", armF:"punch2", armB:"guard", lean: p<0.3 ? -1.2 : 2.0, ext: p<0.3 ? 0.1 : 1}; }
      case "lunge": { const p = this.atkP(); return {legs:"walkA", armF:"punch", armB:"guard", lean:2.4, ext: p<0.2 ? 0.2 : 1, dy:0.5}; }
      case "sweep": { const p = this.atkP(); return {legs:"kick", kext: p<0.3 ? 0.2 : 1, armF:"guard", armB:"down", lean:-2.2, dy:7}; }
      case "ejump": return {legs:"kick", kext:1, armF:"guard", armB:"punch", lean:1.4};
      case "grabP": return {legs:"stance", armF:"grabH", armB:"grabH", lean: ((this.gT||0)%34 > 14 && (this.gT||0)%34 < 24) ? 2.4 : 0.8};
      case "spinE": return {legs:"kick", kext:1, armF:"guard", armB:"punch", lean:-0.6, dy:-1};
      case "held":  return {legs:"walkA", armF:"flail", armB:"flail", lean:-1.8, hurt:true, jx: this.t%4 < 2 ? 0.6 : -0.6};
      case "wswing": {
        const p = this.atkP();
        return {legs:"walkA", armF:"wswing", armB:"guard", lean:-0.8+Math.min(p/0.35,1)*2.2};
      }
      case "swing": {
        const p = this.atkP();
        return {legs:"walkA", armF:"swing", armB:"guard", lean:-1.4+Math.min(p/0.4,1)*2.6};
      }
      case "throw":  return {legs:"stance", armF:"throw",  armB:"down", lean:-0.4};
      case "block":  return {legs:"stance", armF:"guard", armB:"guard", lean:-0.9, dy:0.5};
      case "dodge":  return {legs:"walkB", armF:"guard", armB:"down", lean:-2.2, dy:0.5};
      case "hit": {                                            // cios siada: mocny odrzut głowy, powolny powrót
        const q = clamp((this.stunT||0)/12, 0, 1);
        return {legs:"stand", armF:"guard", armB:"down", lean:-0.5-2.8*q, hurt:true};
      }
      case "down":   return (this.downT < 10 && this.hp > 0)            // wstaje: najpierw na kolano
                              ? {legs:"crouch", armF:"guard", armB:"down", lean:-1.2, dy:4} : {legs:"down"};
      case "charge": return {legs:w, armF:"punch", armB:"punch", lean:1.6};
      default:       return {legs:"stand", armF:"down", armB:"down"};
    }
  }
  draw(c, camX) {
    const sx = this.x - camX;
    const S = this.size || (this.big ? 1.35 : 1);
    const shw = (this.state==="down" ? 11 : 7*S) * CHAR_K * clamp(1 - this.z/90, 0.55, 1);
    drawShadow(c, sx, this.y, shw);
    if (this.state==="launch" || this.state==="thrown") {          // ciało wiruje w powietrzu
      c.save(); c.translate(Math.round(sx), Math.round(this.feetY-6*CHAR_K));
      c.rotate(this.spinA * this.face);
      c.scale(S*CHAR_K, S*CHAR_K);
      drawLying(c, this.pal, true);
      c.restore(); return;
    }
    if (this.state==="down" && this.hp<=0 && this.downT<26 && this.downT%4<2) return;   // KO: miga i znika
    if (this.hitT>0 && Math.floor(this.hitT/2)%2) c.globalAlpha = 0.55;
    const f = ((this.state==="spin" || this.state==="spinE") && Math.floor(this.atkT/4)%2) ? -this.face : this.face;
    drawDude(c, sx, this.feetY, f, this.pose(), this.pal, this.size || this.big, this.t);
    c.globalAlpha = 1;
  }
}

// ---------- player ----------
class Player extends Fighter {
  basePose(w) {
    if (this.state==="idle") {                                 // postawa bojowa, garda faluje
      return {legs:"stance", armF:"guard", armB:"guard", lean:0.35,
              swing: Math.sin(this.t*0.09)*0.5,
              dy: Math.floor(this.t/26)%2 ? 0.5 : 0};
    }
    if (this.state==="walk" && this.running) return {legs:w, armF:"sway", armB:"sway", lean:1.9, dy:0.8, stride:3.3, lift:2.4};
    if (this.state==="dashP") { const p = this.atkP();                 // bark/pięść z rozbiegu
      return {legs: p<0.25 ? "stance" : "walkA", armF:"punch", armB:"guard", lean: p<0.25 ? -0.6 : 2.4, ext: p<0.25 ? 0.2 : 1}; }
    if (this.state==="slide") { const p = this.atkP();                 // wślizg nogami naprzód
      return p<0.2 ? {legs:"knee", armF:"guard", armB:"down", lean:-0.8, dy:1}
                   : {legs:"kick", kext:1, armF:"guard", armB:"down", lean:-2.4, dy:4.5}; }
    if (this.state==="wswing" && this.weapon && (this.weapon.kind==="rura" || this.weapon.kind==="motyka")) {
      const p = this.atkP(), e = p*p*(3-2*p), mot = this.weapon.kind==="motyka";
      const a = mot ? lerp(-2.7, 1.0, e) : lerp(-2.0, 0.8, e);           // kąt: zza głowy → przed siebie w dół
      return {legs: p<0.4 ? "stance" : "walkA", armF:"wswingA", armB:"guard", lean: lerp(-1.2, 2.0, e), ext:a};
    }
    if (this.state==="spin") { const p = this.atkP();                  // obrotówka
      return {legs:"kick", kext: p<0.2 ? 0.1 : 1, armF:"guard", armB:"punch", extB:0.6, lean:-0.6, dy:-1}; }
    return super.basePose(w);
  }
  constructor() {
    super(60, 214, PAL.szymek, 100);
    this.combo=0; this.comboT=0; this.atkT=0; this.atkDur=0; this.iv=0;
    this.lives=5; this.weapon=null; this.wHitFrame=0;
    this.buf=null; this.pend=null; this.jvx=0;
    this.grabbing=null; this.grabT=0; this.grabHits=0;
    this.running=false; this.runDir=0; this.prevAxs=0; this.tapDir=0; this.tapT=-99; this.dashV=0;
    this.pT=-99; this.kT=-99; this.hits=0; this.hitsT=0; this.spinPaid=false;
  }
  countHit() { this.hits++; this.hitsT = 110; if (this.hits >= 4) score += 5*this.hits; }
  special() {                                // Z+X razem: obrotówka — oczyszcza tłum, kosztuje zdrowie gdy trafi
    this.state="spin"; this.atkDur=this.atkT=26; this.pend=null; this.buf=null; this.combo=0; this.comboT=0;
    this.iv = Math.max(this.iv, 20); this.spinPaid = false; this.running = false; this.dashV = 0;
    this.pT = this.kT = -99;
    SFX.spin(); spawnDust(this.x, this.y, 6);
  }
  spinHit() {
    let hit = false;
    for (const e of game.enemies) {
      if (e.dead || e.state==="down"||e.state==="launch"||e.state==="thrown"||e.state==="grabbed") continue;
      const dx = e.x - this.x;
      if (Math.abs(e.y-this.y) < 15 && Math.abs(dx) < 30*RK) { e.takeHit(12, Math.sign(dx||this.face)*3.2, true); hit = true; this.countHit(); }
    }
    for (const b of game.breaks) if (!b.dead && Math.abs(b.y-this.y) < 15 && Math.abs(b.x-this.x) < 30*RK) { hitBreak(b); hit = true; }
    if (hit) {
      SFX.kick(); game.shake = 5;
      if (!this.spinPaid) { this.spinPaid = true; const cost = Math.min(6, this.hp-1);
        if (cost > 0) { this.hp -= cost; say(this.x, this.feetY-58*RK, "-"+cost, "#c94a4a", 40); } }
    }
  }
  releaseGrab(freeEnemy=true) {
    const e = this.grabbing;
    this.grabbing=null; this.grabT=0; this.grabHits=0;
    if (e && freeEnemy && e.state==="grabbed") { e.state="idle"; e.cool=28; }
    if (this.state==="grab"||this.state==="gknee") this.state="idle";
  }
  throwEnemy(e) {                       // rzut przez ramię — klasyka gatunku
    this.releaseGrab(false);
    e.state="thrown"; e.face=-this.face;
    e.vx=this.face*4.4; e.vz=2.8; e.z=Math.max(e.z,1); e.bounced=false;
    e.hp -= 14; e.hitT=8;
    spawnSpark(e.x, e.feetY-14*RK, true);
    SFX.kick(); game.shake=4; game.hitstop=4;
    if (e.hp<=0) e.scoreKO();
    this.state="throw"; this.atkDur=this.atkT=12; this.pend=null;
  }
  update() {
    this.t++;
    if (this.hitT>0) this.hitT--;
    if (this.iv>0) this.iv--;
    if (this.comboT>0) this.comboT--; else this.combo=0;
    if (this.hitsT>0 && --this.hitsT===0) this.hits = 0;
    if (input.punchHit) this.pT = this.t;
    if (input.kickHit)  this.kT = this.t;
    const both = input.specHit || ((input.punchHit || input.kickHit) && Math.abs(this.pT - this.kT) <= 6);
    this.applySlide();

    if (this.state==="launch") {        // zbity w powietrzu
      if (this.airStep()) this.downT = 60;
      return;
    }
    if (this.state==="down") {
      this.downT--;
      if (this.downT<=0) {
        if (this.hp<=0) { game.onPlayerKO(); return; }
        this.state="idle"; this.iv=50; spawnDust(this.x, this.y, 3);
      }
      return;
    }
    if (this.state==="held") {                          // złapany — szarp się (wciskaj cokolwiek / ruszaj w boki)
      const e = this.heldBy;
      if (!e || e.dead || e.state!=="grabP") { this.state="idle"; this.heldBy=null; return; }
      const axs = input.ax > 0.5 ? 1 : input.ax < -0.5 ? -1 : 0;
      const mash = input.punchHit || input.kickHit || input.jumpHit || input.specHit || (axs && axs !== this.prevAxs);
      this.prevAxs = axs;
      this.holdT -= mash ? 11 : 1;
      if (this.holdT <= 0) {
        this.state = "idle"; this.heldBy = null; this.iv = 30; this.kvx = e.face*2.2;
        e.state = "hit"; e.stunT = 26; e.cool = 50; e.kvx = -e.face*2;
        say(this.x, this.feetY-50*RK, "WYRWAŁEŚ SIĘ!", "#7ec96a", 50); SFX.grab();
      }
      return;
    }
    if (this.state==="hit") { if (--this.stunT<=0) this.state="idle"; return; }

    // --- chwyt: trzymasz przeciwnika ---
    if (this.state==="grab" || this.state==="gknee") {
      const e = this.grabbing;
      if (!e || e.dead || e.state!=="grabbed") { this.releaseGrab(); return; }
      e.x = this.x + this.face*11*RK; e.y = this.y; e.face = -this.face;
      if (this.state==="gknee") {
        if (input.kickHit) { this.throwEnemy(e); return; }   // rzut przerywa kolano
        if (input.punchHit) this.buf="punch";                // zbuforowane następne kolano
        if (--this.atkT<=0) this.state="grab";
        return;
      }
      if (--this.grabT<=0) {            // wyrwał się
        e.state="idle"; e.cool=24;
        this.releaseGrab(false); this.kvx = -this.face*1.6;
        say(this.x, this.feetY-46*RK, "WYRWAŁ SIĘ!", "#c9c4b2", 40);
        return;
      }
      if (input.punchHit || this.buf==="punch") {  // kolano
        this.buf=null;
        this.state="gknee"; this.atkT=11; this.grabHits++; this.countHit();
        e.hp -= 8; e.hitT=10;
        spawnSpark(this.x + this.face*9*RK, this.feetY-14*RK);
        spawnGibs(e.x, e.y, "#8a1f1f", 4);
        SFX.punch(); game.hitstop=3; game.shake=2;
        if (e.hp<=0) { this.releaseGrab(false); e.takeHit(1, this.face*2.6, true); }
        else if (this.grabHits>=3) this.throwEnemy(e);   // trzecie kolano wysyła w lot
        return;
      }
      if (input.kickHit) { this.throwEnemy(e); return; }
      return;
    }

    // --- w powietrzu ---
    if (this.z>0 || this.vz!==0) {
      this.z += this.vz; this.vz -= 0.24;
      this.x += this.jvx;
      if (this.state==="jump" && (input.punchHit || input.kickHit)) {
        this.state="jkick"; this.jkSet = new Set(); SFX.whiff();
      }
      if (this.state==="jkick") {       // kopniak z wyskoku
        for (const e of game.enemies) {
          if (e.dead || this.jkSet.has(e)) continue;
          if (e.state==="down"||e.state==="launch"||e.state==="thrown"||e.state==="grabbed") continue;
          const dx = e.x - this.x;
          if (Math.abs(e.y-this.y)<13 && dx*this.face>0 && Math.abs(dx)<24*RK && this.z<34) {
            this.jkSet.add(e); this.countHit();
            e.takeHit(13, this.face*2.6, true);
            SFX.kick(); game.shake=4;
          }
        }
      }
      if (this.z<=0) {
        this.z=0; this.vz=0; this.jvx=0; this.jkSet=null;
        spawnDust(this.x, this.y, 3);
        this.state="idle";
      }
      this.x = clamp(this.x, game.camX+12, Math.min(game.camLimit+VW-12, LEVEL_LEN-12));
      return;
    }

    // --- ataki (trafienie w klatce wyprostu, buforowanie wejścia) ---
    if (this.atkT>0) {
      if (both && this.atkDur-this.atkT <= 7 && (this.state==="punch1" || this.state==="kick")) { this.special(); return; }
      this.atkT--;
      if (this.dashV) {                                   // rozpęd ataku z biegu
        this.x += this.face*this.dashV; this.dashV *= 0.88; if (this.dashV < 0.2) this.dashV = 0;
        if (this.atkT % 4 === 0) spawnDust(this.x, this.y, 1);
        this.x = clamp(this.x, game.camX+12, Math.min(game.camLimit+VW-12, LEVEL_LEN-12));
      }
      if (this.state==="spin" && (this.atkT===17 || this.atkT===8)) this.spinHit();
      if (input.punchHit) this.buf="punch";
      else if (input.kickHit) this.buf="kick";
      if (this.pend && this.atkT===this.pend.frame) {
        const p=this.pend; this.pend=null;
        if (p.step) this.x += this.face*p.step;
        this.hitEnemies(p.reach, p.dmg, p.kb, p.heavy, p.dyTol||13, p.launch);
      }
      if (this.state==="wswing" && this.atkT===this.wHitFrame && this.weapon) {
        const cfg = WEAPON_CFG[this.weapon.kind];
        if (cfg.ranged) {                              // pistolet — strzał po linii
          SFX.shot(); game.shake = 3;
          const muzX = this.x + this.face*24*RK, muzY = this.feetY-34*RK;   // zmierzony koniec lufy
          spawnSpark(muzX, muzY, false);
          let best=null, bd=1e9;
          for (const e of game.enemies) {
            if (e.dead || e.state==="down"||e.state==="launch"||e.state==="thrown") continue;
            const dx = e.x - this.x;
            if (dx*this.face>2 && Math.abs(dx)<cfg.reach && Math.abs(e.y-this.y)<cfg.dyTol && Math.abs(dx)<bd) { best=e; bd=Math.abs(dx); }
          }
          let hitX = this.x + this.face*cfg.reach;     // domyślnie: cały zasięg
          if (best) { hitX = best.x - this.face*4; best.takeHit(best.isBoss ? 18 : cfg.dmg, this.face*cfg.kb, true); }
          else for (const b of bottles) {              // zestrzelenie granatu/butelki
            const dx = b.x - this.x;
            if (!b.dead && b.kind!=="pthrow" && b.kind!=="fala" && dx*this.face>0 && Math.abs(dx)<cfg.reach && Math.abs(b.y-this.y)<14 && (b.z||0) < 60*RK) { hitX=b.x; smashProjectile(b); spawnSpark(b.x, b.y-b.z, false); break; }
          }
          spawnTracer(muzX, muzY, hitX);
        } else if (cfg.oneshot) {
          this.oneshotStab(cfg);                       // strzykawka: dobija zwykłego wroga
        } else if (cfg.circular) {
          this.circularHit(cfg);                       // motyka: cios dookoła
        } else {
          this.hitEnemies(cfg.reach, cfg.dmg, cfg.kb, true, cfg.dyTol);
          if (this.weapon.kind === "rura" && game.enemies.some(e => e.hitT === 12)) SFX.clang();
        }
        if (--this.weapon.dur<=0) {
          say(this.x, this.feetY-50*RK, cfg.breakMsg, "#c9c4b2");
          SFX.bottle(); this.weapon=null;
        }
      }
      if (this.atkT===0) {
        this.state="idle"; this.dashV = 0;
        if (this.buf) { const b=this.buf; this.buf=null; this.attack(b); }
      }
      return; // locked during attack
    }
    if (both) { this.special(); return; }
    // podwójne wychylenie w bok = bieg
    const axs = input.ax > 0.6 ? 1 : input.ax < -0.6 ? -1 : 0;
    if (axs && axs !== this.prevAxs) {
      if (axs === this.tapDir && this.t - this.tapT < 16) { this.running = true; this.runDir = axs; SFX.dash(); spawnDust(this.x, this.y, 4); }
      this.tapDir = axs; this.tapT = this.t;
    }
    if (this.running && axs !== this.runDir) this.running = false;
    this.prevAxs = axs;
    if (input.punchHit) { this.attack("punch"); return; }
    if (input.kickHit)  { this.attack("kick");  return; }
    if (input.jumpHit)  {                       // skok
      this.vz=3.3; this.z=0.01; this.jvx=input.ax*1.6;
      this.state="jump"; spawnDust(this.x, this.y, 3);
      return;
    }

    // movement
    const spd = this.running ? 2.7 : 1.5, spdY = this.running ? 0.7 : 1.05;
    let mx = input.ax, my = input.ay;
    const m = Math.hypot(mx,my);
    if (Math.abs(mx)>0.15 || Math.abs(my)>0.15) {
      if (m>1){ mx/=m; my/=m; }
      this.x += mx*spd; this.y += my*spdY;
      if (Math.abs(mx)>0.15) this.face = mx>0?1:-1;
      this.state="walk"; this.walkT += this.running ? 2 : 1;
      if (this.running && this.t % 7 === 0) spawnDust(this.x - this.face*4, this.y, 1);
      // auto-chwyt: podchodzisz wprost do przeciwnika (bez broni, nie boss, nie w biegu)
      if (!this.weapon && !this.running) for (const e of game.enemies) {
        if (e.dead || e.isBoss || e.noGrab) continue;
        if (e.state==="down"||e.state==="launch"||e.state==="thrown"||e.state==="grabbed"||e.state==="hit") continue;
        const dx = e.x - this.x;
        if (Math.abs(dx)>3.5*RK && Math.abs(dx)<12*RK && Math.abs(e.y-this.y)<7 && dx*mx>0) {
          this.grabbing=e; this.grabT=110; this.grabHits=0; this.state="grab";
          this.face = dx>0?1:-1;
          e.state="grabbed"; e.kvx=0; e.atkT=0; e.windT=undefined; e.pendA=null;
          SFX.grab();
          return;
        }
      }
    } else { this.state="idle"; this.running = false; }

    this.x = clamp(this.x, game.camX+12, Math.min(game.camLimit+VW-12, LEVEL_LEN-12));
    this.y = clamp(this.y, GROUND_TOP+14, GROUND_BOT);

    // broń z ziemi — podnosi lub WYMIENIA na nową
    for (const w of weapons) if (w.cd>0) w.cd--;                  // odrzucona broń chwilę leży
    for (let i=weapons.length-1;i>=0;i--) {
      const w = weapons[i];
      if (w.cd>0) continue;
      if (Math.abs(w.x-this.x)<11 && Math.abs(w.y-this.y)<11) {
        if (this.weapon && this.weapon.kind===w.kind) break;      // ta sama broń — nie podnoś
        const dropped = this.weapon;                              // wymiana: stara ląduje za plecami
        this.weapon = { kind:w.kind, dur:w.dur };
        const cfg = WEAPON_CFG[w.kind];
        say(this.x, this.feetY-46*RK, cfg.label + "!", "#e8c15a");
        if (!cfg.ranged) say(this.x, this.feetY-36*RK, "X — rzuć", "#c9c4b2", 70);
        SFX.pickup(); weapons.splice(i,1);
        if (dropped) weapons.push({ x:this.x-this.face*16, y:this.y+rnd(-3,3), kind:dropped.kind, dur:dropped.dur, cd:50 });
        break;
      }
    }
    // pickups
    for (let i=pickups.length-1;i>=0;i--) {
      const p = pickups[i];
      if (Math.abs(p.x-this.x)<12 && Math.abs(p.y-this.y)<12) {
        if (p.kind==="wodka") {                                   // Wódka czysta: +1 życie
          this.lives++;
          say(this.x, this.feetY-46*RK, "WÓDKA CZYSTA! +1 ŻYCIE", "#e8e4d8");
          SFX.pickup(); pickups.splice(i,1); score += 200; continue;
        }
        const heal = p.kind==="specjal" ? 999
                   : (p.kind==="zapiekanka"||p.kind==="kalarepa") ? 55 : 30;
        this.hp = clamp(this.hp+heal, 0, this.maxhp);
        const msg = p.kind==="specjal" ? "PIWO SPECJAL! PEŁNE ŻYCIE"
                  : p.kind==="kalarepa" ? "KALAREPA! +55"
                  : p.kind==="zapiekanka" ? "ZAPIEKANKA! +55" : "ORANŻADA +30";
        say(this.x, this.feetY-46*RK, msg, p.kind==="specjal" ? "#e8c15a" : "#7ec96a");
        SFX.pickup(); pickups.splice(i,1);
        score += p.kind==="specjal" ? 200 : 50;
      }
    }
  }
  throwWeapon() {                                    // X z bronią w ręku = rzut bronią
    const w = this.weapon; this.weapon = null;
    this.state = "throw"; this.atkDur = this.atkT = 12; this.pend = null; this.combo = 0; this.comboT = 0;
    bottles.push({ kind:"pthrow", wk:w.kind, dur:w.dur, x:this.x + this.face*10, y:this.y, z:18*RK, vx:this.face*5.2, vz:0.25, dead:false, spin:0 });
    SFX.whiff();
  }
  attack(kind) {
    if (kind==="kick" && this.weapon && !WEAPON_CFG[this.weapon.kind].ranged) { this.throwWeapon(); return; }
    if (this.running && !this.weapon) {               // atak z biegu
      this.running = false; this.combo = 0; this.comboT = 0;
      if (kind==="punch") { this.state="dashP"; this.atkDur=this.atkT=20; this.dashV=3.4;
        this.pend = { frame:13, reach:22*RK, dmg:14, kb:3.4, heavy:true }; }
      else { this.state="slide"; this.atkDur=this.atkT=24; this.dashV=3.8;
        this.pend = { frame:15, reach:30*RK, dmg:13, kb:2.4, heavy:true, launch:true, dyTol:15 }; }
      SFX.dash(); spawnDust(this.x, this.y, 5); return;
    }
    if (kind==="punch" && this.weapon) {
      const cfg = WEAPON_CFG[this.weapon.kind];
      const rura = this.weapon.kind==="rura";
      const dur = cfg.circular ? 22 : (rura ? 18 : 14);
      this.state="wswing"; this.atkDur=this.atkT = dur; this.wHitFrame = this.atkT - (cfg.circular ? 12 : rura ? 10 : 5);
      this.comboT=0; this.combo=0; this.pend=null;
      return;
    }
    if (kind==="punch") {
      // łańcuch: prosty, prosty, sierp, uppercut (posyła w powietrze)
      this.combo = this.comboT>0 ? Math.min(this.combo+1, 4) : 1;
      this.comboT = 36;
      if (this.combo===4) {
        this.state="upper"; this.atkDur=this.atkT=18; this.comboT=0;
        this.pend = { frame:this.atkT-5, reach:20*RK, dmg:15, kb:2.0, heavy:true, launch:true, step:2 };
      } else {
        const heavy = this.combo===3;
        this.state="punch"+this.combo;
        this.atkDur=this.atkT = heavy ? 13 : 10;
        this.pend = { frame:this.atkT-2, reach:20*RK, dmg: heavy?12:7, kb: heavy?3.0:1.1, heavy };
      }
    } else {
      this.state="kick"; this.atkDur=this.atkT=20; this.comboT=0; this.combo=0;
      this.pend = { frame:12, reach:24*RK, dmg:15, kb:2.8, heavy:true, step:5 };
    }
  }
  hitEnemies(reach, dmg, kb, heavy, dyTol=13, launch=false) {
    let hit = false;
    for (const e of game.enemies) {
      if (e.dead || e.state==="down" || e.state==="launch" || e.state==="thrown") continue;
      const dx = e.x - this.x, dy = Math.abs(e.y - this.y);
      if (dy < dyTol && dx*this.face > 2 && Math.abs(dx) < reach) {
        e.takeHit(dmg, this.face*kb, heavy, launch);
        hit = true; this.countHit();
      }
    }
    for (const b of game.breaks) {
      if (b.dead) continue;
      const dx = b.x - this.x;
      if (Math.abs(b.y - this.y) < dyTol && dx*this.face > -2 && Math.abs(dx) < reach + 4) { hitBreak(b); hit = true; }
    }
    // hit bottles out of the air
    for (const b of bottles) {
      if (b.kind === "pthrow" || b.kind === "fala" || (b.z||0) > 34*RK) continue;   // tylko to, co leci na wysokości pięści
      const dx = b.x - this.x;
      if (Math.abs(b.y - this.y)<12 && dx*this.face>0 && Math.abs(dx)<reach) smashProjectile(b);
    }
    if (hit) { heavy ? SFX.kick() : SFX.punch(); game.shake = heavy?4:2; }
    else SFX.whiff();
  }
  oneshotStab(cfg) {                                  // strzykawka: natychmiast dobija (bossowie odporni)
    let hit = false;
    for (const e of game.enemies) {
      if (e.dead || e.state==="down") continue;
      const dx = e.x - this.x, dy = Math.abs(e.y - this.y);
      if (dy < cfg.dyTol && dx*this.face > 2 && Math.abs(dx) < cfg.reach) {
        if (e.isBoss) { e.takeHit(24, this.face*2, true); }        // boss: tylko mocny cios
        else { e.takeHit(9999, this.face*2, true); }               // zwykły: śmierć
        hit = true; break;
      }
    }
    if (hit) { SFX.kick(); game.shake = 5; } else SFX.whiff();
  }
  circularHit(cfg) {                                  // motyka: bije wrogów dookoła
    let hit = false;
    for (const e of game.enemies) {
      if (e.dead || e.state==="down") continue;
      const dx = e.x - this.x, dy = Math.abs(e.y - this.y);
      if (dy < cfg.dyTol && Math.abs(dx) < cfg.reach) {            // obie strony, bez warunku face
        e.takeHit(cfg.dmg, Math.sign(dx || this.face)*cfg.kb, true);
        hit = true; this.countHit();
      }
    }
    for (const b of game.breaks) if (!b.dead && Math.abs(b.y-this.y) < cfg.dyTol && Math.abs(b.x-this.x) < cfg.reach) { hitBreak(b); hit = true; }
    if (hit) { SFX.kick(); game.shake = 5; } else SFX.whiff();
  }
  takeHit(dmg, kb) {
    if (this.iv>0 || this.state==="down" || this.state==="launch") return;
    if (this.state==="held") { const e = this.heldBy; this.heldBy = null; this.state = "idle"; if (e && e.state==="grabP") { e.state = "idle"; e.cool = 40; } }
    if (this.grabbing) this.releaseGrab();
    this.running = false; this.dashV = 0; this.hits = 0; this.hitsT = 0;
    this.dmgTaken = (this.dmgTaken||0) + dmg;
    this.hp -= dmg;
    this.hitT = 14; game.shake = 3;
    game.hitstop = Math.max(game.hitstop, 2);
    spawnGibs(this.x, this.y, "#8a1f1f", 6);
    spawnSpark(this.x + Math.sign(kb)*4, this.feetY-16*RK);
    SFX.hurt();
    const dropWeapon = () => {
      if (this.weapon) { weapons.push({ x:this.x+rnd(-10,10), y:this.y, kind:this.weapon.kind, dur:this.weapon.dur }); this.weapon=null; }
    };
    if (this.z>0) {                           // zbity w powietrzu → gleba
      this.state="launch"; this.vx = Math.sign(kb)*1.8; this.vz = Math.max(this.vz, 1.4);
      this.jvx=0; dropWeapon();
    } else if (this.hp<=0 || Math.abs(kb)>2.6) {
      this.state="down"; this.downT=60; this.kvx = kb*2.6;
      dropWeapon();
    } else {
      this.state="hit"; this.stunT=12; this.kvx = kb*1.5;
    }
  }
}

// ---------- broń ----------
// dur: liczba użyć (strzykawka=1). reach/dmg/kb/dyTol per typ. circular: motyka bije wokół.
const WEAPON_CFG = {
  tulipan:    { label:"TULIPANEK", dur:8,  reach:26*RK, dmg:14, kb:2,   dyTol:13, breakMsg:"TULIPANEK PĘKŁ" },
  rura:       { label:"RURA",      dur:12, reach:38*RK, dmg:18, kb:3,   dyTol:17, breakMsg:"RURA SIĘ WYGIĘŁA" },
  strzykawka: { label:"STRZYKAWKA",dur:1,  reach:26*RK, dmg:9999, kb:2, dyTol:15, oneshot:true, breakMsg:"STRZYKAWKA ZUŻYTA" },
  motyka:     { label:"MOTYKA",    dur:10, reach:30*RK, dmg:15, kb:2.4, dyTol:15, circular:true, breakMsg:"MOTYKA SIĘ ZŁAMAŁA" },
  pistolet:   { label:"PISTOLET",  dur:6,  reach:160, dmg:32, kb:3.2, dyTol:12, ranged:true, breakMsg:"PUSTY MAGAZYNEK" },
};

// ---------- style walki: każdy typ ma własny zestaw ruchów (r = zasięg ponad bazowy, d = mnożnik obrażeń) ----------
const MV = {
