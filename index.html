const MOVESET = {
  dres:[["jab2",3],["hook",2],["lunge",2]],           dres2:[["kickE",3],["sweep",2],["jumpkick",2]],
  kijek:[["bat",3],["overhead",2]],                   lysy:[["hook",2],["grab",3],["jab2",1]],
  menel:[["jab2",1]],                                 pielegniarka:[["slap2",3],["kickE",1]],
  dzialkowiec:[["shovel",2],["poke",2]],              babcia:[["bag",1]],
  gigadres:[["hook",2],["tackle",2],["jab2",1]],      zolnierz:[["jab2",2],["jumpkick",2],["kickE",1]],
  boss:[["jab2",2],["hook",2],["grab",2],["piwo",1]], proboszcz:[["dkick",3],["woda",1],["spinE",2]],
  rybak:[["jab2",2],["hook",2],["belly",2],["grab",2]], lekarz:[["jab2",1],["stab",2]],
  sasiad:[["rake",3],["rakepoke",2],["krasnal",2]],   burak:[["hook",2],["jab2",1],["tackle",2]],
};
function pickW(list) { let t = 0; for (const [, w] of list) t += w; let r = Math.random()*t; for (const [m, w] of list) { if ((r -= w) <= 0) return m; } return list[0][0]; }
function throwProjectile(e, pl, kind) {
  if (kind === "butelka") { bottles.push({ x:e.x+e.face*8, y:pl.y+rnd(-4,4), z:16*RK, vx:e.face*2.6, vz:0.45, dead:false, kind:"butelka", dmg:e.dmg }); SFX.bottle(); return; }
  const vz = kind === "krasnal" ? 1.9 : 1.7, g = 0.08, z0 = 18*RK;     // łuk prosto na gracza
  const T = (vz + Math.sqrt(vz*vz + 2*g*z0)) / g;
  bottles.push({ kind, x:e.x+e.face*8, y:e.y, z:z0, vz, g, vx:(pl.x - e.x - e.face*8)/T, vy:(pl.y - e.y)/T, dead:false, dmg:e.dmg + (kind === "krasnal" ? 3 : 0), spin:0 });
  SFX.whiff();
}

// ---------- enemies ----------
const TAUNTS = ["Ej, ty!", "Dawaj kaskę!", "Masz fajki?", "Co się patrzysz?!", "Nie znasz mnie?", "Oddawaj kurtkę!", "Z naszego osiedla?", "Kijem cię pogonię!", "Hik!... czego się?!"];
class Enemy extends Fighter {
  constructor(kind, x, y) {
    const cfg = {
      dres:  { pal:PAL.dres,  hp:26, spd:0.85, dmg:7,  pts:100 },
      dres2: { pal:PAL.dres2, hp:30, spd:0.95, dmg:8,  pts:120 },
      lysy:  { pal:PAL.lysy,  hp:44, spd:0.75, dmg:11, pts:200 },
      kijek: { pal:PAL.kijek, hp:34, spd:0.9,  dmg:10, pts:180 },
      pijany:{ pal:PAL.pijany, hp:38, spd:0.8,  dmg:13, pts:220, drunk:true },
      pielegniarka:{ pal:PAL.pielegniarka, hp:30, spd:1.15, dmg:9, pts:160,
        taunts:["Godziny przyjęć MINĘŁY!","Rejestracja nieczynna!","Bez skierowania?!","Na SOR z tobą!"] },
      dzialkowiec:{ pal:PAL.dzialkowiec, hp:36, spd:0.85, dmg:11, pts:190,
        taunts:["Z mojej działki?!","Wandale!","Zadzwonię do zarządu ROD!","Ja tu 30 lat kopię!"] },
      babcia:{ pal:PAL.babcia, hp:24, spd:0.55, dmg:6, pts:150,
        taunts:["A sio mi stąd!","Złodziej marchewki!","Precz z grządki!","Znam twoją matkę!"] },
      menel: { pal:PAL.menel, hp:22, spd:0.6,  dmg:6,  pts:150 },
      boss:  { pal:PAL.boss,  hp:230, spd:0.8,  dmg:13, pts:1000, big:true },
      rybak: { pal:PAL.rybak, hp:250, spd:0.85, dmg:14, pts:1500, big:true },
      proboszcz: { pal:PAL.proboszcz, hp:190, spd:0.95, dmg:12, pts:900, big:true, noAdds:true,
                   chargeLine:"A CHODŹ NO TU!", p2line:"JA CIĘ NAUCZĘ MORESU!" },
      lekarz: { pal:PAL.lekarz, hp:220, spd:0.9, dmg:13, pts:1200, big:true, drunk:true, noAdds:true,
                   chargeLine:"DO GABINETU!", p2line:"CZAS NA ZABIEG!" },
      sasiad: { pal:PAL.sasiad, hp:240, spd:0.9, dmg:13, pts:1300, big:true,
                   adds:["dzialkowiec","babcia"], addsShout:"SĄSIEDZI!!!",
                   chargeLine:"JA CI DAM IMPREZĘ!", p2line:"GRABIE PRAWDĘ CI POWIEDZĄ!" },
      gigadres: { pal:PAL.gigadres, hp:58, spd:0.78, dmg:10, pts:280, size:1.18, noGrab:true,
                   taunts:["ŁAPAĆ GO!","Mały, chodź no tu!","Kwadrat pozdrawia!","Nie uciekniesz z Babich!"] },
      zolnierz: { pal:PAL.zolnierz, hp:32, spd:1.0, dmg:8, pts:220,
                   taunts:["STÓJ! Kto idzie?!","Teren wojskowy!","Do mnie, pluton!","Cywil na terenie JW!"] },
      burak: { pal:PAL.burak, hp:280, spd:0.85, dmg:14, pts:2500, big:true,
                   adds:["gigadres","zolnierz"], addsShout:"WOJSKO, DO MNIE!!!",
                   chargeLine:"ZA KWADRATA!", p2line:"BARSZCZ Z CIEBIE ZROBIĘ!" },
    }[kind];
    super(x, y, cfg.pal, cfg.hp);
    Object.assign(this, cfg); this.kind = kind;
    const D = DIFFS[difficulty];
    this.dmg = Math.max(1, Math.round((this.dmg + 1) * D.dmg));
    this.hp = this.maxhp = Math.round(this.hp * D.hp);
    this.big = !!cfg.big; this.isBoss = !!cfg.big;
    this.cool = irnd(30, 70);
    this.throwCool = irnd(80, 140);
    this.chargeT = 0; this.phase2 = false; this.entered = false;
    const tl = cfg.taunts || TAUNTS;
    if (!cfg.big && Math.random()<0.6) say(x, y-52*RK, tl[irnd(0,tl.length-1)], "#c9c4b2", 70);
  }
  update(pl) {
    this.t++;
    if (this.drunk && this.kind!=="pijany") this.wob = (this.wob||0) + 0.13;   // chwiejny lekarz
    if (!this.entered && this.t > 360) {   // nikt nie kryje się wiecznie za ekranem
      this.x = clamp(this.x, game.camX+8, game.camX+VW-8); this.entered = true;
    }
    if (this.hitT>0) this.hitT--;
    if (this.state==="grabbed") return;                 // trzymany przez gracza
    this.applySlide();
    if (this.z > 0 && this.state!=="launch" && this.state!=="thrown" && this.state!=="slam" && this.state!=="ejump") {
      this.z += this.vz; this.vz -= 0.22;               // trafiony w locie — zawsze spada na ziemię
      if (this.z <= 0) { this.z = 0; this.vz = 0; spawnDust(this.x, this.y, 3); }
    }
    if (this.state==="launch" || this.state==="thrown") {
      if (this.state==="thrown") {                      // rzucony taranuje innych
        for (const o of game.enemies) {
          if (o===this || o.dead) continue;
          if (o.state==="down"||o.state==="launch"||o.state==="thrown") continue;
          if (Math.abs(o.x-this.x)<14*RK && Math.abs(o.y-this.y)<10 && this.z<26*RK) {
            o.takeHit(10, Math.sign(this.vx||this.face)*2.4, true);
          }
        }
      }
      this.airStep();
      if (this.entered) {                               // odbicie od krawędzi ekranu
        const lo = game.camX+6, hi = game.camX+VW-6;
        if (this.x < lo) { this.x = lo; this.vx = Math.abs(this.vx)*0.4; }
        if (this.x > hi) { this.x = hi; this.vx = -Math.abs(this.vx)*0.4; }
      }
      return;
    }
    if (this.state==="down") {
      this.downT--;
      if (this.downT<=0) {
        if (this.hp<=0) { spawnBloodPuddle(this.x, this.feetY); this.dead=true; return; }
        this.state="idle"; this.cool = 26;
        const pl0 = game.player;                                   // wstaje z zamachem — im trudniej, tym częściej
        if (pl0 && !this.isBoss && Math.abs(pl0.x-this.x) < this.reachBase()*RK*1.2 && Math.abs(pl0.y-this.y) < 8
            && Math.random() < [0.12, 0.28, 0.42, 0.58][difficulty]) { this.cool = 0; this.face = pl0.x > this.x ? 1 : -1; this.startWindup(); }
      }
      return;
    }
    if (this.state==="hit" || this.state==="block" || this.state==="dodge") { if (--this.stunT<=0) this.state="idle"; return; }
    if (this.state==="slam") {                          // skok z przytupem (Burak) / „na brzucha” (Rybak)
      this.x += this.svx; this.y = clamp(this.y + this.svy, GROUND_TOP+14, GROUND_BOT);
      this.z += this.vz; this.vz -= 0.185;
      if (this.z<=0) {
        this.z=0; this.vz=0; this.state="idle";
        const belly = this.slamKind === "belly";
        game.shake = belly ? 5 : 7; SFX.thud(); SFX.boom();
        spawnDust(this.x, this.y, 10);
        spawnSpark(this.x-10, this.feetY-4*RK, true); spawnSpark(this.x+10, this.feetY-4*RK, true);
        const adx2 = Math.abs(pl.x-this.x), ady2 = Math.abs(pl.y-this.y);
        if (adx2<(belly ? 36 : 44) && ady2<18 && pl.iv<=0 && pl.z<=0 && pl.state!=="down")   // skokiem unikniesz wstrząsu
          pl.takeHit(this.dmg+3, Math.sign(pl.x-this.x||this.face)*3.4);
        if (this.kind === "burak") {                    // fale uderzeniowe po ziemi — przeskocz je
          for (const d of [-1, 1]) bottles.push({ kind:"fala", x:this.x + d*16, y:this.y, z:0, vx:d*3.2, life:58, dead:false, dmg:this.dmg, t:0 });
          if (this.phase2 && !this.slam2) {             // w drugiej fazie od razu drugi skok
            this.slam2 = true; this.state = "slam"; this.vz = 3.3; this.z = 0.1;
            this.svx = clamp((pl.x - this.x)/30, -3.4, 3.4); this.svy = clamp((pl.y - this.y)/30, -1.2, 1.2);
            this.face = pl.x>this.x ? 1 : -1;
          } else this.slam2 = false;
        }
        this.slamKind = null;
      }
      this.clampPos(); return;
    }
    if (this.state==="ejump") {                         // wyskok z kopniakiem
      this.x += this.svx; this.y = clamp(this.y + this.svy, GROUND_TOP+14, GROUND_BOT);
      this.z += this.vz; this.vz -= 0.2;
      if (!this.jHit && Math.abs(pl.x-this.x) < 15*RK && Math.abs(pl.y-this.y) < 12 && pl.z < 24 && pl.iv<=0 && pl.state!=="down") {
        this.jHit = true; pl.takeHit(this.dmg + 2, this.face*3.0);
      }
      if (this.z <= 0) { this.z = 0; this.vz = 0; this.state = "idle"; spawnDust(this.x, this.y, 4); SFX.thud(); }
      this.clampPos(); return;
    }
    if (this.state==="grabP") {                         // trzyma gracza: z byka / rzut
      if (pl.state==="held" && pl.heldBy===this) {
        this.gT++;
        pl.x = this.x + this.face*12*RK; pl.y = this.y; pl.face = -this.face;
        const thrower = this.kind==="boss" || this.kind==="rybak";
        if (thrower && this.gT >= 56) {                 // rzut przez biodro
          pl.heldBy = null; pl.state = "idle"; pl.iv = 0; pl.z = 1;
          pl.takeHit(this.dmg + 4, this.face*3.4); pl.vx = this.face*3.2; pl.vz = 2.6;
          this.state = "idle"; this.cool = 70; SFX.kick(); game.shake = 5;
          say(this.x, this.feetY-58*RK, "A IDŹ!", "#ff7b39", 50);
        } else if (this.gT % 34 === 20) {               // z byka
          pl.hp -= Math.max(1, Math.round(this.dmg*0.55)); pl.hitT = 10; pl.dmgTaken = (pl.dmgTaken||0) + Math.round(this.dmg*0.55);
          SFX.hurt(); spawnSpark(pl.x, pl.feetY-40*RK, false); game.shake = 3; game.hitstop = 3;
          if (pl.hp <= 0) { pl.heldBy = null; pl.state = "idle"; pl.iv = 0; pl.takeHit(0, this.face*3); this.state = "idle"; }
        }
        if (this.gT > 150 && this.state === "grabP") { pl.heldBy = null; pl.state = "idle"; this.state = "idle"; this.cool = 40; }
      } else if (--this.atkT <= 0) this.state = "idle";
      this.clampPos(); return;
    }
    if (this.windT !== undefined) {                     // telegraf — zamach przed ciosem
      this.state = "windup";
      if (--this.windT <= 0) {
        this.windT = undefined; this.strike(pl);
        this.atkDur = this.atkT;                               // dla płynnych faz animacji
        this.cool = Math.max(20, Math.round(this.cool*0.8*DIFFS[difficulty].cool));   // przerwy wg trudności
      }
      return;
    }
    if (this.atkT>0) {
      this.atkT--;
      if (this.mvDash > 0 && this.atkT > 6) this.x += this.face*this.mvDash;     // wypad do przodu
      if (this.pends) for (const p of this.pends) {
        if (p.done) continue;
        const inWin = p.f2 !== undefined ? (this.atkT <= p.frame && this.atkT >= p.f2) : this.atkT === p.frame;
        if (!inWin) continue;
        const adx = Math.abs(pl.x-this.x), ady = Math.abs(pl.y-this.y);
        const front = p.both || (pl.x - this.x)*this.face > -4;
        if (adx < p.range*RK && ady < 13 && front && pl.iv<=0 && pl.state!=="down" && !(p.low && pl.z > 3)) {
          pl.takeHit(p.dmg, (p.both ? (Math.sign(pl.x-this.x) || this.face) : this.face)*p.kb); p.done = true;
        } else if (p.f2 === undefined || this.atkT === p.f2) p.done = true;
      }
      for (const key of ["pendA","pendB"]) {            // trafienia w klatkach wyprostu (może być podwójny cios)
        const p = this[key];
        if (p && this.atkT===p.frame) {
          this[key] = null;
          const adx = Math.abs(pl.x-this.x), ady = Math.abs(pl.y-this.y);
          if (adx < p.range*RK && ady < 13 && pl.iv<=0 && pl.state!=="down") pl.takeHit(p.dmg, this.face*p.kb);
        }
      }
      if (this.atkT===0) this.state="idle";
      return;
    }
    if (this.cool>0) this.cool--;

    const dx = pl.x - this.x, dy = pl.y - this.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    this.face = dx>0?1:-1;

    if (this.chargeT>0) {                               // taran (Iskra, Gigadres, Burak)
      this.chargeT--;
      this.state="charge"; this.walkT += 2;
      this.x += this.face*(this.cspd || 2.6);
      if (ady>2) this.y += Math.sign(dy)*0.5;
      if (adx<20*RK && ady<14 && pl.iv<=0 && pl.state!=="down") { pl.takeHit(this.dmg+4, this.face*3); this.chargeT=0; this.cool=70; this.state="idle"; }
      if (this.chargeT===0){ this.cool=Math.max(this.cool, 60); this.state="idle"; this.cspd = 0; }
      this.clampPos(); return;
    }
    // boss: charge attack
    if (this.isBoss) {
      if (!this.phase2 && this.hp < this.maxhp*0.5) {
        this.phase2 = true; this.spd = 1.15;
        say(this.x, this.feetY-64*RK, this.p2line || "TERAZ SIĘ WKURZYŁEM.", "#ff7b39", 100);
        if (!this.noAdds) {
          const a = this.adds || ["dres","dres2"];
          say(this.x, this.feetY-50*RK, this.addsShout || "CHŁOPAKI!", "#ff7b39", 100);
          game.enemies.push(new Enemy(a[0], game.camX-16, rnd(GROUND_TOP+20, GROUND_BOT-6)));
          game.enemies.push(new Enemy(a[1], game.camX+VW+16, rnd(GROUND_TOP+20, GROUND_BOT-6)));
        }
        SFX.bossRoar(); game.shake = 6;
      }
      // każdy boss ma własny podpis
      if (this.kind==="boss" && this.cool===0 && adx>50 && adx<210 && ady<22 && Math.random()<0.65) {
        this.chargeT = 48; SFX.bossRoar();                    // Kwadrat: taran, częsty i szybki
        say(this.x, this.feetY-60*RK, this.chargeLine || "ZGNIOTĘ CIĘ!", "#ff7b39", 60);
        return;
      }
      if (this.kind==="lekarz") {                             // Lekarz: rzuca strzykawkami
        if (this.thrCool===undefined) this.thrCool = 90;
        if (this.thrCool>0) this.thrCool--;
        if (this.thrCool===0 && this.cool===0 && adx>64 && adx<230 && ady<40) {
          this.state="throw"; this.atkT=20; this.thrCool=irnd(130,200);
          say(this.x, this.feetY-58*RK, "ZABIEG!", "#ff7b39", 46);
          for (const oy of (this.phase2 ? [-12, 0, 12] : [0]))       // w drugiej fazie wachlarz trzech
            bottles.push({x:this.x+this.face*8, y:clamp(pl.y+oy+rnd(-3,3), GROUND_TOP+14, GROUND_BOT), z:15*RK, vx:this.face*2.6,
                          vz:0.55, dead:false, kind:"strzyk", dmg:10});
          SFX.whiff(); this.clampPos(); return;
        }
      }
      if (this.kind==="burak") {                              // Burak: skok z przytupem
        if (this.slamCool===undefined) this.slamCool = 160;
        if (this.slamCool>0) this.slamCool--;
        if (this.slamCool===0 && this.cool===0 && adx>44 && adx<200) {
          this.state="slam"; this.slamCool=irnd(240,340); this.cool=40;
          this.vz = 3.7; this.z = 0.1;
          this.svx = clamp((pl.x - this.x)/34, -3.4, 3.4);
          this.svy = clamp((pl.y - this.y)/34, -1.2, 1.2);
          this.face = pl.x>this.x ? 1 : -1;
          say(this.x, this.feetY-60*RK, "HOP!", "#ff7b39", 40);
          SFX.bossRoar(); return;
        }
      }
    }

    // pijany: chwieje się, szarżuje na oślep, czasem sam się wywraca
    if (this.kind==="pijany") {
      this.wob = (this.wob === undefined ? rnd(0, 6) : this.wob) + 0.16;
      if (this.lurchT === undefined) { this.lurchT = irnd(40, 90); this.lx = 0; this.ly = 0; }
      if (--this.lurchT <= 0) {           // nagły zryw w losową stronę
        this.lurchT = irnd(45, 95);
        const a = rnd(0, Math.PI*2);
        this.lx = Math.cos(a)*2.2; this.ly = Math.sin(a)*1.2;
        this.lurchF = 14;
      }
      if (this.lurchF > 0) this.lurchF--; else { this.lx = 0; this.ly = 0; }
      if (adx > 20*RK || ady > 7) {
        this.x += Math.sign(dx)*this.spd + Math.sin(this.wob)*1.5 + this.lx;
        this.y += (ady > 3 ? Math.sign(dy)*this.spd*0.6 : 0) + Math.cos(this.wob*0.7)*0.9 + this.ly;
        this.state = "walk"; this.walkT++;
      } else if (this.cool===0 && pl.state!=="down") {
        this.windT = this.windT0 = Math.round(11*DIFFS[difficulty].wind); this.state = "windup";   // chwiejny zamach
      } else this.state = "idle";
      this.clampPos(); return;
    }
    // żołnierz: z dystansu granat, z bliska normalnie
    if (this.kind==="zolnierz") {
      if (this.throwCool>0) this.throwCool--;
      if (this.throwCool===0 && adx>85 && adx<230 && ady<40 && this.entered) {
        this.state="throw"; this.atkT=22; this.throwCool=irnd(200,320);
        bottles.push({x:this.x+this.face*8, y:pl.y+rnd(-6,6), z:16*RK, vx:this.face*2.0,
                      vz:0.9, dead:false, kind:"granat", fuse:-1});
        SFX.whiff();
        this.clampPos(); return;
      }
    }
    // menel / babcia: trzymają dystans i rzucają
    if (this.kind==="menel" || this.kind==="babcia") {
      if (this.throwCool>0) this.throwCool--;
      if (this.kind==="babcia" && adx < 26*RK && ady < 8 && this.cool===0) { this.startWindup("bag"); this.clampPos(); return; }
      if (adx < 60 && this.cool===0 && this.entered) { // back away — tylko na ekranie
        this.x -= this.face*this.spd; this.state="walk"; this.walkT++;
      } else if (adx > 80 || !this.entered) {
        this.x += this.face*this.spd*0.8; this.state="walk"; this.walkT++;
      } else this.state="idle";
      if (ady>4) { this.y += Math.sign(dy)*0.5; this.walkT++; }
      if (this.throwCool===0 && adx<200 && ady<16) {
        this.state="throw"; this.atkT=22; this.throwCool=irnd(110,170);
        const march = this.kind==="babcia";
        bottles.push({x:this.x+this.face*8, y:this.y, z:16*RK, vx:this.face*(march?2.1:2.4),
                      vz: march?0.55:0.4, dead:false, kind: march?"marchewka":"butelka", dmg: march?6:8});
        SFX.bottle();
      }
      this.clampPos(); return;
    }

    // CHUDY odskakuje przed ciosem
    if (this.kind==="dres2" && pl.atkT>0 && pl.atkT===pl.atkDur && adx < 30*RK && ady < 10 && this.cool > 0 && Math.random() < 0.3) {
      this.state = "dodge"; this.stunT = 12; this.kvx = -this.face*3.2; this.windT = undefined;
      say(this.x, this.feetY-48*RK, "hop!", "#c9c4b2", 30); return;
    }
    // ruchy z dystansu: wypad, wyskok, taran, rzut — tylko ten, kto ma żeton (albo boss)
    if (this.cool===0 && (this.tok || this.isBoss) && this.entered && pl.state!=="down" && pl.state!=="held" && ady < 16) {
      const far = (MOVESET[this.kind]||[]).filter(([m]) => MV[m].range && (!MV[m].p2 || this.phase2) && adx >= MV[m].range[0] && adx <= MV[m].range[1]);
      if (far.length && Math.random() < 0.035) { this.startWindup(pickW(far)); this.clampPos(); return; }
    }
    // melee approach — z żetonem idzie bić, bez żetonu krąży w bezpiecznej odległości i czeka
    const reach = this.reachBase()*RK;
    if (!this.isBoss && !this.tok) {
      const side = this.side || (dx > 0 ? -1 : 1), slot = this.slot || 0;
      const tx = pl.x + side*(46*RK + slot*18);
      const ty = clamp(pl.y + (slot%2 ? 16 : -12), GROUND_TOP+14, GROUND_BOT);
      const mx = tx - this.x, my = ty - this.y;
      let moved = false;
      if (Math.abs(mx) > 5) { this.x += Math.sign(mx)*this.spd*0.8; moved = true; }
      if (Math.abs(my) > 4) { this.y += Math.sign(my)*this.spd*0.55; moved = true; }
      this.state = moved ? "walk" : "idle"; if (moved) this.walkT++;
      if (adx < reach*0.85 && ady < 6 && this.cool===0 && pl.state!=="down") this.startWindup();   // przyparty — oddaje
      this.clampPos(); return;
    }
    if (adx > reach || ady > 6) {
      const sp = this.spd;
      if (adx > reach*0.8) this.x += Math.sign(dx)*sp;
      if (ady > 3) this.y += Math.sign(dy)*sp*0.7;
      this.state="walk"; this.walkT++;
    } else if (this.cool===0 && pl.state!=="down") this.startWindup();
    else this.state="idle";
    this.clampPos();
  }
  startWindup(mvName) {                 // telegraf — długość zależy od ruchu i trudności
    if (!mvName) {
      const near = (MOVESET[this.kind]||[]).filter(([m]) => !MV[m].range && (!MV[m].p2 || this.phase2));
      mvName = near.length ? pickW(near) : null;
    }
    this.mv = mvName ? MV[mvName] : null;
    const base = this.isBoss ? 7 : (this.kind==="babcia" ? 13 : 10);
    this.windT = Math.max(4, Math.round(base * (this.mv ? this.mv.wind : 1) * DIFFS[difficulty].wind));
    this.windT0 = this.windT;
    this.state = "windup";
  }
  doMove(pl, m) {                       // wykonanie ruchu po telegrafie
    const reach = this.reachBase();
    this.cool = irnd(m.cool[0], m.cool[1]);
    if (this.phase2) this.cool = Math.round(this.cool*0.75);
    if (m.grab) {
      this.state = "grabP"; this.gT = 0; this.atkT = 16;
      const adx = Math.abs(pl.x-this.x), ady = Math.abs(pl.y-this.y);
      if (adx < (reach+6)*RK && ady < 9 && pl.z <= 0 && pl.iv <= 0 && !["down","launch","held","grab","gknee"].includes(pl.state)) {
        if (pl.grabbing) pl.releaseGrab();
        pl.state = "held"; pl.heldBy = this; pl.holdT = [80, 100, 120, 140][difficulty];
        pl.atkT = 0; pl.pend = null; pl.running = false; pl.dashV = 0;
        this.atkT = 0; SFX.grab(); say(this.x, this.feetY-56*RK, "MAM CIĘ!", "#ff7b39", 50);
      }
      return;
    }
    if (m.jump) {
      this.state = "ejump"; this.z = 0.1; this.vz = 3.0; this.jHit = false;
      this.svx = clamp((pl.x - this.x)/30, -3.4, 3.4); this.svy = clamp((pl.y - this.y)/30, -1, 1);
      SFX.whiff(); return;
    }
    if (m.charge) { this.chargeT = m.charge; this.cspd = m.cspd; SFX.screech(); return; }
    if (m.slam) {
      this.state = "slam"; this.slamKind = m.slam; this.vz = 3.0; this.z = 0.1;
      this.svx = clamp((pl.x - this.x)/30, -3.0, 3.0); this.svy = clamp((pl.y - this.y)/30, -1.2, 1.2);
      say(this.x, this.feetY-60*RK, "ARKAAA!", "#ff7b39", 40); SFX.bossRoar(); return;
    }
    if (m.throwP) { this.state = "throw"; this.atkT = 20; throwProjectile(this, pl, m.throwP); return; }
    this.state = m.anim; this.atkT = m.atk;
    this.pends = m.hits.map(h => ({ frame:h.f, f2:h.f2, range:reach + h.r, dmg:Math.max(1, Math.round(this.dmg*h.d)), kb:h.kb, low:h.low, both:h.both }));
    this.mvDash = m.dash || 0;
  }
  reachBase() { return this.kind==="sasiad" ? 28 : this.isBoss ? 24 : (this.kind==="kijek" ? 22 : (this.kind==="dzialkowiec" ? 20 : 17)); }
  strike(pl) {                          // wyprost po telegrafie — trafienie w pendA.frame (zasięgi ×RK przy trafieniu)
    if (this.mv) { const m = this.mv; this.mv = null; this.doMove(pl, m); return; }
    const reach = this.reachBase();
    if (this.kind==="pijany") {
      this.state="swing"; this.atkT=20; this.cool=irnd(60,110);
      if (Math.random() < 0.62) this.pendA = { frame:13, range:26, dmg:this.dmg, kb:2.6 };
      else {
        say(this.x, this.feetY-48*RK, "hik!...", "#c9c4b2", 46);
        if (Math.random() < 0.35) { this.state="down"; this.downT=32; }  // wywrotka
      }
      return;
    }
    if (this.kind==="kijek") { this.state="swing"; this.atkT=18; this.cool=irnd(55,95);
      this.pendA={frame:12, range:26, dmg:this.dmg, kb:2.2}; }
    else if (this.kind==="dzialkowiec") { this.state="swing"; this.atkT=18; this.cool=irnd(55,95);   // szpadlem
      this.pendA={frame:12, range:24, dmg:this.dmg, kb:2}; }
    else if (this.kind==="sasiad") { this.state="swing"; this.atkT=19; this.cool=irnd(42, this.phase2?58:78);  // młynek grabiami
      this.pendA={frame:13, range:36, dmg:this.dmg+1, kb:3};
      this.pendB={frame:5,  range:36, dmg:this.dmg-2, kb:2.2}; }
    else if (this.kind==="proboszcz") { this.state="kick"; this.atkT=18;   // podwójny kopniak spod sutanny
      this.cool = irnd(45, this.phase2 ? 62 : 82);
      this.pendA={frame:12, range:reach+6, dmg:this.dmg+1, kb:1.6};
      this.pendB={frame:5,  range:reach+9, dmg:this.dmg,   kb:2.8}; }
    else if (this.isBoss && this.phase2 && Math.random()<0.4) { this.state="swing"; this.atkT=20; this.cool=irnd(40,60);
      this.pendA={frame:13, range:30, dmg:this.dmg+3, kb:3.2}; }
    else { this.state = Math.random()<0.5 ? "punch1":"punch2"; this.atkT=14; this.cool=irnd(45, 85);
      this.pendA={frame:9, range:reach+4, dmg:this.dmg, kb:1.4}; }
  }
  clampPos(){
    this.y = clamp(this.y, GROUND_TOP+14, GROUND_BOT);
    if (!this.entered && this.x > game.camX+12 && this.x < game.camX+VW-12) this.entered = true;
    if (this.entered) this.x = clamp(this.x, game.camX+6, game.camX+VW-6);
    else this.x = clamp(this.x, 8, LEVEL_LEN-8);
  }
  scoreKO() {
    if (this.scored) return;
    this.scored = true;
    score += this.pts; SFX.ko();
    say(this.x, this.feetY-50*RK, "+"+this.pts, "#e8c15a", 50);
    if (this.kind==="burak") game.burakDown = { x:this.x, y:this.y };   // tu wyląduje talerz barszczu
    if (this.kind==="zolnierz" && Math.random()<0.14)
      weapons.push({ x:this.x, y:this.y, kind:"pistolet", dur:3 });     // porzucony pistolet, 3 naboje
    if (!this.isBoss) {
      const r = Math.random();
      if (r < 0.04) pickups.push({x:this.x, y:this.y, kind:"specjal"});            // rzadkość
      else if (r < 0.04 + DIFFS[difficulty].drop*0.85) pickups.push({x:this.x, y:this.y, kind:Math.random()<0.3?"zapiekanka":"oranzada"});
    }
  }
  takeHit(dmg, kb, heavy, launch=false) {
    game.lastHit = { e:this, t:150 };
    if (this.kind==="lysy" && !heavy && !launch && (this.state==="idle" || this.state==="walk") && this.face === -Math.sign(kb) && Math.random() < 0.5) {
      this.state = "block"; this.stunT = 10; this.kvx = kb*0.9;             // ŁYSY trzyma gardę — kop go albo chwyć
      spawnSpark(this.x - Math.sign(kb)*6*RK, this.feetY-20*RK, false); SFX.block();
      say(this.x, this.feetY-50*RK, "BLOK!", "#9aa0aa", 30); game.hitstop = Math.max(game.hitstop, 2);
      return;
    }
    if (this.state==="grabbed" && game.player && game.player.grabbing===this) game.player.releaseGrab(false);
    this.hp -= dmg;
    this.hitT = 12;
    this.face = -Math.sign(kb)||this.face;
    this.windT = undefined; this.pendA = null; this.pendB = null; this.pends = null; this.mv = null; this.mvDash = 0; this.chargeT = 0;   // przerwany zamach
    if (this.state==="grabP" && game.player && game.player.heldBy===this) { game.player.heldBy = null; game.player.state = "idle"; game.player.iv = 20; }
    spawnGibs(this.x, this.y, "#8a1f1f", heavy?9:6);
    spawnGibs(this.x, this.y, "#c94a4a", 3);
    spawnSpark(this.x - Math.sign(kb)*5, this.feetY-16*RK, heavy);
    game.hitstop = Math.max(game.hitstop, heavy?4:2);
    const dead = this.hp<=0;
    if (dead) { spawnGibs(this.x, this.y, "#8a1f1f", 10); this.scoreKO(); }
    if ((launch || (dead && heavy)) && !this.isBoss) { // wybity w powietrze
      this.state="launch"; this.vx = kb*1.1; this.vz = launch ? 2.9 : 2.1;
      this.z = Math.max(this.z, 0.1); this.bounced = false;
    } else if (dead) {
      this.state="down"; this.downT=46; this.kvx = kb*2.4;
    } else if (heavy && !this.isBoss) {
      this.state="down"; this.downT=34; this.kvx = kb*2.2;
    } else if (this.isBoss && !heavy) {
      // boss barely flinches at light hits
      if (Math.random()<0.35){ this.state="hit"; this.stunT=7; }
      this.kvx = kb*0.5;
    } else {
      this.state="hit"; this.stunT=10; this.kvx = kb*1.4;
    }
  }
}

function drawBackgroundBabie(c, camX, t) {                   // Babie Doły: morze, las, JW
  const sky = c.createLinearGradient(0, 0, 0, GROUND_TOP);
  sky.addColorStop(0, "#4a78b8"); sky.addColorStop(0.7, "#7aa0cc"); sky.addColorStop(1, "#a8c0d8");
  c.fillStyle = sky; c.fillRect(0, 0, VW, GROUND_TOP);
  for (let i=0;i<5;i++){ const q=((i*97+t*0.06)% (VW+120))-60; pxr(c, q, 22+i*13, 40+i*8, 5, "rgba(240,242,246,0.55)"); }
  pxr(c, 0, 92, VW, 32, "#2a5288");                          // morze na horyzoncie
  pxr(c, 0, 92, VW, 2, "#3a6aa0");
  for (let i=0;i<12;i++) pxr(c, (i*47+t*0.1)%VW, 98+ (i%5)*5, 9, 1, "rgba(232,228,216,0.5)");
  pxr(c, 0, 124, VW, 44, "#7e8468");                         // ląd — na nim stoją bloki
  pxr(c, 0, 124, VW, 2, "#8d9276");
  const cyc = t % 1300;                                      // przelot starego odrzutowca
  if (cyc < 260) { const jx = -60 + cyc*(VW+140)/260; drawJetSilhouette(c, jx, 40 + Math.sin(cyc*0.03)*4, 0.9);
    pxr(c, jx-26, 40, 10, 2, "rgba(180,184,190,0.35)"); }
  // plany od najdalszego: morze (wyżej) → bloki → drzewa → trawa przy ziemi
  { const off = camX*0.18, tile = 380;                       // bloki + hangar STOJĄ na lądzie
    for (let tI=-1; tI<3; tI++) {
      const bx = -((off) % tile) + tI*tile;
      drawBlok(c, bx,      162, 44, 78, tI*13+3,  "#8a8578");
      drawBlok(c, bx+58,   162, 62, 50, tI*17+11, "#928c7e");
      drawBlok(c, bx+134,  162, 40, 88, tI*7+29,  "#847f72");
      c.fillStyle = "#6e7a64"; c.beginPath(); c.moveTo(bx+196,162); c.quadraticCurveTo(bx+232,118,bx+268,162); c.closePath(); c.fill();
      pxr(c, bx+224, 142, 16, 20, "#5c6854");                // wrota hangaru
      drawBlok(c, bx+286,  162, 52, 60, tI*23+5,  "#8e887a");
    } }
  c.fillStyle = "#3d5535";                                   // pas drzew przed blokami
  { const off = camX*0.42;
    for (let i=0;i<46;i++){ const q=((i*43-off)%(VW+80))-40;
      c.beginPath(); c.moveTo(q, 166+((i*7)%8)); c.lineTo(q+13, 128-((i*11)%16)); c.lineTo(q+26, 166+((i*5)%8)); c.closePath(); c.fill(); } }
  pxr(c, 0, 158, VW, 10, "rgba(61,85,53,0.45)");
  { const off = camX*0.62;                                   // trawa — najbliższy plan tła
    pxr(c, 0, 164, VW, GROUND_TOP-164, "#5a7a44");
    pxr(c, 0, 164, VW, 2, "#6a8a50");
    for (let i=0;i<60;i++){ const q=((i*19-off)%(VW+20))-10;
      pxr(c, q, 166+((i*13)%9), 1.6, 3.5, "#4a6a38"); }
    for (let i=0;i<14;i++){ const q=((i*71-off)%(VW+20))-10;
      pxr(c, q, 168+((i*7)%6), 3, 2, "#6e8a4e"); } }
  pxr(c, 0, GROUND_TOP-3, VW, 3, "#4a5a3a");
  pxr(c, 0, GROUND_TOP, VW, VH-GROUND_TOP, "#8a8474");       // betonowe płyty + piach
  for (let i=0;i<7;i++) pxr(c, ((i*89-camX)% (VW+40))-20, GROUND_TOP+8+(i%4)*11, 26, 1.4, "#7a7466");
  pxr(c, 0, GROUND_TOP, VW, 2, "#6e685c");
}

const LV = () => LEVELS[game.lv];
const BREAK_1 = [ {x:380,y:232,kind:"karton"}, {x:1040,y:206,kind:"kosz",drop:"zapiekanka"}, {x:1480,y:240,kind:"karton"},
  {x:1860,y:236,kind:"kosz"}, {x:2060,y:212,kind:"karton",drop:"oranzada"}, {x:2520,y:240,kind:"karton"}, {x:2980,y:232,kind:"kosz",drop:"zapiekanka"} ];
const BREAK_2 = [ {x:420,y:236,kind:"beczka"}, {x:1050,y:210,kind:"beczka",drop:"oranzada"}, {x:1700,y:240,kind:"beczka"},
  {x:2240,y:214,kind:"beczka",drop:"zapiekanka"}, {x:2760,y:236,kind:"beczka"} ];
const BREAK_3 = [ {x:450,y:236,kind:"karton"}, {x:1100,y:210,kind:"kosz",drop:"zapiekanka"}, {x:1650,y:240,kind:"karton"},
  {x:2150,y:206,kind:"kosz"}, {x:2450,y:238,kind:"karton",drop:"oranzada"} ];
const BREAK_4 = [ {x:430,y:236,kind:"skrzynka",drop:"kalarepa"}, {x:1100,y:210,kind:"skrzynka"}, {x:1600,y:240,kind:"skrzynka",drop:"kalarepa"},

const BREAK_5 = [ {x:470,y:238,kind:"skrzynia"}, {x:1000,y:210,kind:"skrzynia",drop:"zapiekanka"}, {x:1560,y:240,kind:"skrzynia"},

PROPS = PROPS_1; BACKDROPS = BACKDROPS_1; SIGNS = SIGNS_1; ZONES = ZONES_1;
PICKUP_SPOTS = PICKUPS_1; WEAPON_SPOTS = WEAPONS_1;

const game = {
  state:"splash", // splash | title | intro | play | interlude | runintro | run | bossTalk | outro | gameover
  lv:0, run:null, fromRun:false, bannerT:0, bannerText:"", pendingBanner:null, talk:null, talkIdx:0, outro:null,
  player:null, enemies:[], breaks:[], lastHit:null, zone:0, camX:0, camLimit:0, heldIn:{},
  shake:0, goT:0, t:0, introT:0, bossBar:false, endT:0, hitstop:0, paused:false,
  reset(lv=0, keep=false) {
    const stash = (keep && this.player) ? { score, lives:this.player.lives, weapon:this.player.weapon } : null;
    this.lv = lv; this.run = null; this.fromRun = false; this.bannerT = 0; this.talk = null; this.talkIdx = 0; this.outro = null; this.pendingBanner = null;
    const L = LEVELS[lv];
    LEVEL_LEN = L.len; PROPS = L.props; BACKDROPS = L.backdrops; SIGNS = L.signs;
    ZONES = L.zones; PICKUP_SPOTS = L.pickups; WEAPON_SPOTS = L.weapons;
    if (AC) startMusic();   // przełącz ścieżkę pod poziom
    cars.length = 0;
    this.player = new Player();
    this.player.lives = DIFFS[difficulty].lives;
    this.enemies = []; this.zone = 0; this.camX = 0; this.camLimit = 0;
    this.shake = 0; this.goT = 0; this.t=0; this.bossBar=false; this.paused=false;
    score = 0;
    bottles.length=0; gibs.length=0; floaters.length=0; bloodPuddles.length=0; sparks.length=0; tracers.length=0; this.hitstop=0;
    pickups.length=0; pickups.push(...PICKUP_SPOTS.map(p=>({...p})));
    weapons.length=0;
    this.breaks = (L.breaks || []).map(b => ({ ...b, hp: BRK[b.kind].hp, shake:0, dead:false }));
    this.lastHit = null;
    for (const w of WEAPON_SPOTS) weapons.push({ x:w.x, y:w.y, kind:w.kind, dur:WEAPON_CFG[w.kind].dur });
    setMusicMode("street");
    if (stash) { score = stash.score; this.player.lives = stash.lives; this.player.weapon = stash.weapon; }
    if (!keep) this.scoreLogged = false;
    this.pots = false; this.potT = 0;
    if (lv === 0 && this.ch1cp) applyCh1Checkpoint();
  },
  spawnZone(z) {
    if (z.maze) { startGangScene(); return; }
    if (z.pots) { this.pots = true; this.potT = 70; say(this.camX+VW*0.7, 70, "SPOKÓJ TAM, CHULIGANY!!!", "#e8e4d8", 110); }
    for (const cc of (z.cars||[])) cars.push(new Car(cc, this.camX));
    for (const [kind, side] of (z.spawns||[])) {
      const x = side>0 ? this.camX + VW + rnd(14,40) : this.camX - rnd(14,40);
      const y = rnd(GROUND_TOP+20, GROUND_BOT-6);
      this.enemies.push(new Enemy(kind, x, y));
    }
    if (z.boss) {
      this.bossBar = true; setMusicMode("boss");
      if (z.talk) { this.talk = z.talk; this.talkIdx = 0; this.state = "bossTalk"; }
      else {
        say(this.camX+VW/2, 120, z.bossName, "#ff7b39", 140);
        say(this.camX+VW/2, 134, z.line, "#c9c4b2", 140);
      }
      for (const e of this.enemies) if (e.isBoss && !e.barName) e.barName = z.bar;
      if (z.banner && !z.bannerAfterTalk) { this.bannerText = z.banner; this.bannerT = 160; }
      if (z.banner && z.bannerAfterTalk) this.pendingBanner = z.banner;
      SFX.bossRoar();
    }
  },
  update() {
    this.t++;
    if (this.state!=="play") return;
    if (this.headline) {                                   // gazeta na cały ekran — gra stoi
      const h = this.headline; h.t++;
      if (h.t === 30) { SFX.thud(); this.shake = 4; }
      if (h.t >= h.dur || (h.t > 60 && input.anyTap)) this.headline = null;
      return;
    }
    if (this.hitstop>0) {                 // freeze frame — cios "siada"
      this.hitstop--;
      if (this.shake>0) this.shake *= 0.82;
      for (const k of ["punchHit","kickHit","jumpHit","specHit"]) if (input[k]) this.heldIn[k] = true;   // nie gub przycisków w stop-klatce
      return;
    }
    for (const k in this.heldIn) input[k] = true;
    this.heldIn = {};
    const pl = this.player;
    pollInput();
    pl.update();
    this.assignTokens(pl);
    for (const k of cars) k.update();
    for (const e of this.enemies) if (!e.dead) e.update(pl);
    this.enemies = this.enemies.filter(e=>!e.dead || e.isBoss);

    // bottles
    for (const b of bottles) {
      if (b.kind==="pthrow") {                       // rzucona broń — trafia pierwszego na drodze
        b.x += b.vx; b.z += b.vz; b.vz -= 0.05; b.spin += 0.55;
        let hitE = null;
        for (const e of this.enemies) { if (e.dead || e.state==="down"||e.state==="launch"||e.state==="thrown") continue;
          if (Math.abs(e.x-b.x) < 10*RK && Math.abs(e.y-b.y) < 12) { hitE = e; break; } }
        const drop = (x) => { if (b.wk==="tulipan" || b.wk==="strzykawka") { spawnGibs(x, b.y, "#7ec9c9", 6); SFX.bottle(); }
          else if (b.dur > 1) weapons.push({ x:clamp(x, this.camX+12, this.camX+VW-12), y:b.y, kind:b.wk, dur:b.dur-1, cd:20 }); };
        if (hitE) {
          const dm = { tulipan:18, rura:24, motyka:22, strzykawka:9999 }[b.wk] || 18;
          hitE.takeHit(hitE.isBoss && b.wk==="strzykawka" ? 24 : dm, Math.sign(b.vx)*3.2, true);
          pl.countHit(); SFX.kick(); if (b.wk==="rura") SFX.clang(); game.shake = 4; b.dead = true; drop(hitE.x);
        } else if (b.z <= 0 || b.x < this.camX-20 || b.x > this.camX+VW+20) { b.dead = true; drop(b.x); }
        continue;
      }
      if (b.kind==="woda" || b.kind==="krasnal") {   // święcona woda / krasnal ogrodowy — łukiem na gracza
        b.x += b.vx; b.y += b.vy; b.z += b.vz; b.vz -= b.g; b.spin += 0.3;
        if (b.z <= 0) {
          b.dead = true; const R = b.kind==="woda" ? 18 : 13;
          if (b.kind==="woda") { spawnGibs(b.x, b.y+10, "#9fc4e0", 10); SFX.bottle(); }
          else { spawnGibs(b.x, b.y+10, "#c94a3a", 5); spawnGibs(b.x, b.y+10, "#e8e4d8", 4); SFX.thud(); game.shake = Math.max(game.shake, 3); }
          if (Math.abs(b.x-pl.x) < R && Math.abs(b.y-pl.y) < 10 && pl.z < 8 && pl.iv<=0) pl.takeHit(b.dmg, Math.sign(pl.x-b.x||1)*(b.kind==="krasnal" ? 3 : 2.2));
        }
        continue;
      }
      if (b.kind==="fala") {                         // fala uderzeniowa Buraka — tylko skokiem
        b.x += b.vx; b.t++; if (--b.life <= 0) b.dead = true;
        if (b.t % 3 === 0) spawnDust(b.x, b.y, 1);
        if (!b.hit && Math.abs(b.x-pl.x) < 9 && Math.abs(b.y-pl.y) < 16 && pl.z < 4 && pl.iv<=0 && pl.state!=="down") {
          b.hit = true; pl.takeHit(b.dmg, Math.sign(b.vx)*3);
        }
        continue;
      }
      if (b.kind==="doniczka") {                     // spada pionowo, rozbija się wokół
        b.vz -= 0.11; b.z += b.vz;
        if (b.z <= 0) {
          b.dead = true; SFX.bottle(); SFX.thud(); game.shake = Math.max(game.shake, 3);
          spawnGibs(b.x, b.y+10, "#b8623a", 7); spawnGibs(b.x, b.y+10, "#4a3a2a", 5); spawnDust(b.x, b.y, 4);
          if (Math.abs(b.x-pl.x)<13 && Math.abs(b.y-pl.y)<9 && pl.iv<=0 && pl.z<6) pl.takeHit(Math.round(10*DIFFS[difficulty].dmg), Math.sign(pl.x-b.x||1)*1.8);
          for (const e of this.enemies) {
            if (e.dead || e.state==="down"||e.state==="launch"||e.state==="thrown") continue;
            if (Math.abs(b.x-e.x)<13 && Math.abs(b.y-e.y)<9) e.takeHit(16, Math.sign(e.x-b.x||1)*2.2, true);
          }
        }
        continue;
      }
      if (b.kind==="granat") {                       // granat: leci, leży, wybucha
        if (b.fuse < 0) {                            // w locie
          b.x += b.vx; b.z += b.vz; b.vz -= 0.04;
          if (b.z<=0) { b.z=0; b.fuse=32; spawnDust(b.x, b.y, 2); }
        } else if (--b.fuse <= 0) {                  // BUM
          b.dead = true;
          spawnSpark(b.x, b.y-8, true); spawnSpark(b.x, b.y-4, true);
          spawnGibs(b.x, b.y, "#e8c15a", 8); spawnGibs(b.x, b.y, "#5f6570", 8); spawnDust(b.x, b.y, 8);
          game.shake = 6; SFX.boom();
          if (Math.abs(b.x-pl.x)<28 && Math.abs(b.y-pl.y)<18 && pl.iv<=0) pl.takeHit(Math.round(13*DIFFS[difficulty].dmg), Math.sign(pl.x-b.x||1)*3);
          for (const e of this.enemies) {
            if (e.dead || e.state==="down"||e.state==="launch"||e.state==="thrown") continue;
            if (Math.abs(b.x-e.x)<28 && Math.abs(b.y-e.y)<18) e.takeHit(12, Math.sign(e.x-b.x||1)*2.6, true);
          }
        }
        continue;
      }
      b.x += b.vx; b.z += b.vz; b.vz -= 0.04;
      if (b.z<=0) { b.dead=true; spawnGibs(b.x, b.y, b.kind==="marchewka"?"#e8853a":"#7ec9c9", 5); SFX.bottle(); }
      if (!b.dead && Math.abs(b.x-pl.x)<8*RK && Math.abs(b.y-pl.y)<10 && b.z<26*RK && pl.z < b.z + 8 && pl.iv<=0) {
        pl.takeHit(b.dmg||8, Math.sign(b.vx)*1.5); b.dead=true;
      }
    }
    for (let i=bottles.length-1;i>=0;i--) if (bottles[i].dead) bottles.splice(i,1);
    for (const b of this.breaks) if (b.shake > 0) b.shake--;
    if (this.lastHit && --this.lastHit.t <= 0) this.lastHit = null;
    for (let i=gibs.length-1;i>=0;i--){ const g=gibs[i]; g.x+=g.vx; g.y+=g.vy; g.vy+=0.12; if(--g.life<=0) gibs.splice(i,1); }
    for (let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t++; if(f.t>f.life) floaters.splice(i,1); }
    for (let i=sparks.length-1;i>=0;i--){ if (++sparks[i].t > sparks[i].life) sparks.splice(i,1); }
    for (let i=tracers.length-1;i>=0;i--){ if (++tracers[i].t > tracers[i].life) tracers.splice(i,1); }

    // zones + camera
    const fighting = this.enemies.some(e=>!e.dead) || cars.some(k=>k.state==="drive");
    if (this.zone < ZONES.length) {
      const z = ZONES[this.zone];
      if (!fighting && pl.x > z.lock - 30) {
        this.camLimit = z.lock;
        if (pl.x >= z.lock - 20) { this.spawnZone(z); this.zone++; }
      } else if (!fighting) {
        this.camLimit = Math.max(this.camLimit, pl.x - VW*0.35);
      }
    }
    if (!fighting && this.zone>0 && this.zone<=ZONES.length) {
      // zone cleared
      if (this.goT<=0 && this.zone<ZONES.length) { this.goT=120; SFX.go(); }
      this.camLimit = Math.min(pl.x - VW*0.3 + 200, LEVEL_LEN-VW);
    }
    if (this.goT>0) this.goT--;
    // babcia z balkonu: doniczki spadają tam, gdzie stoisz (cień ostrzega)
    if (this.pots) {
      if (!this.enemies.some(e=>!e.dead)) this.pots = false;
      else if (--this.potT <= 0) {
        this.potT = Math.round(irnd(95, 150) * DIFFS[difficulty].cool);
        bottles.push({ kind:"doniczka", x: pl.x + rnd(-10, 10) + (pl.state==="walk" ? input.ax*14 : 0), y: clamp(pl.y + rnd(-4, 4), GROUND_TOP+14, GROUND_BOT),
                       z:150, vz:0, vx:0, dead:false });
        if (Math.random() < 0.3) say(pl.x + rnd(-30, 30), 60, ["A MASZ!", "PRECZ SPOD OKNA!", "DZWONIĘ NA MILICJĘ!"][irnd(0,2)], "#c9c4b2", 70);
      }
    }
    // boss pokonany w środku poziomu → wracamy do zwykłej muzyki
    if (this.bossBar && !this.enemies.some(e=>e.isBoss && !e.dead)) { this.bossBar = false; setMusicMode("street"); }

    // boss defeated?
    if (this.zone===ZONES.length && !this.enemies.some(e=>!e.dead) && !cars.some(k=>k.state==="drive")) {
      if (this.lv === 2) { this.state="runintro"; this.endT=0; }            // po lekarzu: ucieczka
      else if (this.lv === 3) { this.state="outro"; this.endT=0; this.outro=null; }   // Butapren → przejście do R5
      else if (this.lv === 4) {                                               // Burak pokonany → talerz barszczu
        this.state="ch5barszcz"; this.ch5b={phase:0,t:0};
        this.talk=[{who:"FRANKO",txt:["— Barszcz? O kurde, ciekawe..."]}]; this.talkIdx=0;
        setMusicMode("street");
      }
      else { this.state="interlude"; this.endT=0; setMusicMode("street"); }
    }

    // camera follow
    const target = clamp(pl.x - VW*0.4, 0, clamp(this.camLimit, 0, LEVEL_LEN-VW));
    this.camX = lerp(this.camX, Math.max(this.camX, target), 0.12);
    if (this.shake>0) this.shake *= 0.82;
  },
  assignTokens(pl) {                       // naraz biją tylko najbliżsi — reszta krąży i flankuje
    const bossUp = this.enemies.some(e => e.isBoss && !e.dead);
    const N = Math.max(1, DIFFS[difficulty].tok - (bossUp ? 1 : 0));
    const mel = this.enemies.filter(e => !e.dead && !e.isBoss && e.kind!=="menel" && e.kind!=="babcia" && e.entered
      && e.state!=="down" && e.state!=="launch" && e.state!=="thrown" && e.state!=="grabbed");
    const rank = e => Math.abs(e.x-pl.x) + Math.abs(e.y-pl.y)*2 - (e.tok ? 24 : 0) - ((e.windT!==undefined || e.atkT>0) ? 100 : 0);
    mel.sort((a, b) => rank(a) - rank(b));
    const slots = { "-1":0, "1":0 };
    mel.forEach((e, i) => { e.tok = i < N; if (!e.tok) { e.side = e.x < pl.x ? -1 : 1; e.slot = slots[e.side]++; } });
  },
  onPlayerKO() {
    this.player.lives--;
    if (this.player.lives<=0) { this.retryBoss = this.bossBar; this.state="gameover"; this.endT=0; }
    else {
      this.player.hp = this.player.maxhp;
      this.player.state="idle"; this.player.iv=90;
      say(this.player.x, this.player.feetY-54*RK, "WSTAWAJ!", "#e8c15a", 80);
    }
  },
};

function drawPickup(c, p, camX) {
  const x = p.x - camX, y = p.y;
  drawShadow(c, x, y, 4);
  if (p.kind==="specjal") {
    pxr(c, x-2.6, y-12, 5.2, 11, "#15130f");
    pxr(c, x-2, y-11.4, 4, 10.2, "#4a2a18");          // brązowa butelka
    pxr(c, x-1.2, y-14, 2.4, 3, "#4a2a18");
    pxr(c, x-1.2, y-14.7, 2.4, 1, "#c9a227");          // złoty kapsel
    pxr(c, x-2, y-8.6, 4, 3.6, "#8f1e1e");             // czerwona etykieta
    pxr(c, x-1.5, y-7.8, 3, 1, "#c9a227");             // złoty pas SPECJAL
    pxr(c, x-2, y-4.6, 4, 0.9, "#c9a227");
    c.fillStyle="rgba(232,193,90,0.9)";                 // stały błysk — rzadkość
    c.fillRect(x+3, y-16+((game.t>>3)%3), 2, 2);
    c.fillRect(x-6, y-10+(((game.t+8)>>3)%3), 1.6, 1.6);
    return;
  }
  if (p.kind==="kalarepa") {                            // fioletowo-zielona bulwa z natką
    c.fillStyle="#9a7ac0"; c.beginPath(); c.arc(x, y-4, 4.4, 0, 7); c.fill();
    c.fillStyle="#7e5ea8"; c.beginPath(); c.arc(x+1.4, y-3.4, 2.4, 0, 7); c.fill();
    pxr(c, x-0.6, y-11, 1.2, 5, "#4a8a3a"); pxr(c, x-2.6, y-11, 2, 2.4, "#4a8a3a"); pxr(c, x+0.8, y-11.6, 2, 2.6, "#5aa04a");
  } else if (p.kind==="wodka") {                        // przezroczysta półlitrówka
    pxr(c, x-2.4, y-12, 4.8, 11, "#15130f");
    pxr(c, x-2, y-11.4, 4, 10.2, "#c8d4dc");
    pxr(c, x-1.6, y-11, 1.2, 9.4, "#e6eef2");           // odblask
    pxr(c, x-1, y-14, 2, 3, "#c8d4dc");                 // szyjka
    pxr(c, x-1, y-14.6, 2, 1, "#c94a4a");               // czerwony kapsel
    pxr(c, x-2, y-8.6, 4, 3.4, "#f0eee8");              // biała etykieta
    pxr(c, x-1.6, y-7.6, 3.2, 1, "#3a6b9c");
    if (Math.floor(game.t/18)%2) { c.fillStyle="rgba(255,255,255,0.8)"; c.fillRect(x+3, y-15, 2, 2); }
  } else if (p.kind==="zapiekanka") {
    pxr(c, x-6, y-6, 12, 4, "#c9973a");
    pxr(c, x-5, y-7, 10, 2, "#e8d44a");
    pxr(c, x-4, y-7.5, 2, 1, "#c94a4a"); pxr(c, x+1, y-7.5, 2, 1, "#c94a4a");
  } else {
    pxr(c, x-2, y-9, 4, 8, "#3aa06a");
    pxr(c, x-1, y-11, 2, 3, "#3aa06a");
    pxr(c, x-1, y-12, 2, 1, "#c9a227");
    pxr(c, x-1.5, y-7, 1, 4, "#7ec9a0");
  }
  if (Math.floor(game.t/20)%2) { c.fillStyle="rgba(255,255,255,0.7)"; c.fillRect(x-1, y-15, 2, 2); }
}
function drawWeapon(c, w, camX) {
  const x = w.x - camX, y = w.y;
  drawShadow(c, x, y, 5);
  if (w.kind==="rura") {
    c.save(); c.translate(x, y-2); c.rotate(-0.22);
    pxr(c, -9, -1.2, 18, 2.4, "#15130f"); pxr(c, -8.4, -0.8, 16.8, 1.6, "#8a8f96");
    pxr(c, 7, -0.8, 1.4, 1.6, "#5f6570");
    c.restore();
  } else if (w.kind==="strzykawka") {
    c.save(); c.translate(x, y-2); c.rotate(-0.16);

function drawBottleProj(c, b, camX) {

    const sx = Math.round(b.x-camX), y = Math.round(b.y - b.z - 6);
    drawShadow(c, sx, b.y, 4);
    c.save(); c.translate(sx, y); c.rotate(b.spin || 0); c.scale(RK, RK);
    if (b.kind==="woda") {                                       // flaszka ze święconą wodą
      pxr(c, -2.5, -4, 5, 7, OUT); pxr(c, -2, -3.5, 4, 6, "#9fc4e0"); pxr(c, -1, -5.5, 2, 2, "#c9c4b2");
      pxr(c, -0.4, -2.6, 0.8, 3.4, "#e8e4d8"); pxr(c, -1.4, -1.6, 2.8, 0.8, "#e8e4d8");
    } else if (b.kind==="krasnal") {                             // krasnal ogrodowy
      pxr(c, -3, -1, 6, 5, OUT); pxr(c, -2.5, -0.5, 5, 4, "#2a5288");
      pxr(c, -2, -4, 4, 3.4, "#e8c9a8"); pxr(c, -2, -2.2, 4, 2, "#f0eee8");
      c.fillStyle = "#c94a3a"; c.beginPath(); c.moveTo(-2.6, -3.8); c.lineTo(0, -9); c.lineTo(2.6, -3.8); c.closePath(); c.fill();
    } else drawWeapon(c, { kind:b.wk, x:0, y:2 }, 0);

  if (b.kind==="fala") {                                        // pęknięcia + kurz

    c.fillStyle = "rgba(200,180,140,0.55)"; c.beginPath(); c.ellipse(sx, b.y-3, 10, 5, 0, 0, 7); c.fill();

    c.restore();
    return;
  }
  if (b.kind==="doniczka") {                                  // cel na ziemi + spadająca doniczka
    const sx = Math.round(b.x-camX), q = clamp(1 - b.z/150, 0, 1);
    c.fillStyle = "rgba(0,0,0," + (0.15 + q*0.3).toFixed(2) + ")";

    if (Math.floor(game.t/5)%2) { c.strokeStyle = "rgba(201,74,74,0.7)"; c.lineWidth = 1;
      c.beginPath(); c.ellipse(sx, b.y+1, 13, 4.2, 0, 0, 7); c.stroke(); }
    const y = Math.round(b.y - b.z - 10);
    pxr(c, sx-4, y-6, 8, 7, "#15130f"); pxr(c, sx-3.4, y-5.4, 6.8, 5.8, "#b8623a"); pxr(c, sx-4.4, y-7, 8.8, 2, "#9a4a30");
    pxr(c, sx-2, y-11, 1.6, 5, "#3d6b30"); pxr(c, sx+0.6, y-12, 1.6, 6, "#4a8a3a"); pxr(c, sx-0.8, y-13, 2.4, 2.4, "#c94a3a");
    return;
  }
  if (b.kind==="strzyk") {                                    // strzykawka lekarza
    const x = Math.round(b.x-camX), y = Math.round(b.y-b.z);

    pxr(c, -5.4, -0.6, 1.6, 1.2, "#7ec9c9");

  if (b.kind==="granat") {
    const x = Math.round(b.x-camX), y = Math.round(b.y-b.z);
    if (b.fuse>=0 && Math.floor(b.fuse/4)%2) { pxr(c, x-3, y-7, 6, 6, "#c94a3a"); }   // mruga przed hukiem
    pxr(c, x-2.5, y-6, 5, 5.4, "#3a4229"); pxr(c, x-2.5, y-6, 5, 1.4, "#4a5438");
    pxr(c, x-0.8, y-7.6, 1.6, 1.8, "#5f6570");
    drawShadow(c, b.x-camX, b.y, 3);
    return;
  }
  const x = b.x - camX, y = b.y - b.z;
  drawShadow(c, b.x-camX, b.y, 3);
  c.save(); c.translate(x, y); c.rotate(game.t*(b.kind==="marchewka"?0.28:0.4)*Math.sign(b.vx));
  if (b.kind==="marchewka") {
    pxr(c, -4, -1.4, 3.4, 2.8, "#e8853a"); pxr(c, -0.6, -1, 2.6, 2, "#d9762e"); pxr(c, 2, -0.6, 2.2, 1.2, "#c9622e");

  } else {
    pxr(c, -4, -1.5, 8, 3, "#5aa08a"); pxr(c, 2, -1, 3, 2, "#7ec9c9");
  }
  c.restore();
}

function pixText(c, txt, x, y, size, col, align="center", shadow=true, raw=false) {
  if (!raw) txt = tr(txt);                                   // imiona graczy zostają jak wpisane
  c.font = "bold " + size + "px monospace";
  c.textAlign = align;
  if (shadow) { c.fillStyle = "#0d0c0a"; c.fillText(txt, x+Math.max(1,size*0.08), y+Math.max(1,size*0.08)); }
  c.fillStyle = col; c.fillText(txt, x, y);
}

const ENEMY_NAMES = { dres:"DRES", dres2:"CHUDY", lysy:"ŁYSY", kijek:"KIJEK", menel:"MENEL", pijany:"PIJAK",

function hudBar(c, x, y, w, h, frac, ghost, col, col2) {
  pxr(c, x-1, y-1, w+2, h+2, "#0d0c0a");
  pxr(c, x, y, w, h, "#2a2c31");
  if (ghost > frac) pxr(c, x, y, w*clamp(ghost,0,1), h, "#e8e4d8");
  pxr(c, x, y, w*clamp(frac,0,1), h, col);
  pxr(c, x, y, w*clamp(frac,0,1), Math.max(1, h*0.35), col2);
  for (let i = 1; i < 10; i++) pxr(c, x + w*i/10, y, 0.6, h, "rgba(13,12,10,0.45)");
}
function drawHUD(c) {
  const pl = game.player;

  const hurt = pl.hitT > 0 || pl.state === "down";
  drawDude(c, 20, 95, 1, { legs:"stand", armF:"sway", armB:"sway", swing:-1, hurt }, PAL.szymek, 2/CHAR_K, game.t);
  c.restore();
  if (pl.hp < pl.maxhp*0.3 && Math.floor(game.t/10)%2) pxr(c, 8, 7, 26, 26, "rgba(201,74,74,0.25)");
  pixText(c, "FRANKO", 38, 14, 7, "#e8e4d8", "left");

  for (let i = 0; i < Math.min(pl.lives, 8); i++) { pxr(c, 38+i*8, 26, 6, 6, "#d9a066"); pxr(c, 38+i*8, 26, 6, 2, "#4a3020"); pxr(c, 39.4+i*8, 28.4, 1, 1, OUT); pxr(c, 42+i*8, 28.4, 1, 1, OUT); }
  if (pl.lives > 8) pixText(c, "+" + (pl.lives-8), 104, 32, 6, "#d9a066", "left");
  // broń
  if (pl.weapon) {
    pxr(c, 6, 37, 92, 11, "rgba(13,12,10,0.78)");
    pixText(c, WEAPON_CFG[pl.weapon.kind].label, 10, 45, 6, "#e8c15a", "left");

  if (boss) {
    pxr(c, VW/2-100, VH-26, 200, 20, "rgba(13,12,10,0.82)");
    pxr(c, VW/2-100, VH-26, 200, 1, "#ff7b39");
    pixText(c, boss.barName || "BOSS", VW/2, VH-17, 7, "#ff7b39");
    boss.hpG = (boss.hpG === undefined || boss.hpG < boss.hp) ? boss.hp : boss.hpG - 0.6;
    hudBar(c, VW/2-92, VH-13, 184, 4, boss.hp/boss.maxhp, boss.hpG/boss.maxhp, boss.phase2 ? "#ff4a3a" : "#ff7b39", "#ffb080");
  }
  // IDŹ
  if (game.goT>0 && game.state === "play" && Math.floor(game.t/10)%2) pixText(c, "IDŹ ▶▶", VW-46, 60, 12, "#e8c15a");
  // wielki tytuł
  if (game.bannerT > 0) {
    const a = game.bannerT > 125 ? (160-game.bannerT)/35 : Math.min(1, game.bannerT/45);
    c.globalAlpha = clamp(a, 0, 1);
    pixText(c, game.bannerText, VW/2+1, 94, 15, "#15130f");
    pixText(c, game.bannerText, VW/2, 92, 15, "#e8c15a");
    c.globalAlpha = 1;
    game.bannerT--;
  }
  if (pl.state === "held" && Math.floor(game.t/6)%2) pixText(c, "SZARP SIĘ! ◀ ▶ Z X", pl.x - game.camX, pl.feetY - 74*RK, 9, "#ff7b39");

  }
}

function drawTouchUI(c) {

  const sx = touch.active ? touch.sx : 62, sy = touch.active ? touch.sy : VH-52;
  c.strokeStyle="#c9c4b2"; c.lineWidth=1.5;
  c.beginPath(); c.arc(sx, sy, 20, 0, 7); c.stroke();
  c.fillStyle="#c9c4b2";
  c.beginPath(); c.arc(sx+(touch.active?touch.dx:0), sy+(touch.active?touch.dy:0), 8, 0, 7); c.fill();
  // buttons
  const B = btnRects();
  c.fillStyle = touch.btnA.down ? "#e8c15a" : "#7d5a3a";
  c.beginPath(); c.arc(B.A.x, B.A.y, B.A.r, 0, 7); c.fill();
  c.fillStyle = touch.btnB.down ? "#e8c15a" : "#5a6a7d";

    c.beginPath(); c.arc(B.D.x, B.D.y, B.D.r, 0, 7); c.fill(); }
  c.globalAlpha = 0.9;
  pixText(c, "PIĘŚĆ", B.A.x, B.A.y+3, 8, "#17191d", "center", false);

  c.restore();
}

// ---------- podłoże: chodnik, krawężnik, studzienki, kałuże — zakotwiczone w świecie ----------
function drawFloor(c, camX, kind) {
  const each = (step, fn) => { for (let k = Math.floor((camX-80)/step); k*step < camX+VW+80; k++) fn(k, k*step - camX); };
  if (kind === "street" || kind === "streetDay") {
    const night = kind === "street";
    const y0 = GROUND_TOP+6, y1 = GROUND_TOP+28;
    pxr(c, 0, y0, VW, y1-y0, night ? "#55585e" : "#9a968a");                       // płyty chodnikowe
    pxr(c, 0, y0+7, VW, 0.8, night ? "#46494e" : "#858175"); pxr(c, 0, y0+15, VW, 0.8, night ? "#46494e" : "#858175");
    each(18, (k, x) => { const o = (k%2)*9; pxr(c, x+o, y0, 0.8, 7, night ? "#46494e" : "#858175");
      pxr(c, x+o+4, y0+7.8, 0.8, 7.2, night ? "#46494e" : "#858175"); pxr(c, x+o+2, y0+15.8, 0.8, 6.2, night ? "#46494e" : "#858175");
      if (hash(k*3.3) > 0.82) pxr(c, x+o+3, y0+2, 6, 1, night ? "#4a4d52" : "#8f8b80"); });                // ukruszona płyta
    pxr(c, 0, y1, VW, 2, night ? "#8a8d94" : "#c9c5ba");                             // krawężnik
    pxr(c, 0, y1+2, VW, 2, night ? "#2e3034" : "#5a5850");
    each(150, (k, x) => {                                                              // pęknięcia asfaltu
      if (hash(k*7.1) < 0.5) return;
      c.strokeStyle = night ? "rgba(0,0,0,0.35)" : "rgba(0,0,0,0.22)"; c.lineWidth = 0.8;
      const yy = y1 + 12 + hash(k*2.7)*40;
      c.beginPath(); c.moveTo(x, yy); c.lineTo(x+7, yy+3); c.lineTo(x+12, yy+1); c.lineTo(x+20, yy+5); c.stroke();
    });
    each(520, (k, x) => {                                                              // studzienka
      const yy = y1 + 30 + hash(k*1.9)*14, xx = x + hash(k*4.4)*200;
      c.fillStyle = night ? "#2a2c30" : "#5a5850"; c.beginPath(); c.ellipse(xx, yy, 9, 3.4, 0, 0, 7); c.fill();
      c.strokeStyle = night ? "#45484e" : "#7a776e"; c.lineWidth = 0.8; c.stroke();
      for (let i=-1;i<=1;i++) pxr(c, xx-6, yy+i*1.4-0.3, 12, 0.6, night ? "#3a3d42" : "#6e6b62");
    });
    each(380, (k, x) => {                                                              // kałuże
      if (hash(k*5.3) < 0.45) return;
      const yy = y1 + 18 + hash(k*8.1)*44, xx = x + hash(k*2.2)*160, w = 12 + hash(k*3.9)*14;
      c.fillStyle = night ? "rgba(40,48,66,0.85)" : "rgba(120,140,160,0.55)"; c.beginPath(); c.ellipse(xx, yy, w, 3 + w*0.12, 0, 0, 7); c.fill();
      c.fillStyle = night ? "rgba(232,193,90,0.22)" : "rgba(240,244,248,0.55)"; c.beginPath(); c.ellipse(xx-w*0.3, yy-0.8, w*0.35, 0.9, 0, 0, 7); c.fill();
    });
  } else if (kind === "bridge") {
    each(210, (k, x) => { if (hash(k*6.6) < 0.4) return;                                 // plamy oleju
      c.fillStyle = "rgba(10,10,14,0.35)"; c.beginPath(); c.ellipse(x + hash(k)*120, GROUND_TOP+30+hash(k*2.3)*50, 10+hash(k*9)*8, 3, 0, 0, 7); c.fill(); });
    each(40, (k, x) => pxr(c, x, GROUND_TOP+33, 2.4, 1.2, "#c9a227"));                     // odblaski na pasie
  } else if (kind === "dirt") {
    each(34, (k, x) => { const yy = GROUND_TOP+12 + hash(k*3.1)*60;
      pxr(c, x + hash(k*1.7)*20, yy, 2.4, 1.6, "#9a8a6e"); pxr(c, x + hash(k*1.7)*20, yy+1.2, 2.4, 0.6, "#5a4a36"); });
    each(300, (k, x) => { if (hash(k*4.7) < 0.5) return;
      const yy = GROUND_TOP+30 + hash(k*2.9)*40, xx = x + hash(k*7.3)*150;
      c.fillStyle = "rgba(70,56,40,0.7)"; c.beginPath(); c.ellipse(xx, yy, 14, 3.6, 0, 0, 7); c.fill();
      c.fillStyle = "rgba(200,220,240,0.35)"; c.beginPath(); c.ellipse(xx-4, yy-0.8, 5, 0.9, 0, 0, 7); c.fill(); });
  } else if (kind === "slabs") {
    for (let r = 0; r < 4; r++) pxr(c, 0, GROUND_TOP+14+r*18, VW, 1, "#6e685c");            // płyty jumbo
    each(48, (k, x) => { for (let r = 0; r < 5; r++) pxr(c, x + (r%2)*24, GROUND_TOP+r*18-4, 1, 18, "#6e685c");
      if (hash(k*3.3) > 0.6) { pxr(c, x+8, GROUND_TOP+15+hash(k)*50, 1.4, 3, "#5a7a44"); pxr(c, x+10, GROUND_TOP+16+hash(k)*50, 1.2, 2.4, "#6e8a4e"); } });
  }
}
function drawNightLight(c, camX) {                 // noc: przyciemnienie + plamy światła latarni (świecą też na postacie)
  c.fillStyle = "rgba(14,18,40,0.22)"; c.fillRect(0, 0, VW, VH);
  c.save(); c.globalCompositeOperation = "lighter";
  for (const p of PROPS) {
    if (!p.lamp) continue;
    const lx = p.x - camX + p.lamp.dx*RK;
    if (lx < -120 || lx > VW+120) continue;
    const top = p.base - p.lamp.top*RK, gy = p.base + 18;
    const g2 = c.createLinearGradient(0, top, 0, gy);
    g2.addColorStop(0, "rgba(255,210,130,0.13)"); g2.addColorStop(1, "rgba(255,210,130,0.03)");
    c.fillStyle = g2; c.beginPath(); c.moveTo(lx-3, top); c.lineTo(lx+3, top); c.lineTo(lx+58, gy); c.lineTo(lx-58, gy); c.closePath(); c.fill();
    const g = c.createRadialGradient(lx, gy, 3, lx, gy, 84);
    g.addColorStop(0, "rgba(255,196,110,0.22)"); g.addColorStop(1, "rgba(255,196,110,0)");
    c.fillStyle = g; c.save(); c.translate(lx, gy); c.scale(1, 0.4); c.beginPath(); c.arc(0, 0, 84, 0, 7); c.fill(); c.restore();

function fitText(c, txt, x, y, maxW, size, col) {          // tłumaczy i zmniejsza czcionkę, żeby się zmieścił
  txt = tr(txt); let sz = size;
  c.font = "bold " + sz + "px monospace";
  while (c.measureText(txt).width > maxW && sz > 8) { sz--; c.font = "bold " + sz + "px monospace"; }
  c.textAlign = "center"; c.fillStyle = col; c.fillText(txt, x, y);
}
function drawHeadline(c, h) {
  const t = h.t, IN = 34, OUT0 = h.dur - 22;

  if (t < IN) { const e = 1 - Math.pow(1 - t/IN, 3); sc = lerp(0.04, 1, e); rot = -0.035 + (1 - e)*Math.PI*5; }
  else if (t > OUT0) { const q = (t - OUT0)/22; sc = 1 + q*0.5; a = 1 - q; }
  c.fillStyle = "rgba(8,8,10," + (0.55*Math.min(1, t/12)*a).toFixed(2) + ")"; c.fillRect(0, 0, VW, VH);
  c.save(); c.globalAlpha = a; c.translate(VW/2, VH/2); c.rotate(rot); c.scale(sc, sc);
  const W = 440, H = 234, x0 = -W/2, y0 = -H/2;
  c.fillStyle = "rgba(0,0,0,0.45)"; c.fillRect(x0 + 6, y0 + 7, W, H);
  c.fillStyle = "#efe8d4"; c.fillRect(x0, y0, W, H);
  c.fillStyle = "rgba(120,100,60,0.08)"; for (let i = 0; i < 30; i++) c.fillRect(x0 + hash(i*3.1)*W, y0 + hash(i*7.7)*H, 2, 2);   // plamki starego papieru
  // winieta

function drawPlay(c) {
  const shx = game.shake>0.4 ? rnd(-game.shake, game.shake) : 0;
  const shy = game.shake>0.4 ? rnd(-game.shake, game.shake)*0.5 : 0;
  c.save(); c.translate(Math.round(shx), Math.round(shy));
  LV().bg(c, game.camX, game.t);
  if (LV().floor) drawFloor(c, game.camX, LV().floor);
  for (const b of BACKDROPS)
    if (b.x - game.camX > -(b.w*RK+40) && b.x - game.camX < VW+40) {
      c.save(); c.textAlign = "left"; c.textBaseline = "alphabetic"; c.translate(Math.round(b.x-game.camX), b.y); c.scale(RK, RK); b.draw(c, 0, 0); c.restore();
    }
  drawStreetSign(c, game.camX);

  for (const p of bloodPuddles) {
    const sx = p.x - game.camX;
    if (sx < -30 || sx > VW+30) continue;
    c.fillStyle = p.col;
    for (const bl of p.blobs) { c.beginPath(); c.ellipse(sx+bl.dx, p.y+bl.dy, bl.rx, bl.ry, 0, 0, 7); c.fill(); }
  }

  // depth-sorted world
  const items = [];
  for (const p of PROPS) if (p.x-game.camX > -180 && p.x-game.camX < VW+60)
    items.push({ y:p.base, draw:()=>{ c.save(); c.textAlign = "left"; c.textBaseline = "alphabetic";
      c.translate(Math.round(p.x-game.camX), p.base); c.scale(RK, RK); p.draw(c, 0, 0); c.restore(); } });
  const scaled = (x, y, fn) => { c.save(); c.textAlign = "left"; c.translate(Math.round(x), Math.round(y)); c.scale(RK, RK); fn(); c.restore(); };
  for (const p of pickups) if (p.x-game.camX>-30 && p.x-game.camX<VW+30)
    items.push({ y:p.y, draw:()=>scaled(p.x-game.camX, p.y, ()=>drawPickup(c, {kind:p.kind, x:0, y:0}, 0)) });
  for (const w of weapons) if (w.x-game.camX>-30 && w.x-game.camX<VW+30)
    items.push({ y:w.y, draw:()=>scaled(w.x-game.camX, w.y, ()=>drawWeapon(c, {kind:w.kind, x:0, y:0}, 0)) });
  for (const b of game.breaks) if (!b.dead && b.x-game.camX>-30 && b.x-game.camX<VW+30)
    items.push({ y:b.y, draw:()=>scaled(b.x-game.camX, b.y, ()=>drawBreak(c, b)) });
  for (const k of cars) if (k.x-game.camX>-90 && k.x-game.camX<VW+90) items.push({ y:k.y, draw:()=>k.draw(c, game.camX) });
  for (const e of game.enemies) if (!e.dead) items.push({ y:e.y, draw:()=>e.draw(c, game.camX) });
  items.push({ y:game.player.y, draw:()=>game.player.draw(c, game.camX) });
  for (const b of bottles) items.push({ y:b.y, draw:()=>drawBottleProj(c,b,game.camX) });
  items.sort((a,b)=>a.y-b.y);
  for (const it of items) it.draw();

  // gibs + floaters
  for (const g of gibs) { c.fillStyle=g.col; const s=g.sz||2; c.fillRect(Math.round(g.x-game.camX-s/2), Math.round(g.y), s, s); }
  for (const f of floaters) {
    const a = 1 - f.t/f.life;
    c.globalAlpha = Math.min(1, a*2);
    pixText(c, f.txt, Math.round(f.x-game.camX), Math.round(f.y - f.t*0.25), 8, f.col);
    c.globalAlpha = 1;
  }
  if (LV().fg) LV().fg(c, game.camX);
  if (LV().night) drawNightLight(c, game.camX);
  for (const tr of tracers) drawTracer(c, tr, game.camX);
  for (const s of sparks) drawSpark(c, s, game.camX);
  c.restore();
  drawHUD(c);
  drawTouchUI(c);
  if (game.headline) drawHeadline(c, game.headline);
}

const RUN_SLOPE = 0.24;
const RUN_SEGS = (() => {
  const defs = [["stairs",600],["flat",900],["stairs",500],["flat",1000],["stairs",600],["flat",1100],["stairs",500],["flat",700]];
  let x = 0, e = 0; const out = [];
  for (const [type, len] of defs) { out.push({ type, x0:x, len, e0:e }); if (type==="stairs") e += len*RUN_SLOPE; x += len; }
  out.total = x; return out;
})();
const RUN_LEN = RUN_SEGS.total;
function runSegAt(x) { x = clamp(x, 0, RUN_LEN-1); for (const sg of RUN_SEGS) if (x < sg.x0 + sg.len) return sg; return RUN_SEGS[RUN_SEGS.length-1]; }
function runElev(x) { const sg = runSegAt(x); return sg.type==="stairs" ? sg.e0 + (clamp(x, 0, RUN_LEN) - sg.x0)*RUN_SLOPE : sg.e0; }
function runGY(wx, r) { return 214 + (runElev(r.x) - runElev(wx)); }
const CHASE_LEN = 3600;
function chaseLaneY(y01) { return 202 + y01*46; }

  }
  const W2S = (wx) => 320 - (wx - R.x);
  // znajdźki
  for (const it of R.items) {
    if (it.got) continue; const sx = W2S(it.x); if (sx < -20 || sx > VW+20) continue;
    const gy = chaseLaneY(it.y01), bob = Math.sin((t + it.x)*0.12)*1.2;
    if (it.kind === "lody") { pxr(c, sx-3, gy-12+bob, 6, 8, "#f2e6c8"); pxr(c, sx-3, gy-12+bob, 6, 3, "#8a5a3a"); pxr(c, sx-1, gy-5+bob, 2, 4, "#d8c8a0"); }
    else drawBottleItem(c, sx, gy + bob);
  }
  // głębia: przeszkody, granaty i gracz sortowane po pasie
  const items = [];
  for (const o of R.obs) { const sx = W2S(o.x); if (sx < -60 || sx > VW+60) continue;
    const yy = o.kind === "parawan" || o.kind === "siatka" || o.kind === "pien" ? chaseLaneY(o.y1) : chaseLaneY((o.y0 + o.y1)/2);
    items.push({ y: yy, f: () => drawBeachObs(c, o, sx, yy) }); }
  for (const g of R.proj) {
    if (g.kind === "boom") continue;
    const gy = chaseLaneY(g.y01), sx = W2S(g.x);
    items.push({ y: gy, f: () => {
      if (g.air > 0) { const p = 1 - g.air/44, ax = lerp(VW + 30, sx, p), ay = lerp(56, gy, p) - Math.sin(p*Math.PI)*46;

      else if (g.fuse > 0) { if (Math.floor(g.fuse/4)%2) pxr(c, sx-3, gy-7, 6, 6, "#c94a3a"); pxr(c, sx-2.5, gy-6, 5, 5.4, "#3a4229"); drawShadow(c, sx, gy, 3);
        c.strokeStyle = "rgba(201,74,74,0.7)"; c.beginPath(); c.ellipse(sx, gy, 24, 7, 0, 0, 7); c.stroke(); }
      else if (g.boom < 16) { const p = g.boom/16; c.fillStyle = p<0.4 ? "#ffffff" : (p<0.7 ? "#e8c15a" : "rgba(95,101,112,0.5)");
        c.beginPath(); c.arc(sx, gy-6, 4+p*20, 0, 7); c.fill(); } } });
  }
  const py = chaseLaneY(R.y01);
  items.push({ y: py + 0.01, f: () => {
    drawShadow(c, 320, py, 7*clamp(1 - R.z/60, 0.55, 1));
    drawRunner(c, 320, py, R, -1, PAL.szymek);
    if (R.splash > 0) for (let i = 0; i < 3; i++) pxr(c, 318 + rnd(-6, 6), py - 2 - rnd(0, 6), 2, 2, "#cfe0f0");
    else if (R.z === 0 && t % 5 === 0) pxr(c, 324 + rnd(0,6), py-2, 2, 2, "rgba(205,185,138,0.8)"); } });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();
  for (const g of R.proj) if (g.kind === "boom") { const sx = W2S(g.x), gy = chaseLaneY(g.y01), p = g.t/20;
    c.fillStyle = p < 0.5 ? "#ffffff" : "#e8c15a"; c.beginPath(); c.arc(sx, gy-6, 4 + p*18, 0, 7); c.fill(); }
  // pogoń: żołnierze przy prawej krawędzi — bliżej, gdy dystans maleje
  const front = 330 + 30 + R.gap*0.9;
  for (let i = 0; i < 5; i++) {
    const sy = 206 + (i*17)%44, sxs = front + i*20 + Math.sin((t + i*30)*0.1)*4;
    if (sxs > VW + 30) continue;
    const throwing = R.proj.length && R.proj[R.proj.length-1].air > 30 && i === 1, ph = ((R.walkT + i*9)/14) % 1;
    const pose = R.done ? { legs:"stance", armF:"flail", armB:"flail", lean:-0.8, jx: (t + i*5)%6 < 3 ? 0.6 : -0.6 }   // wygrażają
               : throwing ? { legs:"stand", armF:"throw", armB:"down", lean:-1 }
                          : runPose(ph);
    drawShadow(c, sxs, sy, 6.5); drawDude(c, sxs, sy, -1, pose, PAL.zolnierz, false, t + i*13);
  }
  // meta: RYBAKÓW + wyciąg
  { const sx = W2S(CHASE_LEN+60);
    if (sx > -140) {
      c.fillStyle = "#d9c08a"; c.beginPath(); c.moveTo(sx-30, 156); c.lineTo(sx-90, 60); c.lineTo(sx-260, 40); c.lineTo(sx-260, 156); c.closePath(); c.fill();

      pxr(c, sx-44, 236, 34, 5, "#6e5537"); pxr(c, sx-2, 196, 3, 54, "#8f8a80");
      pxr(c, sx-14, 182, 56, 18, "#15130f"); pxr(c, sx-12.5, 183.5, 53, 15, "#2e5a3a"); pixText(c, "RYBAKÓW", sx+14, 193, 8, "#e8e4d8");
    } }
  for (const g of gibs) pxr(c, g.x, g.y, g.sz, g.sz, g.col);
  c.restore();
  drawRunnerHUD(c, R, "W NOGI!", "BABIE DOŁY", "RYBAKÓW", R.x/CHASE_LEN, "DYSTANS DO WOJSKA");
  if (t < 240 && R.tries === 0 && !R.done) {

function tickFX() {
  for (let i=gibs.length-1;i>=0;i--){ const g=gibs[i]; g.x+=g.vx; g.y+=g.vy; g.vy+=0.12; if(--g.life<=0) gibs.splice(i,1); }
  for (let i=sparks.length-1;i>=0;i--){ if (++sparks[i].t > sparks[i].life) sparks.splice(i,1); }
  for (let i=tracers.length-1;i>=0;i--){ if (++tracers[i].t > tracers[i].life) tracers.splice(i,1); }
  for (let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t++; if(f.t>f.life) floaters.splice(i,1); }
}

const MZ_R = MZ_MAP.length, MZ_C = MZ_MAP[0].length;

  { name:"MAŁY",  pal:"dres",  corner:[MZ_C+1, -3],    home:[15, 10], rel:0,   col:"#4a7ac9" },
  { name:"CHUDY", pal:"dres2", corner:[-2, -3],        home:[14, 12], rel:110, col:"#7ec96a" },
  { name:"KIJEK", pal:"kijek", corner:[MZ_C+1, MZ_R+2], home:[15, 12], rel:420, col:"#c94a4a" },

function mzCh(c, r) {

// regiony budynków (raz): spójne grupy tej samej litery; klatki należą do bloku, furtka i środek do placu
const MZ_REG = (() => {
  const grp = (ch) => ch === "k" ? "B" : (ch === "h" || ch === "-") ? "Z" : ch;
  const seen = new Set(), out = [];
  for (let r=0; r<MZ_R; r++) for (let c=0; c<MZ_C; c++) {
    const ch = MZ_MAP[r][c];
    if (".o ".includes(ch) || seen.has(c+","+r)) continue;
    const g = grp(ch), q = [[c, r]]; seen.add(c+","+r);
    let c0=c, c1=c, r0=r, r1=r; const klatki = [];
    while (q.length) {
      const [qc, qr] = q.pop();
      c0=Math.min(c0,qc); c1=Math.max(c1,qc); r0=Math.min(r0,qr); r1=Math.max(r1,qr);
      if (MZ_MAP[qr][qc] === "k") klatki.push([qc, qr]);
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nc=qc+dx, nr=qr+dy;

        const nch = MZ_MAP[nr][nc];
        if (".o ".includes(nch) || grp(nch) !== g) continue;
        seen.add(nc+","+nr); q.push([nc, nr]);

    out.push({ g, c0, c1, r0, r1, klatki, id: out.length });
  }
  return out;

function mzNewEnt(c, r) { return { c, r, dir:null, p:0, want:null, face:1, walkT:0 }; }
function mzPos(e) {

  return { x: MZ_X0 + (e.c+0.5)*MZ_T + d[0]*e.p, y: MZ_Y0 + (e.r+0.5)*MZ_T + d[1]*e.p };
}
function mzHomePx(g) { return { x: MZ_X0 + (g.home[0]+0.5)*MZ_T, y: MZ_Y0 + (g.home[1]+0.5)*MZ_T }; }

function startMaze(solo=false) {

    exitOpen:false, mode:"scatter", modeI:0, modeT:0, frT:0, frChain:0, bonus:null, bonusN:0,
    score0: score, lives0: pl.lives, msg:null, msgT:0, D };

function mzResetActors() {
  const m = game.maze;
  m.pl = mzNewEnt(MZ_START[0], MZ_START[1]); m.pl.want = "L"; m.pl.face = -1;
  m.gang = MZ_GANG.map((g, i) => {
    const e = mzNewEnt(g.home[0], g.home[1]);
    e.g = g; e.i = i; e.fr = false; e.downT = 0;

    else { e.st = "house"; const hp = mzHomePx(g); e.hx = hp.x; e.hy = hp.y; e.relT = g.rel; }
    return e;

  m.frT = 0;
}
function mzTarget(e) {
  const m = game.maze, p = m.pl, g = e.g;
  if (m.mode === "scatter") return g.corner;
  const pd = MZ_DIR[p.dir || p.want || "L"];
  if (e.i === 0) return [p.c, p.r];
  if (e.i === 1) return [p.c + pd[0]*4, p.r + pd[1]*4];
  if (e.i === 2) { const b = m.gang[0], ax = p.c + pd[0]*2, ay = p.r + pd[1]*2; return [ax*2 - b.c, ay*2 - b.r]; }
  const dd = Math.hypot(p.c - e.c, p.r - e.r);
  return dd > 8 ? [p.c, p.r] : g.corner;
}
function mzGhostDecide(e) {
  const opts = MZ_ORDER.filter(d => d !== MZ_OPP[e.dir] && mzOpen(e.c + MZ_DIR[d][0], e.r + MZ_DIR[d][1], "ghost"));

}
function mzPlayerDecide(e) {
  const ok = (d) => d && mzOpen(e.c + MZ_DIR[d][0], e.r + MZ_DIR[d][1], "player");

function mzAdvance(e, spd, decide, onTile) {

  e.p += spd;

function mzWrap(e) { if (e.r === MZ_WRAP_R) { if (e.c < 0) e.c = MZ_C-1; else if (e.c >= MZ_C) e.c = 0; } }

function mzSay(txt, col="#e8c15a", t=80) { const m = game.maze; m.msg = txt; m.msgCol = col; m.msgT = t; }

function updateMaze() {

    const p = m.pl; p.walkT++; p.hx = (p.hx===undefined ? mzPos(p).x : p.hx) - 1.4; p.hy = MZ_Y0 + (MZ_R-0.5)*MZ_T; p.face = -1;

    const h = ax > 0.35 ? "R" : ax < -0.35 ? "L" : null, v = ay > 0.35 ? "D" : ay < -0.35 ? "U" : null;
    if (h && v) p.want = (p.dir === h || p.dir === MZ_OPP[h]) ? v : h;   // ukos = skręt przy najbliższej okazji
    else p.want = h || v;
  }
  if (p.dir && p.want === MZ_OPP[p.dir] && p.p > 0) mzReverse(p);   // zawracanie w miejscu
  const before = p.dir;
  mzAdvance(p, m.frT > 0 ? MZ_PSPD*1.08 : MZ_PSPD, mzPlayerDecide, mzEat);

function mzEat(e) {

    for (const g of m.gang) if (g.st === "active") mzReverse(g);            // w panice zawracają

function startGangScene() {
  const g = game, pl = g.player;
  g.state = "gang"; g.gang = { phase:0, t:0, crew:[] };
  ["dres","dres2","kijek","lysy","dres","dres2"].forEach((k, i) => {
    const side = i%2 ? -1 : 1, slot = Math.floor(i/2);
    const e = new Enemy(k, g.camX + (side>0 ? VW+24+slot*16 : -24-slot*16), clamp(pl.y - 22 + slot*22, GROUND_TOP+16, GROUND_BOT-2));
    e.face = -side; e.cool = 99999; e.entered = true;
    e.tx = side>0 ? pl.x + 46 + slot*20 : pl.x - 46 - slot*20;
    g.gang.crew.push(e); g.enemies.push(e);
  });
  pl.state = "idle"; pl.atkT = 0; pl.pend = null; pl.running = false; if (pl.grabbing) pl.releaseGrab();
  g.goT = 0; g.pots = false;
  setMusicMode("boss");
}
function updateGang() {
  const s = game.gang, pl = game.player; s.t++; tickFX();
  if (s.phase === 0) {
    let done = true;
    for (const e of s.crew) {
      if (Math.abs(e.x - e.tx) > 2) { e.x += Math.sign(e.tx - e.x)*1.3; e.state = "walk"; e.walkT++; done = false; }
      else { e.state = "idle"; e.face = pl.x > e.x ? 1 : -1; }
      e.t++;
    }
    pl.t++; pl.face = s.t % 90 < 45 ? 1 : -1;               // rozgląda się
    if (done || s.t > 220) {
      s.phase = 1; game.talkIdx = 0;
      game.talk = [
        { who:"MAŁY", txt:["— Ej, to ten od butelek!", "Kwadrat kazał cię przyprowadzić."] },
        { who:"FRANKO", txt:["— Sześciu na jednego...", "Dobra. Spadam w Pagiety!"] },
      ];
    }
  } else if (s.phase === 1) {
    if (input.anyTap) { game.talkIdx++; if (game.talkIdx >= game.talk.length) { game.talk = null; s.phase = 2; s.t = 0; } }
  } else {                                                  // Franko daje nura między bloki
    pl.state = "walk"; pl.walkT++; pl.y -= 0.9; pl.x += 0.4; pl.face = 1;
    for (const e of s.crew) { e.state = "walk"; e.walkT++; e.x += Math.sign(pl.x - e.x)*1.2; e.y += Math.sign(pl.y - e.y)*0.5; }
    if (s.t > 45) { game.enemies = []; game.gang = null; game.talk = null; startMaze(false); }
  }
}

const HS_KEY = "obluze_hiscores", HS_MAX = 10, HS_NAME_MAX = 8;
const HS_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZĄĆĘŁŃÓŚŹŻ0123456789 -!";
const HS_SEED = [["ISKRA",30000,"1991-08-31"],["PROBOSZCZ",24000,"1991-08-15"],["RYBAK",19000,"1991-07-27"],["DOKTOR",15000,"1991-07-12"],
  ["SĄSIAD",12000,"1991-06-29"],["BURAK",9000,"1991-06-14"],["MAŁY",6000,"1991-05-31"],["CHUDY",4000,"1991-05-17"],["KIJEK",2500,"1991-05-03"],["ŁYSY",1000,"1991-04-19"]]
  .map(([name, sc, date], i) => ({ name, score:sc, date, diff: i < 3 ? 3 : i < 6 ? 2 : 1, reached: ["KONIEC","KONIEC","BABIE DOŁY","DZIAŁKI","DZIAŁKI","LEŚNE","ESTAKADA","ESTAKADA","OSIEDLE","OSIEDLE"][i] }));
let hiscores = null;
function hsLoad() {
  if (hiscores) return hiscores;
  try { const v = JSON.parse(localStorage.getItem(HS_KEY)); if (Array.isArray(v) && v.length) hiscores = v; } catch(e) {}
  if (!hiscores) hiscores = HS_SEED.map(e => ({ ...e }));
  return hiscores;
}
function hsSave() { try { localStorage.setItem(HS_KEY, JSON.stringify(hiscores)); } catch(e) {} }
function hsQualifies(sc) { const t = hsLoad(); return sc > 0 && (t.length < HS_MAX || sc > t[t.length-1].score); }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDate(iso) { const p = String(iso).split("-"); return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : iso; }
function hsReached() {
  if (game.maze && game.maze.solo) return "PAGIETY";
  if (game.out5) return "KONIEC";
  return LEVELS[game.lv] ? LEVELS[game.lv].name : "OSIEDLE";
}
function hsCheck(reached, next) {                   // koniec podejścia: wynik w tabeli? → wpisz imię
  if (game.scoreLogged || !hsQualifies(score)) { next(); return; }
  game.scoreLogged = true;
  let last = "FRANKO"; try { last = localStorage.getItem("obluze_name") || last; } catch(e) {}
  const name = [...last.toUpperCase()].slice(0, HS_NAME_MAX);
  game.hs = { score, reached, diff:difficulty, next, name, cur:Math.min(name.length, HS_NAME_MAX-1), t:0, rep:0, lastDir:null, fresh:true };
  game.state = "hiname"; SFX.pickup();
}
const HS_OK = { x: VW/2+8, y: 206, w: 92, h: 18 }, HS_DEL = { x: VW/2-100, y: 206, w: 92, h: 18 };
function hsSlotX(i) { return VW/2 - HS_NAME_MAX*13 + i*26; }
function updateHiName() {
  const h = game.hs; h.t++;
  pollInput();
  const len = () => h.name.length;
  const put = (ch) => {
    if (h.cur < len()) h.name[h.cur] = ch; else if (len() < HS_NAME_MAX) h.name.push(ch); else return;
    h.cur = Math.min(h.cur + 1, len(), HS_NAME_MAX-1);
  };
  const del = () => { if (h.cur >= len()) h.name.pop(); else h.name.splice(h.cur, 1); h.cur = Math.min(h.cur, len()); };
  const cycle = (d) => {
    const curCh = h.name[h.cur] ?? " ";
    const i = (HS_CHARS.indexOf(curCh) + d + HS_CHARS.length) % HS_CHARS.length;
    if (h.cur < len()) h.name[h.cur] = HS_CHARS[i]; else if (len() < HS_NAME_MAX) h.name.push(HS_CHARS[i]);
  };
  let ok = false;
  for (const ch of input.typed) {
    if (ch === "\n") ok = true;
    else if (ch === "\b") { del(); h.fresh = false; }
    else { if (h.fresh) { h.name = []; h.cur = 0; h.fresh = false; } put(ch); }     // pierwsza litera zastępuje stare imię
  }
  // gałka / strzałki: ▲▼ litera, ◀▶ pozycja (z autopowtarzaniem)
  const dir = input.ay < -0.5 ? "U" : input.ay > 0.5 ? "D" : input.ax < -0.5 ? "L" : input.ax > 0.5 ? "R" : null;
  let act = null;
  if (dir !== h.lastDir) { act = dir; h.rep = 16; } else if (dir && --h.rep <= 0) { act = dir; h.rep = 5; }
  h.lastDir = dir;
  if (act) h.fresh = false;
  if (act === "U") cycle(-1); else if (act === "D") cycle(1);
  else if (act === "L") h.cur = Math.max(0, h.cur - 1);
  else if (act === "R") h.cur = Math.min(h.cur + 1, len(), HS_NAME_MAX-1);
  const tapIn = (r) => input.tapX !== null && input.tapX > r.x && input.tapX < r.x + r.w && input.tapY > r.y && input.tapY < r.y + r.h;
  if (input.tapX !== null && input.tapY > 128 && input.tapY < 160) {    // dotknięcie pola = kursor
    for (let i = 0; i < HS_NAME_MAX; i++) if (Math.abs(input.tapX - (hsSlotX(i) + 11)) < 13) h.cur = Math.min(i, len());
  }
  if (input.kickHit || tapIn(HS_DEL)) del();
  if (h.t > 20 && (ok || input.punchHit || tapIn(HS_OK))) {
    const name = h.name.join("").trim().slice(0, HS_NAME_MAX) || "FRANKO";
    try { localStorage.setItem("obluze_name", name); } catch(e) {}
    const t = hsLoad(), entry = { name, score:h.score, date:todayISO(), diff:h.diff, reached:h.reached };
    t.push(entry); t.sort((a, b) => b.score - a.score); t.length = Math.min(t.length, HS_MAX); hsSave();
    game.hsView = { highlight:entry, next:h.next, t:0 }; game.hs = null; game.state = "hitable"; SFX.go();
  }
}
